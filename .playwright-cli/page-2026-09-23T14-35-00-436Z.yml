      - generic [ref=e224]:
        - paragraph [ref=e225]: 【A股盘面】今日三大指数全天震荡走低集体收跌，上证跌0.39%报3936.52点（开盘-0.02%近似平开），深证跌0.64%（开盘+0.14%），创业板跌0.60%（开盘+0.37%）。量能明显萎缩至1.76万亿，较昨日缩量3706亿。上涨1843家，下跌3422家，涨跌中位数-0.61%。盘面上玻璃基板/PCB产业链、半导体材料设备、CRO/医药概念逆势走强；AI应用（传媒/游戏/AI营销）、数字货币、电力/电网设备、煤炭化工、油气、黄金、商业航天等概念集体弱势。
        - paragraph [ref=e226]: 【资金与结构】主力资金全天净流出，大单资金出逃明显，小单资金接盘。结构上资金从AI应用/传媒高位题材撤退，转向半导体/PCB等硬件方向，但半导体午后也现分化。机构加医药、减周期路径清晰，龙虎榜中医药股占净买入前十6席，科达制造遭机构净卖出5.49亿。高位股分歧加大，炸板率30%，晋级率21.4%。
        - paragraph [ref=e227]: 【AI预测】8项预测5项命中：半导体设备材料✓（康强电子涨停，板块走强）、光学光电/消费电子✓、汽车零部出海✓、贵金属/黄金✓（领跌）、油气开采/炼化贸易✓（领跌）；未命中3项：通信设备/光模块✗（午后走弱，中际旭创净流出）、电网设备与特高压✗（板块下行）。后续关注半导体能否持续放量，以及通信设备能否止跌。
        - paragraph [ref=e228]: 【板块轮动与机会】低位轮动特征明显：①PCB/玻璃基板（康宁涨价+京东方投资计划，产业链全线走强）；②半导体材料设备（真武V900+长鑫G5+海光CPU1000，国产算力突破）；③CRO/医药（创新药审批改善，临床CRO需求复苏）；④房地产（贴息政策传闻，午后回落但连板股维持）。回避高位AI应用/传媒退潮风险。
        - paragraph [ref=e229]: 【风险与避险】外部变量：美联储鹰派+10Y美债5%高位压制高估值成长；习近平访美期间消息密度极高，重大事件落地前后不追高。内部风险：节前效应+成交缩量3700亿，资金避险情绪上升；高位股炸板率30%逼近风险阈值，若明日升至35%需果断降仓。建议仓位4.5-5.5成，现金≥4成，不追高、不满仓、等冰点。
