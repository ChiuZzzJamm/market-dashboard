  openStkModal(it.c, it.n, it.t);
}
function openStkModal(code, name, note) {
  code = (code || '').trim();
  name = (name || '').trim();
  TB_OPEN = false; tbShowArrows(); // R98g：标的模式隐藏板块箭头
  var nav = STK_GRP && STK_GRP.length > 1;
  document.getElementById('stk-prev').style.display = nav ? 'flex' : 'none';
  document.getElementById('stk-next').style.display = nav ? 'flex' : 'none';
  document.getElementById('stk-modal-head').innerHTML =
    '<span class="nm">' + esc(name || '') + '</span>' +
    (code ? '<span class="cd2">' + esc(code) + '</span>' : '') +
    (nav ? '<span class="cd2">' + (STK_IDX + 1) + '/' + STK_GRP.length + '</span>' : '') +
    '<button class="db-modal-close" onclick="stkClose()">×</button>';
  document.getElementById('stk-modal-meta').innerHTML =
    (note ? esc(note) + '<br>' : '') +
    '<span class="lab">日K线（前复权 · 近30根）· 点击K线柱查看当日涨幅与成交量</span>';
  var box = document.getElementById('stk-kline');
  box.innerHTML = '<div class="db-empty">K线加载中…</div>';
  document.getElementById('stk-modal').classList.add('open');
  var done = false;
  function render(kl, err) {
    if (done) return;
    done = true;
    box.innerHTML = (kl && kl.length > 1) ? dbKlineSvg(kl) : '<div class="db-empty">' + esc(err || '暂无K线数据') + '</div>';
  }
  if (code) { stkFetchKline(code, render); return; }
  if (name) {
    // R98c: 名称 → 代码映射已由 embed_klines.py 内嵌（板块领涨TOP 等无 code 标的），命中则免 smartbox 反查
    var mapped = ((window.DASHBOARD_DATA || {}).stkKlineNames || {})[name];
    if (mapped) {
      var hd0 = document.getElementById('stk-modal-head');
      var cd0 = hd0.querySelector('.cd2');
      if (!cd0) { cd0 = document.createElement('span'); cd0.className = 'cd2'; hd0.insertBefore(cd0, hd0.querySelector('.db-modal-close')); }
      cd0.textContent = mapped;
      stkFetchKline(mapped, render);
      return;
    }
    stkResolveByName(name, function (fullCode, nm) {
      if (done) return;
      if (!fullCode) { render(null, '未找到该标的的证券代码，无法获取K线'); return; }
      var hd = document.getElementById('stk-modal-head');
      var cdSpan = hd.querySelector('.cd2');
      if (!cdSpan) { cdSpan = document.createElement('span'); cdSpan.className = 'cd2'; hd.insertBefore(cdSpan, hd.querySelector('.db-modal-close')); }
      cdSpan.textContent = fullCode;
      stkFetchKline(fullCode, render);
    });
    return;
  }
  render(null, null);
}
function stkClose() { TB_OPEN = false; document.getElementById('stk-modal').classList.remove('open'); }
// R98b：板块 TOP10 点击看K线（数据已预加载在后端，无需再fetch）
// R98e：K线从 _TB_KL 注册表按板块名取（onclick 内联 JSON 双引号会截断 HTML 属性，已废弃）
// R98g：左右箭头在 TOP10 内快速切换（与标的K线弹窗同款 .db-nav），键盘 ←/→ 同样路由
var TB_OPEN = false, TB_IDX = 0, TB_NAV_OFF = false; // R99h：TB_NAV_OFF=板块异动胶囊弹窗（无 TOP10 箭头/键盘路由）
function tbShowArrows() {
  var nav = TB_OPEN && !TB_NAV_OFF && window._TB_LIST && window._TB_LIST.length > 1;
  document.getElementById('tb-prev').style.display = nav ? 'flex' : 'none';
  document.getElementById('tb-next').style.display = nav ? 'flex' : 'none';
}
function tbStep(delta) {
  if (!TB_OPEN || TB_NAV_OFF || !window._TB_LIST || window._TB_LIST.length < 2) return;
  TB_IDX = (TB_IDX + delta + window._TB_LIST.length) % window._TB_LIST.length;
  var nm = window._TB_LIST[TB_IDX];
  openBoardKlineByName(nm);
}
function openBoardKlineByName(name) {
  var list = window._TB_LIST || [];
  var i = list.indexOf(name);
  if (i >= 0) TB_IDX = i; else { list = Object.keys(window._TB_KL || {}); i = list.indexOf(name); TB_IDX = i >= 0 ? i : 0; }
  openBoardKline(name, (window._TB_KL || {})[name]);
}
function openBoardKline(name, kline) {
  if (!kline || kline.length < 2) return;
  TB_OPEN = true;
  TB_NAV_OFF = false; // R99h：TOP10 板块弹窗恢复箭头/键盘路由
  var list = window._TB_LIST || [];
  var nav = list.length > 1;
  document.getElementById('stk-modal-head').innerHTML =
    '<span class="nm">' + esc(name || '') + '</span>' +
    '<span class="cd2">同花顺行业板块</span>' +
    (nav ? '<span class="cd2">' + (TB_IDX + 1) + '/' + list.length + '</span>' : '') +
    '<button class="db-modal-close" onclick="stkClose()">×</button>';
  document.getElementById('stk-modal-meta').innerHTML =
    '<span class="lab">日K线（近30根）· 点击K线柱查看当日涨幅与成交量</span>';
  document.getElementById('stk-kline').innerHTML = dbKlineSvg(kline);
  document.getElementById('stk-modal').classList.add('open');
  document.getElementById('stk-prev').style.display = 'none';
  document.getElementById('stk-next').style.display = 'none';
  tbShowArrows();
}

/* ===== R99h：A股页板块异动胶囊点击看板块日K（同花顺行业口径） =====
   数据两级来源：① 16:00 update_ashare_sectors 内嵌 s.kline（renderReasons 已注册进 _SEC_KL）；
   ② 无内嵌时前端 JSONP 实时拉 d.10jqka.com.cn/v4/line/bk_<thsCode>/01/last.js。
   回调名为 URL 固定值（quotebridge_v4_line_bk_<code>_01_last），用 defineProperty 拦截
   全局赋值（R98q 新浪同款手法）；script 标签加载不受 CORS 限制，referrerPolicy=no-referrer。 */
var _SEC_KL_FAIL = {};
function thsBoardKlineJsonp(thsCode, cb) {
  var cbName = 'quotebridge_v4_line_bk_' + thsCode + '_01_last';
  var s = document.createElement('script');
  var done = false;
  var timer = setTimeout(function () { finish(null); }, 9000);
  function finish(d) {
    if (done) return;
    done = true;
    clearTimeout(timer);
    try { delete window[cbName]; } catch (e) { try { window[cbName] = undefined; } catch (e2) {} }
    if (s.parentNode) s.parentNode.removeChild(s);
    cb(d);
  }
  try {
    Object.defineProperty(window, cbName, { configurable: true,
      get: function () { return function (d) { finish(d); }; },
      set: function (f) { finish(typeof f === 'function' ? f : null); }
    });
  } catch (e) { window[cbName] = function (d) { finish(d); }; }
  s.src = 'https://d.10jqka.com.cn/v4/line/bk_' + encodeURIComponent(thsCode) + '/01/last.js';
  s.referrerPolicy = 'no-referrer';
  s.onerror = function () { finish(null); };
  document.head.appendChild(s);
}
function thsParseKline(d) {
  try {
    var bars = String((d || {}).data || '').split(';'), out = [];
    bars.forEach(function (bar) {
      var p = bar.split(',');
      if (p.length < 6) return;
      var day = p[0];
      if (day.length === 8) day = day.slice(0, 4) + '-' + day.slice(4, 6) + '-' + day.slice(6);
      var o = parseFloat(p[1]), h = parseFloat(p[2]), l = parseFloat(p[3]), c = parseFloat(p[4]), v = parseFloat(p[5]);
      if (isNaN(o) || isNaN(c) || isNaN(h) || isNaN(l)) return;
      out.push([day, o, c, h, l, v]);
    });
    return out.length > 1 ? out.slice(-30) : null;
  } catch (e) { return null; }
}
function openSectorKline(name, thsCode) {
  if (!thsCode) return;
  TB_OPEN = true;
  TB_NAV_OFF = true; // 板块异动胶囊弹窗无 TOP10 箭头/键盘路由（R99h）
  document.getElementById('stk-modal-head').innerHTML =
    '<span class="nm">' + esc(name || '') + '</span>' +
    '<span class="cd2">同花顺行业板块</span>' +
    '<button class="db-modal-close" onclick="stkClose()">×</button>';
  document.getElementById('stk-modal-meta').innerHTML =
    '<span class="lab">日K线（近30根）· 点击K线柱查看当日涨幅与成交量</span>';
  document.getElementById('stk-kline').innerHTML = '<div class="db-empty">K线加载中…</div>';
  document.getElementById('stk-modal').classList.add('open');
  document.getElementById('stk-prev').style.display = 'none';
  document.getElementById('stk-next').style.display = 'none';
  tbShowArrows();
  var kl = (window._SEC_KL || {})[thsCode];
  if (kl && kl.length > 1) {
    document.getElementById('stk-kline').innerHTML = dbKlineSvg(kl);
    return;
  }
  if (_SEC_KL_FAIL[thsCode]) {
    document.getElementById('stk-kline').innerHTML = '<div class="db-empty">板块K线获取失败，请稍后重试</div>';
    return;
  }
  thsBoardKlineJsonp(thsCode, function (d) {
    var kl2 = thsParseKline(d);
    if (kl2) {
      window._SEC_KL = window._SEC_KL || {};
      window._SEC_KL[thsCode] = kl2;
      document.getElementById('stk-kline').innerHTML = dbKlineSvg(kl2);
    } else {
      _SEC_KL_FAIL[thsCode] = true;
      document.getElementById('stk-kline').innerHTML = '<div class="db-empty">板块K线获取失败，请稍后重试</div>';
    }
  });
}

function buildOpenOutlookHtml(o, title) {
  // R99f：标题补回灰色角标日期（与其他模块 h2Date 同款式）
  var html = '<div class="wk-card"><div class="wk-head"><h2>' + title +
    (o.date ? ' <span class="h2-date">' + esc(o.date) + '</span>' : '') + '</h2></div>' +
    '<div class="wk-outlook">' + formatOutlook(o.content) + '</div>';
  if (o.source) html += '<div class="wk-src">来源：' + esc(o.source) + '</div>';
  html += '</div>';
  return html;
}

// R99e：标题只保留「周X开盘前瞻」，日期不再重复显示（用户要求删除原 h2 内日期与灰色角标两处重复）
function wkTitle(dateStr) {
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var d = new Date(String(dateStr || '').replace(/-/g, '/'));
  var w = isNaN(d.getTime()) ? '' : WD[d.getDay()];
  return w + '开盘前瞻';
}
function renderOpenOutlook() {
  // 每日开盘前瞻（R72）：顶层 openOutlook 带日期，前端按日期显示、过期自动隐藏。
  // R97g 后续修复：开盘前瞻由 08:30 自动化生成（date=当日），但每天 0:00–08:30
  // 当日前瞻尚未生成、openOutlook.date 仍停在昨日时，原逻辑会判定"过期"直接隐藏，
  // 偏偏盘前正是用户最想看前瞻的时刻。故放宽隐藏阈值：≤3 天内的缓冲版仍显示并标注真实日期。
  var D = window.DASHBOARD_DATA;
  var o = D.openOutlook;
  var box = document.getElementById('weekend-news');
  if (!o || !box) return;
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var fmt = function (dt) { return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); };
  var now = new Date();
  var day = now.getDay();
  var isWeekend = (day === 0 || day === 6);
  // target：应当匹配的日期（工作日=今天；周末=下周一）
  var target;
  if (!isWeekend) {
    target = fmt(now);
  } else {
    var diff = (8 - day) % 7; if (diff === 0) diff = 1;
    var nm = new Date(now); nm.setDate(now.getDate() + diff);
    target = fmt(nm);
  }
  // 1) 日期精确匹配：正常显示
  if (o.date === target) {
    var title = wkTitle(o.date);
    box.innerHTML = buildOpenOutlookHtml(o, title);
    box.style.display = '';
    return;
  }
  // 2) 缓冲期：o.date 不等于 target，但距今天 ≤3 天 → 仍显示并标注真实日期（避免盘前空白）
  var od = new Date(o.date.replace(/-/g, '/'));
  var diffDays = Math.floor((now - od) / 86400000);
  if (!isNaN(od.getTime()) && diffDays >= 0 && diffDays <= 3) {
    var sub;
    if (!isWeekend) {
      var genLabel = (day <= 4) ? '今日 08:30' : '周一 08:30';
      sub = wkTitle(o.date) + '（' + esc(o.date) + ' 昨日版，' + genLabel + '前瞻待生成）';
    } else {
      sub = wkTitle(o.date) + '（' + esc(o.date) + ' 周五版 · 周一盘前参考）';
    }
    box.innerHTML = buildOpenOutlookHtml(o, sub);
    box.style.display = '';
    return;
  }
  // 3) 真正过期（>3 天未更新）：隐藏
  box.innerHTML = '';
  box.style.display = 'none';
}

document.getElementById('updatedAt').textContent = '数据更新：' + window.DASHBOARD_DATA.updatedAt;

  function closeChips() {

      var pop = c.querySelector('.chip-pop'); if (pop) pop.remove();

    if (chip.classList.contains('lb-click')) { closeChips(); return; }
    // R94：带 data-stk 的成分股/标的芯片点击 → 通用K线弹窗（code|name|note，无 code 时按名称反查）
    var stk = chip.getAttribute('data-stk');

      closeChips();
      var sp = String(stk).split('|');
      // R94b：箭头仅在同一内容分组内切换——取芯片最近的分组容器（要闻影响组/题材条目/AI板块/板块TOP）内的全部标的
      STK_GRP = null; STK_IDX = 0;
      var gbox = chip.closest ? chip.closest('.stock-chips, .nc-stocks, .reason-tops, .idx-grid, .star-chips') : null;
      if (gbox) {

          STK_GRP = [];
          for (var gi = 0; gi < gchips.length; gi++) {
            var gp = String(gchips[gi].getAttribute('data-stk')).split('|');
            STK_GRP.push({ c: gp[0] || '', n: gp[1] || '', t: gp[2] || '' });
            if (gchips[gi] === chip) STK_IDX = gi;
          }
        }
      }
      openStkModal(sp[0] || '', sp[1] || '', sp[2] || '');
      return;
    }
    var wasOpen = chip.classList.contains('expanded');
    closeChips();
    if (!wasOpen) {
      chip.classList.add('expanded');
      var nt = chip.querySelector('.nt');
      if (nt) {
        var pop = document.createElement('div');
        pop.className = 'chip-pop';
        pop.textContent = nt.textContent;
        chip.appendChild(pop);
        // 手机端：弹层超出视口底部时翻到芯片上方，避免被裁切
        var popRect = pop.getBoundingClientRect();
        if (popRect.bottom > window.innerHeight - 4) {
          pop.style.top = 'auto';
          pop.style.bottom = 'calc(100% + 5px)';
        }
      }
    }
  });
