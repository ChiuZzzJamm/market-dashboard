<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>每日市场看板 · A股 / 美股</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="data.js?v=202610032015"></script>
<style>
  /* ===== 雾霾蓝主题（ins 风） ===== */
  :root {
    --bg: #f2f7fc;
    --paper: #ffffff;
    --ink: #2b333c;
    --ink2: #5a6e82;
    --line: #e3ecf4;
    --up: #f0435c;          /* 涨：珊瑚红（加深 2026-09-18） */
    --down: #0f9d78;        /* 跌：绿色（加深 2026-09-18） */
    --up-soft: #ffe7ea;
    --down-soft: #def5ee;
    --accent: #4aa8e0;      /* 雾霾蓝 */
    --accent-deep: #2b6cb0; /* 深蓝 */
    --accent-soft: #e6f2fb;
    --radius: 20px;
    --shadow: 0 10px 30px rgba(17,17,26,.07);
    --hero-grad: linear-gradient(135deg, var(--accent-soft), var(--bg));
    --font: "Microsoft YaHei", "微软雅黑", "PingFang SC", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    line-height: 1.75; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 22px 80px; }

  /* ===== Hero ===== */
  .hero {
    background: var(--hero-grad);
    border-radius: 28px;
    padding: 30px 34px 26px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .hero h1 { font-size: 32px; font-weight: 900; letter-spacing: 3px; color: var(--ink); }
  .hero .sub { margin-top: 6px; color: var(--ink2); font-size: 13.5px; letter-spacing: 3px; }
  .hero .updated { margin-top: 10px; display: block; width: 100%; text-align: center; font-size: 11px; color: var(--ink2); background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9); border-radius: 999px; padding: 7px 16px; white-space: nowrap; }

  .schedule-note { font-size: 11px; color: var(--ink2); background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9); border-radius: 999px; padding: 7px 16px; display: block; margin: 8px 0 0; text-align: center; white-space: nowrap; width: 100%; }
  @media (max-width: 900px) { .schedule-note, .hero .updated { white-space: normal; } }

  /* ===== Tabs（胶囊） ===== */
  .tabbar { display: flex; justify-content: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px; margin-bottom: 26px; width: fit-content; margin-left: auto; margin-right: auto; box-shadow: var(--shadow); }
  .tab { padding: 9px 34px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--ink2); border-radius: 999px; letter-spacing: 2px; transition: all .25s ease; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: #fff; background: var(--accent); box-shadow: 0 6px 16px rgba(0,0,0,.10); }

  /* ===== 卡片 ===== */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .card h2, .ai-card h2, .wk-card h2 { font-size: 17px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 9px; margin: 0 0 16px; }
  .card h2::before, .ai-card h2::before, .wk-card h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex-shrink: 0; }
  .status-line { font-size: 13px; color: var(--accent-deep); font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
  .summary { font-size: 15px; }
  .idx-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .idx { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(17,17,26,.05); text-align: center; }
  .idx .nm { font-size: 13px; color: var(--ink2); }
  .idx .pt { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .idx .pc { font-size: 14px; font-weight: 700; }
  .idx .nt { font-size: 11px; color: var(--ink2); }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink2); }
  .breadth { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13.5px; align-items: center; color: var(--ink2); margin-top: 14px; }
  .breadth b { font-size: 16px; }
  .chart { width: 100%; height: 340px; }
  .chart-tall { width: 100%; height: 380px; }
  .reason-block { background: var(--accent-soft); border-left: 4px solid var(--accent-deep); border-radius: 12px; padding: 13px 16px; margin-bottom: 12px; }
  .reason-block.rz-up { border-left-color: var(--up); }
  .reason-block.rz-down { border-left-color: var(--down); }
  .reason-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
  .reason-head .date-tag { background: var(--accent-deep); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
  .reason-head .kw { font-size: 16px; font-weight: 800; color: var(--ink); }
  .reason-head .sec { font-size: 12px; color: var(--ink); font-weight: 700; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
  .reason-head .pct { font-size: 12px; font-weight: 800; color: #fff; border-radius: 999px; padding: 3px 12px; }
  .reason-head .pct.u { background: var(--up); }
  .reason-head .pct.d { background: var(--down); }
  /* 板块成分股 TOP 列表：标题 + 每只为红涨绿跌小胶囊（白字） */
  .reason-tops { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 10px; font-size: 12.5px; }
  .reason-tops .tops-h { font-size: 12.5px; color: var(--accent-deep); font-weight: 700; margin-right: 2px; }
  /* R97f：板块口径来源标签 + 异动副行 */
  .pano-src { font-size: 12px; color: var(--ink2); margin: 2px 0 8px; }
  .src-tag { font-size: 12px; font-weight: 500; color: var(--ink2); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; margin-left: 8px; }
  .reason-sub { font-size: 12.5px; color: var(--ink2); margin: 4px 0 2px; }
  .reason-sub b.up { color: var(--up); }
  .reason-sub b.down { color: var(--down); }
  .reason-tops .tchip { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px 9px; font-size: 12px; box-shadow: 0 1px 3px rgba(30,60,110,.06); display: inline-flex; align-items: center; gap: 5px; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .reason-tops .tchip .nt { display: none; }
  .reason-tops .tchip.expanded { background: var(--accent-soft); overflow: visible; z-index: 40; }
  .reason-tops .tchip b { font-weight: 700; color: var(--ink); white-space: nowrap; }
  .reason-tops .tchip .tp { font-weight: 700; font-size: 11.5px; white-space: nowrap; }
  .reason-tops .tchip .tp.u { color: var(--up); }
  .reason-tops .tchip .tp.d { color: var(--down); }
  .reason-body { font-size: 13.5px; color: var(--ink); }
  .reason-body b.label { display: block; margin-bottom: 2px; color: var(--ink2); }
  .src-line { font-size: 12px; color: var(--ink2); margin-top: 10px; }
  .note-line { font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }
  .outlook { font-size: 14.5px; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }

  /* ===== AI 预测 ===== */
  .ai-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .ai-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .ai-head h2 { margin: 0; }
  .ai-summary { font-size: 14.5px; margin-bottom: 16px; }
  .ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .ai-grid { grid-template-columns: 1fr; } }
  .ai-item { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; }
  .ai-item .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .ai-item .sec-nm { font-size: 14px; font-weight: 700; }
  .dir-badge { font-size: 11.5px; font-weight: 700; color: #fff; border-radius: 999px; padding: 2px 9px; }
  .persp-tag { font-size: 10.5px; font-weight: 600; color: var(--ink2); border: 1px solid var(--line, #d8dee6); border-radius: 999px; padding: 1.5px 8px; margin-left: 6px; white-space: nowrap; line-height: 1.45; }
  .dir-up { background: var(--up); }
  .dir-down { background: var(--down); }
  /* 置信度：低→浅蓝，中→中蓝，高→深蓝 */
  .conf-badge { font-size: 11px; border-radius: 999px; padding: 2px 9px; font-weight: 700; margin-left: 6px; line-height: 1.45; border: 1px solid currentColor; } /* R100y：全站徽标统一带边框 */
  /* R100z11：预期差徽章（price-in 结构化字段落前端）——三档配色对应 4c 结论三选一 */
  .exp-badge { font-size: 11px; border-radius: 999px; padding: 2px 9px; font-weight: 700; margin-left: 6px; line-height: 1.45; border: 1px dashed currentColor; cursor: help; }
  .exp-add { color: var(--up); }        /* 加确认 */
  .exp-hold { color: var(--ink2); }     /* 维持 */
  .exp-trim { color: var(--down); }     /* 兑现降级 */
  .conf-low { background: #dcebfa; color: #4a90d9; }
  .conf-mid { background: #85b9ea; color: #fff; }
  .conf-high { background: #2b6cb0; color: #fff; }
  .ai-item .drv { font-size: 12px; color: var(--ink2); margin-bottom: 3px; }
  .ai-item .lgc { font-size: 12.5px; color: var(--ink); margin-bottom: 8px; }
  .stock-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
  .stock-chip { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px 7px; font-size: 12px; min-width: 0; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; }
  .stock-chip b { font-weight: 700; white-space: nowrap; }
  .stock-chip .cd { color: var(--ink2); font-size: 10.5px; margin-left: 3px; white-space: nowrap; }
  .stock-chip .nt { display: block; font-size: 10.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stock-chip.expanded { background: var(--accent-soft); overflow: visible; z-index: 40; }
  .chip-pop { position: absolute; left: -6px; right: -6px; top: calc(100% + 5px); z-index: 50; background: var(--paper); border: 1px solid var(--accent); border-radius: 10px; box-shadow: 0 8px 20px rgba(43,51,60,.15); padding: 7px 9px; font-size: 11px; line-height: 1.55; color: var(--ink); white-space: normal; text-align: left; cursor: default; }
  .ai-foot { margin-top: 14px; font-size: 12px; color: var(--ink2); border-top: 1px solid var(--line); padding-top: 10px; }
  .ai-verify { margin-top: 10px; font-size: 12.5px; background: var(--accent-soft); border: 1px solid #cfe3f5; border-radius: 12px; padding: 10px 14px; color: var(--ink); }
  .ai-verify .v-title { font-weight: 700; margin-bottom: 4px; }
  .ai-verify .v-detail { font-size: 12px; line-height: 1.7; }
  .ai-verify .v-detail .hit { color: var(--up); font-weight: 700; }
  .ai-verify .v-detail .miss { color: var(--down); font-weight: 700; }
  /* R100z13：最近 5 个预测日的命中横条（读 calibration_log.json，取不到就整块不渲染） */
  .cal-hist { margin: 6px 0 4px; }
  .cal-hist-t { font-size: 11px; color: var(--ink2); margin-bottom: 4px; }
  .cal-bar { display: flex; gap: 4px; }
  .cal-seg { flex: 1; text-align: center; font-size: 10px; line-height: 1.6; padding: 3px 0;
    border: 1px solid currentColor; border-radius: 4px; color: var(--ink2); }
  .cal-seg.cal-hit { color: var(--up); }
  .cal-seg.cal-mid { color: #d8a33a; }
  .cal-seg.cal-miss { color: var(--down); }
  .ai-verify .v-note { display: block; font-weight: 400; font-size: 11.5px; color: var(--ink-soft, #6b7a8d); margin-top: 1px; }

  /* ===== R100z15：退出纪律 + 超额口径 + 净值曲线 ===== */
  .exit-row { margin-top: 4px; font-size: 11px; color: var(--ink-soft, #6b7a8d); line-height: 1.55; }
  /* R100z20：板块下方的批量退出纪律罗列已下线（同板块挤 3-8 行又与胶囊标签重复），
     退出纪律统一只在「点开个股 → 弹窗」里显示 → 颜色规则收窄到 .exit-line */
  .exit-line .xs { color: var(--down); }
  .exit-line .xt { color: var(--up); }
  /* R100z18：弹窗内单条退出纪律行（止损/目标/证伪） */
  .exit-row.exit-line { margin-top: 6px; margin-bottom: 2px; padding: 6px 8px; border-radius: 5px;
    background: var(--down-soft, rgba(15,157,120,.07)); border: 1px solid var(--down-soft, rgba(15,157,120,.18)); }
  .exit-row .xb { color: #98a6b5; }
  .excess-dot { display: inline-block; padding: 0 5px; margin-left: 4px; border-radius: 3px; font-size: 10.5px;
    border: 1px dashed currentColor; vertical-align: 1px; }
  .excess-dot.pos { color: var(--up); }
  .excess-dot.neg { color: var(--down); }
  .pf-box { margin: 8px 0 2px; }
  .pf-stat { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; margin-top: 4px; }
  .pf-stat span { padding: 2px 6px; border-radius: 4px; border: 1px solid currentColor; color: var(--ink2); }
  .pf-stat .up { color: var(--up); }
  .pf-stat .down { color: var(--down); }
  .pf-stat .flat { color: var(--ink2); }

  /* ===== 推演块（fin-strategy-engine 三候选推演，内嵌题材掘金/要闻/预测等模块条目，R99m） ===== */
  .dd-box { margin: 8px 0 2px; background: var(--accent-soft); border: 1px dashed var(--line); border-radius: 12px; padding: 9px 13px; font-size: 12.5px; line-height: 1.75; }
  .dd-cand { margin: 1px 0; }
  .dd-tag { display: inline-block; font-weight: 700; color: var(--accent-deep); margin-right: 4px; }
  .dd-elim { color: var(--ink2); font-size: 11.5px; }
  .dd-main { font-weight: 600; }
  /* R100c：确信度徽章挪至利好/利空卡标题行（nc-theme），主推行不再内嵌 */
  .nc-theme .conf-badge { margin-left: 6px; }
  .dd-counter { display: block; margin-top: 3px; margin-bottom: 4px; color: #b06a2c; font-weight: 400; font-size: 11.5px; }

  /* ===== 全球要闻 / 周末 ===== */
  .wk-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .wk-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .wk-head h2 { margin: 0; }
  .wk-head .date { font-size: 12.5px; color: var(--ink2); }
  /* 卡片 h2 内日期角标（主力资金流向等，R98f；R99e 扩展到 AI 预测卡） */
  .card h2 .h2-date, .ai-card h2 .h2-date, .wk-card h2 .h2-date { font-size: 12.5px; color: var(--ink2); font-weight: 400; margin-left: 8px; }
  .wk-summary { font-size: 14.5px; margin-bottom: 16px; line-height: 1.7; }
  .wk-section { margin: 22px 0 14px; padding-top: 16px; border-top: 1px solid var(--line); }
  .wk-section h4 { font-size: 14px; font-weight: 700; margin: 0 0 6px 0; color: var(--accent-deep); letter-spacing: 1px; }
  .wk-section h4.bull { color: var(--up); }
  .wk-section h4.bear { color: var(--down); }
  .wk-item { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
  /* R97b：宏观/财经/投行每条要闻左侧竖向色条——红=看涨、绿=看跌、灰=中性 */
  .wk-item.wk-dir-up { border-left: 4px solid var(--up); }
  .wk-item.wk-dir-down { border-left: 4px solid var(--down); }
  .wk-item.wk-dir-flat { border-left: 4px solid #9aa4af; }
  .wk-item .thm { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
  .wk-item .dtl { font-size: 12.5px; color: var(--ink2); line-height: 1.6; }
  .wk-stock-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .wk-section.intl h4 { color: var(--accent-deep); }
  .wk-section.bank h4 { color: #6b4ea2; }
  .wk-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .wk-tags .tag { font-size: 11.5px; background: var(--accent-soft); border-radius: 8px; padding: 2px 9px; color: var(--accent-deep); }
  .nc-src { font-size: 11.5px; color: var(--ink2); margin-top: 7px; }
  .wk-item .nc-theme { font-size: 13.5px; font-weight: 800; margin-bottom: 3px; }
  .wk-item .nc-dtl { font-size: 12.5px; color: var(--ink); line-height: 1.6; margin-bottom: 8px; min-height: 0; }
  .wk-item .nc-imp { margin-top: 6px; padding-top: 7px; border-top: 1px dashed var(--line); }
  .wk-item .nc-imp-theme { font-size: 12px; font-weight: 700; color: var(--accent-deep); }
  .wk-item .nc-stocks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; margin-top: 6px; }
  .news-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .news-cols .news-cell { min-width: 0; }
  .news-cell.ghost-slot { visibility: hidden; padding: 0; border: none; background: none; }
  @media (max-width: 700px) {
    .news-cols { grid-template-columns: 1fr; }
    .news-cols .nc-head.bull { order: 1; }
    .news-cols .p-bull { order: 2; }
    .news-cols .nc-head.bear { order: 3; }
    .news-cols .p-bear { order: 4; }
  }
  .nc-head { font-size: 14.5px; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
  .nc-head.bull { color: var(--up); }
  .nc-head.bear { color: var(--down); }
  .news-cell { background: var(--accent-soft); border-radius: 14px; border-left: 4px solid var(--up); padding: 12px 14px; display: flex; flex-direction: column; }
  .news-cell.bear { border-left-color: var(--down); }
  .nc-theme { font-size: 14px; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; min-width: 0; }
  .nc-theme .nc-tt { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nc-dtl { font-size: 13px; color: var(--ink); line-height: 1.65; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: calc(13px * 1.65 * 3); cursor: pointer; }
  .nc-dtl.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; min-height: 0; }
  .nc-dtl b { font-weight: 700; }
  .nc-imp { display: flex; flex-wrap: wrap; align-items: center; } /* R100x：传导链行 flex 垂直居中（主题+期距徽章+个股网格） */
  .nc-imp .nc-stocks { width: 100%; }
  .nc-imp-hz { font-size: 11px; font-weight: 600; color: var(--ink2); background: var(--line); border: 1px solid currentColor; border-radius: 8px; padding: 1px 7px; flex: none; line-height: 1.5; margin-left: 6px; }
  /* 分组间距：顶对齐——分组紧跟摘要排（固定 8px），剩余空间留白在卡片底部，上方不留大空隙 */
  .news-cell .nc-imp { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .nc-imp-theme { font-size: 12.5px; font-weight: 700; color: var(--accent-deep); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .nc-imp-theme::before { content: ''; width: 3px; height: 11px; border-radius: 2px; background: var(--accent); flex: none; }
  .dir-badge { font-size: 11px; font-weight: 700; margin-left: 6px; line-height: 1.45; border: 1px solid currentColor; }
  .persp-tag { font-size: 10px; margin-left: 5px; padding: 1px 6px; }

  /* ===== 悬浮图标组（R99g：🐼/💰 合并为一个整体 #float-group，整组可拖拽+位置记忆，右侧贴近页面内容右缘、垂直居中） ===== */
  .hero { position: relative; }

  @media (max-width: 640px) { .hz-mini svg { width: 128px; height: auto; } .hz-side { font-size: 11px; } .hz-side .hz-lg { font-size: 9.5px; } }  /* R100z4w：手机端迷你图 250px→128px 缩放，参数文本不再被挤成竖条 */

  .db-subtab { padding: 10px 24px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-size: 13.5px; font-weight: 800; color: var(--ink2); cursor: pointer; font-family: var(--font); box-shadow: var(--shadow); transition: all .18s ease; letter-spacing: 1px; }

  .db-src-tag { display: inline-block; font-size: 9.5px; font-weight: 700; color: var(--accent-deep); background: var(--accent-soft); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 2px; line-height: 1.6; }
  .db-kline { position: relative; }

  /* ===== 选股扩展模块（谐波/吸筹/量化/必带数据，2026-09-26） ===== */
  .hz-badge { display:inline-block; font-size:11px; font-weight:700; color:#7a4d00; background:#fff3d6; border:1px solid #f0c36d; border-radius:4px; padding:1px 7px; line-height:1.5; white-space:nowrap; flex-shrink:0; vertical-align:middle; margin-left:4px; }
  /* R100q：技术池标的金框（参考开盘精选金框色，底色不变）——A股/美股页所有标的胶囊共用 */

  .acc-bar i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#f5a26b,var(--accent)); }

  .pw-grd { font-size:10.5px; font-weight:800; border-radius:999px; padding:1px 8px; flex-shrink:0; font-variant-numeric:tabular-nums; color:#fff; background:linear-gradient(135deg,#e35d5d,#c0392b); }

  .tchip .chip-sec { max-width:88px; }

  .pw-gate span.pass { color:#c0392b; background:#fdeaea; border:1px solid #f2c4ca; }
  .pw-gate span.fail { color:#fff; background:#c0392b; }

  /* R100h：清单 .cl-* 样式已随必带数据清单模块下线删除 */

  .hz-info .hz-k { color:var(--ink2); }
  .hz-info .hz-v { font-weight:700; font-variant-numeric:tabular-nums; }

     参数文本 flex:1 贴左填充，迷你图贴右，整行无空档 */
  .hz-strip { flex-basis: 100%; display: flex; align-items: center; gap: 12px; }

<script>
var charts = [];
var currentMarket = 'ashare';
function cls(v) { return v > 0 ? "up" : (v < 0 ? "down" : "flat"); }
function fmtPct(v) { if (v === null || v === undefined) return "—"; return (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
function esc(s) { if (s === null || s === undefined) return ""; return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escAttr(s){ return esc(s).replace(/"/g, '&quot;'); }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function dateTag(tradeDate) { var m = String(tradeDate).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[2] + "月" + m[3] + "日" : ""; }
function formatOutlook(text) {
  if (!text) return '—';
  // 兼容 object {date, content} 与 string 两种格式
  if (typeof text === 'object' && text !== null) text = text.content || text.text || '';
  text = String(text || '');
  // 按「【」标题分段，每段渲染成 <p> 实现网页内换行；微信推送端保持原始连续文本
  var segs = text.split(/(?=【)/).filter(function(s){ return s.trim(); });
  if (segs.length <= 1) return '<p style="margin:0 0 10px 0; line-height:1.7;">' + esc(text) + '</p>';
  return segs.map(function(seg){ return '<p style="margin:0 0 10px 0; line-height:1.7;">' + esc(seg.trim()) + '</p>'; }).join('');
}

// R98j：指数点击看K线——sym 优先取脚本生成的 code 字段，历史数据按名称映射兜底
var IDX_SYM = { '上证指数': 'sh000001', '深证成指': 'sz399001', '创业板指': 'sz399006', '科创50': 'sh000688', '上证50': 'sh000016' };
function renderIndexCards(indices) {
  indices = indices || [];
  var html = '<div class="idx-grid">';
  indices.forEach(function (d) {
    var c = cls(d.changePct);
    var sym = String(d.code || IDX_SYM[d.name] || '').trim();
    var t0 = sym ? ' data-stk="' + escAttr(sym + '|' + (d.name || '') + '|指数日K') + '" style="cursor:pointer" title="点击查看K线"' : '';
    html += '<div class="idx"' + t0 + '><div class="nm">' + esc(d.name) + '</div>' +
      '<div class="pt ' + c + '">' + (d.point === null || d.point === undefined ? "—" : d.point.toLocaleString("zh-CN", { minimumFractionDigits: 2 })) + '</div>' +
      '<div class="pc ' + c + '">' + fmtPct(d.changePct) + '</div>' +
      (d.note ? '<div class="nt">' + esc(d.note) + '</div>' : '') + '</div>';
  });
  return html + '</div>';
}

function renderBreadth(b) {
  b = b || {};
  var items = [];
  if (b.up !== null && b.up !== undefined) {
    items.push('上涨 <b class="up">' + b.up + '</b> 家');
    items.push('下跌 <b class="down">' + b.down + '</b> 家');
    if (b.flat) items.push('平盘 <b>' + b.flat + '</b> 家');
    if (b.limitUp !== null && b.limitUp !== undefined) items.push('涨停 <b class="up">' + b.limitUp + '</b> 家');
    if (b.limitDown !== null && b.limitDown !== undefined) items.push('跌停 <b class="down">' + b.limitDown + '</b> 家');
  }
  return '<div class="breadth">' + items.map(function (s) { return '<span>' + s + '</span>'; }).join('') +
    '<span style="color:var(--ink2)">' + esc(b.volumeText || '') + '</span></div>';
}

// 板块成分股 TOP 列表：A股 tops 含成分股 TOP5（涨前5/跌前5），美股 tops 含代表标的（1-2只）。
// 兼容旧数据：仅有 leader 字段时按旧规则归一化。
/* R100n→R100p：全站 code→板块 映射（stkSecOf）：来源=断板双池 / 谐波池 / 开盘精选 / 连板梯队 /
   领涨领跌板块 TOP 成分股。R100p 起主页胶囊不再显示板块徽标，仅弹窗板块徽章（stkSecBadge）使用。
   R100q：新增 AI预测成分 / 九门池 sector / 吸筹池 sector（三脚本已写入）+ 站内其余字段，
   弹窗板块徽章全覆盖（宁缺勿滥：查不到就不显示）。 */
function stkSecOf(code) {
  code = String(code || '');
  if (!/^\d{6}$/.test(code)) return '';
  var M = window._SEC_MAP;
  if (!M) {
    M = {};
    var D = window.DASHBOARD_DATA || {};
    var db = D.duanban || {};
    (db.confirmed || []).concat(db.watching || []).forEach(function (x) { if (x && x.code && x.sector) M[String(x.code)] = x.sector; });
    ((db.star || {}).picks || []).forEach(function (x) { if (x && x.code && x.sector && !M[String(x.code)]) M[String(x.code)] = x.sector; });
    var hz = D.harmonic || {};
    ((hz.confirmPool || []).concat(hz.watchPool || [])).forEach(function (x) { if (x && x.code && x.sector && !M[String(x.code)]) M[String(x.code)] = x.sector; });
    ['ashare'].forEach(function (mk) {
      var A = D[mk] || {};
      (A.lianban || []).forEach(function (x) { if (x && x.code && x.hybk && !M[String(x.code)]) M[String(x.code)] = x.hybk; });
      (A.sectorsUp || []).concat(A.sectorsDown || []).forEach(function (s) {
        (s.tops || []).forEach(function (t) { if (t && t.code && !M[String(t.code)]) M[String(t.code)] = s.name; });
      });
    });
    ((D.aiPrediction || {}).sectors || []).forEach(function (s) {
      (s.stocks || []).forEach(function (t) { if (t && t.code && s.sector && !M[String(t.code)]) M[String(t.code)] = s.sector; });
    });
    ((D.powerScreen || {}).passed || []).forEach(function (x) { if (x && x.code && x.sector && !M[String(x.code)]) M[String(x.code)] = x.sector; });
    ((D.accumulation || {}).scored || []).forEach(function (x) { if (x && x.code && x.sector && !M[String(x.code)]) M[String(x.code)] = x.sector; });
    /* R100v2：全局行业映射兜底（embed_klines.py 写入的顶层 sectorMap，新浪行业全量）——
       题材掘金/全球要闻等不在任何池内的标的也能出板块徽章 */
    var sm = D.sectorMap;
    if (sm) { for (var c in sm) { if (!M[c] && sm[c]) M[c] = sm[c]; } }
    window._SEC_MAP = M;
  }
  return M[code] || '';
}
/* R100o：弹窗标题行板块徽章（代码 与 数量/池标签 之间），替代弹窗内「所属板块：」文字行 */
function stkSecBadge(code) {
  var sec = stkSectorOf(code);
  return sec ? '<span class="chip-sec" style="font-size:11px;max-width:120px;padding:1px 7px;border-radius:4px;margin-left:4px" title="所属板块：' + escAttr(sec) + '">' + esc(sec) + '</span>' : '';
}

/* R100q：技术池归属（断板/谐波/九门/吸筹）——供弹窗技术徽章 + 主页金框共用。
   R100t：池归属并入技术徽章（断板反包·确认池 / 谐波·XX·确认池 单枚徽标），美股代码非 6 位数字天然不命中。 */
function stkTechMeta(code) {
  code = String(code || '');
  if (!/^\d{6}$/.test(code)) return null;
  var T = window._TECH_MAP;
  if (!T) {
    T = { db: {}, hz: {}, pw: {}, acc: {} };
    var D = window.DASHBOARD_DATA || {};
    var db = D.duanban || {};
    (db.confirmed || []).forEach(function (x) { if (x && x.code) T.db[String(x.code)] = '确认池'; });
    (db.watching || []).forEach(function (x) { if (x && x.code && !T.db[String(x.code)]) T.db[String(x.code)] = '观察池'; });
    var hz = D.harmonic || {};
    (hz.confirmPool || []).forEach(function (x) { if (x && x.code) T.hz[String(x.code)] = { p: x.pattern || '谐波', pool: '确认池' }; });
    (hz.watchPool || []).forEach(function (x) { if (x && x.code && !T.hz[String(x.code)]) T.hz[String(x.code)] = { p: x.pattern || '谐波', pool: '观察池' }; });
    ((D.powerScreen || {}).passed || []).forEach(function (x) { if (x && x.code) T.pw[String(x.code)] = 1; });
    ((D.accumulation || {}).scored || []).forEach(function (x) { if (x && x.code) T.acc[String(x.code)] = 1; });
    window._TECH_MAP = T;
  }
  var out = [];
  if (T.db[code]) out.push({ k: 'db', label: '断板反包', pool: T.db[code] });
  if (T.hz[code]) out.push({ k: 'hz', label: '谐波·' + T.hz[code].p, pool: T.hz[code].pool });
  if (T.pw[code]) out.push({ k: 'pw', label: '日线九门' });
  if (T.acc[code]) out.push({ k: 'acc', label: '主力吸筹' });
  return out.length ? out : null;
}
/* 弹窗第二行技术徽章（板块徽章之后）。R100t：确认池/观察池并入对应技术徽章文案——
   谐波命中池 → 单枚金色徽标（谐波·AB=CD · 确认池）；断板命中池 → 断板反包 · 确认池（黄标）。
   noPoolMerge=true（断板弹窗用）时不合并，池归属由弹窗末尾专属徽章承载，避免重复。 */
function stkTechBadgeHtml(code, noPoolMerge) {
  var tags = stkTechMeta(code);
  if (!tags) return '';
  return tags.map(function (t) {
    var merge = !noPoolMerge && t.pool;
    var label = t.label + (merge ? ' · ' + t.pool : '');
    var tip = '技术面归属：' + tags.map(function (x) { return x.label + (x.pool ? '（' + x.pool + '）' : ''); }).join(' · ');
    var style = 'font-size:10.5px;margin-left:0'; // R100z4：谐波/断板合并徽章统一 .hz-badge 默认金色（原谐波专属底色 rgba(232,160,19,.14) 与断板反包 #fff3d6 色不一致，已删）
    return '<span class="hz-badge" style="' + style + '" title="' + escAttr(tip) + '">' + esc(label) + '</span>';
  }).join('');
}
/* 主页标的金框（命中任一技术池 → class="gold-ring"，底色不变，参考开盘精选金框色） */
function stkGoldCls(code) {
  return stkTechMeta(code) ? ' gold-ring' : '';
}
/* R100s→R100t：独立池徽章仅保留开盘精选（断板/谐波池已并入技术徽章文案） */
function stkPoolBadge(code) {
  code = String(code || '');
  if (!/^\d{6}$/.test(code)) return '';
  var P = window._STAR_POOL;
  if (!P) {
    P = {};
    var db = (window.DASHBOARD_DATA || {}).duanban || {};
    ((db.star || {}).picks || []).forEach(function (x) { if (x && x.code) P[String(x.code)] = 1; });
    window._STAR_POOL = P;
  }
  if (!P[code]) return '';
  return '<span style="font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;background:rgba(232,160,19,.14);color:#a86f0e;border:1px solid currentColor">开盘精选</span>';
}

function renderTops(s, isUp) {
  var arr = s.tops || null;
  if (!arr || !arr.length) {
    var l = s.leader;
    if (typeof l === 'object' && l) {
      if (!isUp && l.laggard && l.laggard.name) {
        var g = l.laggard;
        arr = [g.name + ' ' + (g.changePct >= 0 ? '+' : '') + g.changePct + '%'];
      } else if (l.name) {
        arr = [l.name + (l.changePct !== null && l.changePct !== undefined ? ' ' + (l.changePct >= 0 ? '+' : '') + l.changePct + '%' : '')];
      }
    } else if (typeof l === 'string' && l.trim()) {
      arr = l.split(/[；;]/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (!arr.length) arr = [l.trim()];
    }
  }
  if (!arr || !arr.length) return '';
  var n = Math.min(arr.length, 5);
  var label = isUp ? '板块领涨 TOP' + n : '板块领跌 TOP' + n;
  var bname = s.name || '';
  var chips = arr.slice(0, 5).map(function (it, idx) {
    var name, pct, code0 = '';
    if (typeof it === 'object') { name = it.name || ''; pct = it.changePct; code0 = it.code || ''; }
    else if (typeof it === 'string') {
      var mm = it.match(/^(.*?)[\s]*([+-]?\d+(?:\.\d+)?%?)\s*([^【]*?)(【[^】]*】)?\s*$/);
      if (mm) { name = mm[1].replace(/[：:]\s*$/, ''); pct = parseFloat(mm[2]); var tail = (mm[3] || '').trim(); if (mm[4]) tail += ' ' + mm[4]; if (tail) name = (name ? name + ' ' : '') + tail; }
      else { name = it; pct = null; }
    }
    var cls = (pct === null || pct === undefined) ? '' : (pct >= 0 ? 'u' : 'd');
    var pctStr = (pct === null || pct === undefined) ? '' : (pct >= 0 ? '+' : '') + pct + '%';
    // 悬停/点击信息：所属板块 + 领涨/领跌位次 + 今开涨跌幅（盘中形态）
    var op = (typeof it === 'object' && it) ? it.openPct : null;
    var info = name + (pctStr ? ' ' + pctStr : '');
    if (bname) info += ' · ' + bname + (isUp ? ' 领涨第' : ' 领跌第') + (idx + 1) + '位';
    if (op !== null && op !== undefined) info += ' · 今开 ' + (op >= 0 ? '+' : '') + op + '%' + (op > 1 ? '（高开）' : op < -1 ? '（低开）' : '（平开）');
    // R100p：弧色标注与主页板块徽标已删（用户要求），板块只在弹窗标题行显示（stkSecBadge）
    return '<span class="tchip' + stkGoldCls(code0) + '" data-stk="' + escAttr(code0) + '|' + escAttr(name) + '|' + escAttr(info) + '" title="' + escAttr(info + '（点击查看K线）') + '"><b>' + esc(name) + '</b>' + (pctStr ? '<span class="tp ' + cls + '">' + pctStr + '</span>' : '') + riskBadge(code0) + '<span class="nt">' + esc(info) + '</span></span>';
  }).join('');
  return '<div class="reason-tops"><span class="tops-h">' + label + '</span>' + chips + '</div>';
}

function renderReasons(list, tradeDate, isUp) {
  list = list || [];
  var html = '';
  var tag = dateTag(tradeDate);
  list.forEach(function (s) {
    // R98b：兼容无 reason 的板块条目（同花顺/东财行业页直接生成，无 AI 异动原因）
    var hasReason = !!(s.reason && s.reason.title);
    // 板块名与涨跌幅合并为一枚胶囊：涨=红底白字，跌=绿底白字；无涨跌幅时退回白底胶囊
    // R99h：板块胶囊点击看板块日K（同花顺行业口径，与断板页 TOP10 板块K线同款弹窗）；
    // 有 thsCode 才可点；脚本内嵌的 s.kline（16:00 update_ashare_sectors 附带）注册进 _SEC_KL 供弹窗直读
    var klAttr = s.thsCode ? ' onclick="openSectorKline(\'' + esc(s.name) + '\',\'' + esc(s.thsCode) + '\')" title="点击查看板块日K线" style="cursor:pointer"' : '';
    if (s.kline && s.thsCode) { window._SEC_KL = window._SEC_KL || {}; window._SEC_KL[s.thsCode] = s.kline; }
    var pctHtml = (s.pct !== null && s.pct !== undefined)
      ? '<span class="pct ' + (s.pct >= 0 ? 'u' : 'd') + '"' + klAttr + '>' + esc(s.name) + ' ' + fmtPct(s.pct) + '</span>'
      : '<span class="sec"' + klAttr + '>' + esc(s.name) + '</span>';
    html += '<div class="reason-block ' + (isUp === false ? 'rz-down' : 'rz-up') + '"><div class="reason-head">' +
      pctHtml +
      (hasReason ? '<span class="kw">' + esc(s.reason.title) + '</span>' : '') +
      '</div>' +
      renderTops(s, isUp) +
      ((s.upCount !== null && s.upCount !== undefined) ? '<div class="reason-sub">板块内 涨 <b class="up">' + s.upCount + '</b> 家 / 跌 <b class="down">' + (s.downCount || 0) + '</b> 家' + (s.netInflow !== null && s.netInflow !== undefined ? ' · 主力净流入 <b class="' + (s.netInflow >= 0 ? 'up' : 'down') + '">' + (s.netInflow >= 0 ? '+' : '') + s.netInflow + ' 亿</b>' : '') + '</div>' : '') +
      (hasReason ? '<div class="reason-body"><b class="label">行业原因（' + esc(tag) + '发布）：</b>' + esc(s.reason.detail) + '</div>' : '') +
      (s.deduce ? renderDeduce(s.deduce) : '') +
      '</div>';
  });
  return html;
}

function barOption(names, values, unit) {
  var up = cssVar('--up'), down = cssVar('--down'), ink = cssVar('--ink'), ink2 = cssVar('--ink2'), line = cssVar('--line');
  var FONT = 'Microsoft YaHei, 微软雅黑, PingFang SC, sans-serif';
  return {
    textStyle: { fontFamily: FONT },
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      formatter: function (ps) { var p = ps[0]; return '<b>' + p.name + '</b><br/>' + (p.value > 0 ? '+' : '') + p.value + unit; },
      backgroundColor: 'rgba(255,255,255,0.96)', borderColor: line, textStyle: { color: ink, fontSize: 12 }, extraCssText: 'box-shadow:0 2px 8px rgba(0,0,0,0.08);border-radius:10px;'
    },
    grid: { left: 10, right: 60, top: 18, bottom: 18, containLabel: true },
    xAxis: {
      type: 'value',
      axisLabel: { fontSize: 11, color: ink2, formatter: function (v) { return (v > 0 ? '+' : '') + v + unit; } },
      splitLine: { lineStyle: { type: 'dashed', color: line } },
      axisLine: { show: false }, axisTick: { show: false }
    },
    yAxis: {
      type: 'category', inverse: true, data: names,
      axisLabel: { fontSize: 12.5, color: ink, fontWeight: 600 },
      axisLine: { show: false }, axisTick: { show: false }
    },
    series: [{
      type: 'bar', barWidth: 16,
      data: values.map(function (v) {
        return { value: v, itemStyle: { color: v >= 0 ? up : down, borderRadius: v >= 0 ? [0, 8, 8, 0] : [8, 0, 0, 8] } };
      }),
      label: {
        show: true, position: 'right', fontSize: 11.5, color: ink, fontWeight: 600,
        formatter: function (p) { return (p.value > 0 ? '+' : '') + p.value + unit; }
      }
    }]
  };
}

/* R99e→R99g：A股/美股各自记忆浏览位置（sessionStorage 持久化，重进页面不丢）；
   切换后定位下限=tab 区顶部（用户要求：从 tab/内容区开始，而不是页首 hero），有更深的记忆位置则恢复 */
var mktScroll = { ashare: 0, us: 0 };
try {
  var _ms = JSON.parse(sessionStorage.getItem('mktScroll') || 'null');
  if (_ms && typeof _ms.ashare === 'number' && typeof _ms.us === 'number') mktScroll = _ms;
} catch (e) {}
function saveMktScroll() { try { sessionStorage.setItem('mktScroll', JSON.stringify(mktScroll)); } catch (e) {} }
function syncMktToggle() {
  var t = document.getElementById('mkt-toggle');
  if (!t) return;
  // 图标显示「当前所在市场」：A股页显示 🐼，美股页显示 🦅（R99f）
  t.textContent = currentMarket === 'ashare' ? '🐼' : '🦅';
  t.title = currentMarket === 'ashare' ? '切换到美股看板' : '切换到A股看板';
}
function switchTab(market) {
  if (currentMarket !== market) {
    mktScroll[currentMarket] = window.scrollY || document.documentElement.scrollTop || 0;
    saveMktScroll();
  }
  document.getElementById('tab-a').classList.toggle('active', market === 'ashare');
  document.getElementById('tab-u').classList.toggle('active', market === 'us');
  currentMarket = market;
  render(market);
  syncMktToggle();
  var tabEl = document.querySelector('.tabbar');
  var tabTop = tabEl ? tabEl.getBoundingClientRect().top + (window.scrollY || document.documentElement.scrollTop || 0) - 12 : 0;
  var target = Math.max(mktScroll[market] || 0, tabTop);
  mktScroll[market] = target;
  saveMktScroll();
  window.scrollTo(0, target);
}

/* R99e：板块卡 h2 灰色更新时间角标（A股=数据交易日；美股=tradeDate，自带「（美东）」后缀） */
function h2Date(d) {
  return (d && d.tradeDate) ? ' <span class="h2-date">' + esc(d.tradeDate) + '</span>' : '';
}

function render(market) {
  charts.forEach(function (c) { c.dispose(); });
  charts = [];
  var d = window.DASHBOARD_DATA[market] || {};
  var isA = market === 'ashare';

  var html = '';
  html += '<div class="card"><div class="status-line">' + esc(d.tradeDate) + ' · ' + esc(d.status) + '</div><div class="summary">' + esc(d.summary) + '</div></div>';

  html += '<div class="card"><h2>大盘指数' + h2Date(d) + '</h2>' + renderIndexCards(d.indices) + '<div style="height:10px"></div>' + renderBreadth(d.breadth) + '</div>';

  html += '<div class="card"><h2>大盘趋势研判' + h2Date(d) + '</h2><div class="outlook">' + formatOutlook(d.outlook) + '</div></div>';

  var _ssMap = {'ths': '同花顺行业口径', 'em': '东财行业口径', 'prev': '上一轮数据'};
  var _ssTag = _ssMap[d.sectorSource] ? ' <span class="src-tag">' + _ssMap[d.sectorSource] + '</span>' : '';
  html += '<div class="card"><h2>领涨板块' + _ssTag + h2Date(d) + '</h2>' + renderReasons(d.sectorsUp, d.tradeDate, true) + '</div>';

  html += '<div class="card"><h2>调整 / 领跌板块' + _ssTag + h2Date(d) + '</h2>' +
    (d.sectorNote ? '<div class="src-line">' + esc(d.sectorNote) + '</div>' : '') +
    renderReasons(d.sectorsDown, d.tradeDate, false) + '</div>';

  // R98j：题材掘金仅 A股页展示（美股页模块已按用户要求下线）
  if (isA && d.themePicks && d.themePicks.length) {
    html += '<div class="card"><h2>题材掘金 · 个股事件驱动' + h2Date(d) + '</h2>' + renderThemePicks(d.themePicks, d.tradeDate) + '</div>';
  }

  if (isA && d.lianban && d.lianban.length) {
    var lbHtml = renderLianban(d.lianban);
    if (lbHtml) {
      html += '<div class="card"><h2>🔥 连板梯队' + h2Date(d) + '</h2>' + lbHtml + '</div>';
    }
  }

  // R100m：主力吸筹已移至「🧰 技术看板」第 4 子页（db-acc），主页面不再渲染（用户 2026-09-28 要求）。
  // 谐波形态 / 量化九门此前已移入子页（R100i），子页渲染见 renderDuanban()。

  // 主力资金流向紧贴行业全景上方（2026-09-20 用户要求：挪到行业全景上面）
  if (isA) {
    html += '<div class="card"><h2>主力资金流向' + (d.tradeDate ? '<span class="h2-date">' + esc(d.tradeDate) + '</span>' : '') + '</h2>';
    if (d.fundNote) html += '<div class="note-line">' + esc(d.fundNote) + '</div>';
    html += '<div id="chart-fund" class="chart-tall"></div></div>';
  }

  // R100i：谐波形态 / 量化九门（日线九门）已移至「🧰 工具箱」断板反包页内的独立子页，
  // 主页面不再重复渲染（用户在 2026-09-28 要求"主页面里的谐波和九门都挪进对应板块"）。
  // 子页渲染见 renderDuanban() 内 db-hz / db-pw 容器。

  document.getElementById('content').innerHTML = html;

  // R97：全球要闻（含宏观/财经/投行）独立渲染到 #news-slot——紧贴行业全景上方（2026-09-23 用户要求）
  var newsBox = document.getElementById('news-slot');
  if (newsBox) newsBox.innerHTML = renderNewsCard(d, market);

  if (isA) {
    var fIn = d.fundIn || [], fOut = d.fundOut || [];
    var fNames = fIn.map(function (f) { return f.name; }).concat(fOut.map(function (f) { return f.name; }));

function normPanoName(n) {

function mergePanoItems(items) {

    merged[key].subs++;

/* fin-strategy-engine 三候选推演块（R99m：内嵌题材掘金/要闻/预测等模块条目，不再单独成卡）
   入参 dd 形如：
   { cands:[{tag:'事件驱动',text:'…',eliminate:'…'},{tag:'情绪驱动',text:'…',eliminate:'…'}],
     main:'…', conf:'推测', counter:'…' }
   缺失字段自动跳过，保证向后兼容（老数据无 deduce 不报错） */
/* R99o：AI 生成值偶发自带「主推：/反证：」前缀，统一剥掉防重复；全空 deduce 返回空串不渲染 */
/* R100z18：改为**循环全剥**——外层由来渲染层补「主推：/反证：」标签，只剥一层时
   AI 若已写「反证：反证：…」（或夹不可见字符/换行）会漏剥 → 页面出现「反证：反证：…」双标签。
   任一轮无变化即收手，最多 4 轮防死循环。 */
function _ddClean(t) {
  var s = String(t || '');
  for (var i = 0; i < 4; i++) {
    var before = s;
    s = s.trim().replace(/^[\s\u3000\u200b]*主推[:：]\s*/, '').replace(/^[\s\u3000\u200b]*反证[:：]\s*/, '');
    if (s === before) break;
  }
  return s.trim();
}
/* R100c：确信度徽章抽成独立函数——主推行不再内嵌徽章；利好/利空卡挪到标题行（nc-theme），
   异动板块/题材掘金保持原位（hideBadge 传 true 即隐藏） */
function deduceConfBadge(dd) {
  if (!dd || !dd.conf) return '';
  var cf = String(dd.conf);
  var cls = cf.indexOf('高') >= 0 ? 'conf-high' : (cf.indexOf('中') >= 0 ? 'conf-mid' : 'conf-low');
  return '<span class="conf-badge ' + cls + '">' + esc(cf) + '</span>';
}
function renderDeduce(dd, hideBadge) {
  if (!dd) return '';
  var main = _ddClean(dd.main), counter = _ddClean(dd.counter);
  var cands = (dd.cands || []).filter(function (c) { return c && ((c.text || '').trim() || (c.tag || '').trim()); });
  if (!main && !counter && !cands.length) return '';
  var h = '<div class="dd-box">';
  /* 主推+反证在前（R99n：置于候选上方），确信度徽章复用 AI 预测 .conf-badge 三级配色 */
  if (main) {
    h += '<div class="dd-main">主推：' + esc(main) + (hideBadge ? '' : deduceConfBadge(dd)) + '</div>';
    if (counter) h += '<div class="dd-counter">反证：' + esc(counter) + '</div>';
  } else if (counter) {
    h += '<div class="dd-counter">反证：' + esc(counter) + '</div>';
  }
  cands.forEach(function (c, idx) {
    h += '<div class="dd-cand">▸ 候选' + String.fromCharCode(65 + idx) + '｜' + esc(c.tag || '') +
      '：' + esc(c.text || '') +
      (c.eliminate ? ' <span class="dd-elim">（淘汰：' + esc(c.eliminate) + '）</span>' : '') + '</div>';
  });
  h += '</div>';
  return h;
}

/* R100z11：预期差徽章——把 4c 的 price-in 结构化字段落到 AI 预测卡（无 exp 字段则渲染空串，旧数据不受影响） */
function expBadge(exp) {

  var cls = map[String(exp.verdict || '')] || 'hold';

  var title = '预期层[E] · price-in ' + (pi === null ? '未量化' : (pi + '%')) +
    '｜依据：' + (exp.priceInBasis || '未填') +

/* R100z15 缺口③：退出纪律行（止损 / 目标 / 证伪）。
   取数优先级：标的自带 st.exit（16:00 流程写回）> stock_pool.json 里的机械池 exit（异步兜底）。
   两者都取不到就这一行不渲染，绝不猜一个止损位糊上去。 */
var POOL_EXIT = null;

function loadPoolExit(cb) {
  if (POOL_EXIT !== null) { cb && cb(); return; }
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'stock_pool.json', true);
    xhr.onload = function () {
      if (xhr.status !== 200) { POOL_EXIT = false; return; }
      try {
        var d = JSON.parse(xhr.responseText), m = {};
        var by = (d && d.bySector) || {};
        Object.keys(by).forEach(function (k) {
          (by[k] || []).forEach(function (x) { if (x && x.code && x.exit) m[String(x.code)] = x.exit; });
        });
        POOL_EXIT = m;
      } catch (e) { POOL_EXIT = false; }
      cb && cb();
    };
    xhr.send();
  } catch (e) { POOL_EXIT = false; cb && cb(); }
}

/* R100z18：退出纪律统一取数（按码查，供 AI 预测行 / 个股弹窗 / 断板弹窗共用）。
   优先级：机械选股池 exit（异步兜底）> AI 预测内嵌 st.exit（16:00 写回）> 谐波形态几何。
   谐波是**技术指标自带**的止损/目标（stop=形态失效位、target1=一级目标），
   使弹窗对谐波池标的无需任何写回也有退出纪律；实在取不到就整行不渲染，绝不编一个止损位糊上去。 */
function exitForCode(code0, st, allowFb) {
  code0 = String(code0 || '').replace(/\D/g, '');
  if (!code0) return null;
  // ① 机械选股池（stock_pool.json 异步到货）
  if (POOL_EXIT && typeof POOL_EXIT === 'object') {
    var ex0 = POOL_EXIT[code0];
    if (ex0 && typeof ex0 === 'object') return ex0;
  }
  // ② AI 预测写回的内嵌 exit
  if (st && st.exit && typeof st.exit === 'object') return st.exit;
  var secs = ((window.DASHBOARD_DATA || {}).aiPrediction || {}).sectors || [];
  for (var i = 0; i < secs.length; i++) {
    var arr = (secs[i] && secs[i].stocks) || [];
    for (var j = 0; j < arr.length; j++) {
      if (String((arr[j] && arr[j].code) || '').replace(/\D/g, '') === code0 &&
          arr[j].exit && typeof arr[j].exit === 'object') return arr[j].exit;
    }
  }
  // ③ 谐波形态（含失效池回退的「失效前」几何）：技术指标天然带止损/目标
  var hz = (typeof findHarmonic === 'function' ? findHarmonic(code0) : null) ||
           (typeof hzFailOf === 'function' ? hzFailOf(code0) : null);
  if (hz && hz.stop !== null && hz.stop !== undefined) {
    return { stop: hz.stop, target: hz.target1,
             falsify: '跌破 ' + hz.stop + ' 元（D 点结构失效位）——谐波形态作废，无条件离场',
             stopBasis: '谐波 D 点结构失效位（前复权）', src: 'harmonic' };
  }
  // ④ R100z19 统一口径兜底：机械池/AI内嵌/谐波三级都拿不到时，用顶层内嵌 K 线最近收盘
  //    按全站统一纪律（−2.5% / +6%）折算止损目标。口径与 build_stock_pool.py 的
  //    stoploss_basis/falsify_of 一致，basis 自述「统一纪律位，非形态位」——不自称形态位，
  //    也不编造不存在的技术位。取不到有效收盘价就返回 null，绝不给空数字。
  if (allowFb !== false) {
    var kl = stkGlobalKline(code0);
    var rows = stkParseKline(kl);
    if (rows && rows.length) {
      var lastC = rows[rows.length - 1][2];   // [date, open, close, high, low, vol]
      if (isFinite(lastC) && lastC > 0 && lastC < 10000) {
        var isDb = fbIsDuanban(code0);
        return { stop: Math.round(lastC * 0.975 * 100) / 100,
                 target: Math.round(lastC * 1.06 * 100) / 100,
                 falsify: isDb
                   ? '放量跌破断板日最低价，或反包日冲高回落收阴——断板反包形态失败，无条件离场'
                   : '跌破止损位即形态/纪律失败——无条件离场，不摊不扛',
                 stopBasis: '最近收盘 ' + lastC.toFixed(2) + ' 的 −2.5%（全站统一止损纪律位，非形态位）',
                 src: 'fallback', fb: true };
      }
    }
  }
  return null;
}

/* R100z19：该代码是否属断板池（确认/观察/精选）——用于兜底退出纪律挑对证伪口径。
   取不到就返回 false，不猜。 */
function fbIsDuanban(code0) {
  try {
    var d = (window.DASHBOARD_DATA || {}).duanban || {};
    var pool = [].concat(d.confirmed || [], d.watching || [], d.star || [],
                         (d.star && Array.isArray(d.star)) ? [] : ((d.star && d.star.stocks) || []));
    for (var i = 0; i < pool.length; i++) {
      if (String((pool[i] && pool[i].code) || '').replace(/\D/g, '') === code0) return true;
    }
  } catch (e) { return false; }
  return false;
}

/* R100z18：弹窗内单条退出纪律行——有止损位就给「止损/目标/证伪」三件套，
   只有证伪口径没有止损位（断板池等）时退化为纯证伪行，同样不编数字。 */
function exitMetaLine(code) {
  var ex = exitForCode(code);
  if (!ex || typeof ex !== 'object') return '';
  if (ex.stop === null || ex.stop === undefined) {
    return ex.falsify ? '<div class="exit-row exit-line"><span class="xs">✖</span> ' + esc(ex.falsify) + '</div>' : '';
  }
  return '<div class="exit-row exit-line"><b>退出纪律</b> 止损 ' + Number(ex.stop).toFixed(2) +
    (ex.target !== null && ex.target !== undefined ? ' · 目标 ' + '<span class="xt">' + Number(ex.target).toFixed(2) + '</span>' : '') +
    ' <span class="xs">✖</span> ' + esc(ex.falsify) +
    (ex.stopBasis ? '<span class="xb">（' + esc(ex.stopBasis) + '）</span>' : '') + '</div>';
}

/* R100z15 缺口①：超额口径小胶囊——「走强」两个字要扣掉基准才值钱 */
function excessDot(d) {
  if (!d || d.excessPct === null || d.excessPct === undefined) return '';
  var v = Number(d.excessPct), cls = v >= 0 ? 'pos' : 'neg';
  return '<span class="excess-dot ' + cls + '">超额 ' + (v >= 0 ? '+' : '') + v.toFixed(2) + '%</span>';
}

/* AI 预测分析 */
// R100z13：最近 5 个预测日的命中横条——复用校准台账，让「系统最近准不准」一眼可见。
// 台账取不到（netlify/pages 未发布该文件或本地 file:// 预览）时整块静默不渲染，绝不白屏、绝不报错。
function renderCalHistory() {
  var box = document.getElementById('cal-hist');
  if (!box) return;
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'calibration_log.json', true);
    xhr.onload = function () {
      if (xhr.status !== 200) return;
      try {
        var d = JSON.parse(xhr.responseText);
        var log = (d && d.log) || {};
        var days = Object.keys(log).sort().slice(-5);
        if (!days.length) return;
        var h = '<div class="cal-hist-t">📅 最近 ' + days.length + ' 个预测日的命中率</div><div class="cal-bar">';
        days.forEach(function (dt) {
          var arr = log[dt] || [], scored = 0, got = 0;
          arr.forEach(function (it) {
            if (it.hit === null || it.hit === undefined) return;
            scored++; got += Number(it.hit);
          });
          var r = scored ? got / scored : null;
          var cls = (r === null) ? 'na' : (r >= 0.9 ? 'cal-hit' : (r >= 0.5 ? 'cal-mid' : 'cal-miss'));
          h += '<span class="cal-seg ' + cls + '" title="' + esc(dt) + '：' + scored + ' 条，'
             + '命中分 ' + got.toFixed(1) + (r === null ? '' : '（命中率 ' + Math.round(r * 100) + '%）')
             + '">' + esc(String(dt).slice(5)) + '</span>';
        });
        h += '</div>';
        box.innerHTML = h;
      } catch (e) { /* 台账坏了也不影响主看板 */ }
    };
    xhr.send();
  } catch (e) { /* file:// 下 fetch/XHR 被拦，静默跳过 */ }
}

/* R100z13：个股硬风险黑名单（ST / 解禁 T+2~T+5 / 减持 30 日 / 业绩预减 30 日）。
   risk_blacklist.json 由 stock_risk_blacklist.py --write 产出；取不到就 RISK_BL 保持 null，
   全站不渲染 ❗️ 风险角标，但不影响任何其它逻辑（不白屏、不报错）。 */
var RISK_BL = null;

function loadRiskBlacklist() {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'risk_blacklist.json', true);
    xhr.onload = function () {
      if (xhr.status !== 200) return;
      try {
        var d = JSON.parse(xhr.responseText);
        RISK_BL = (d && d.blacklist) || null;
        // 黑名单是异步到的：已经渲染过一次卡片就重画一遍，把 ⚠️ 角标和汇总行补上
        var aiBox = document.getElementById('ai-prediction');
        if (RISK_BL && aiBox && aiBox.innerHTML) renderAiPrediction();
      } catch (e) { RISK_BL = null; }
    };
    xhr.send();
  } catch (e) { RISK_BL = null; }
}

/* 标的胶囊上的硬风险角标；无命中返回空串 */
function riskBadge(code0) {
  if (!RISK_BL || !code0) return '';
  var hit = RISK_BL[String(code0).replace(/\D/g, '')];
  if (!hit) return '';
  var rs = (hit.reasons || []).join('；');
  return '<span class="risk-dot" title="⚠️ 硬风险（不进 8 只池）：' + escAttr(rs) + '">⚠️</span>';
}

/* R100z15 缺口④：组合净值曲线——命中 60% 但亏钱、命中 50% 但赚钱，光看命中率分不出来。
   组合 = 每个预测日 8 只标的等权平均涨跌幅累乘；基准 = 同日市场基准累乘；下面再挂一条回撤。
   取不到 portfolio_curve.json（未发布 / 本地预览）时整块静默，不白屏、不报错。 */

      if (xhr.status !== 200) return;

          var c = echarts.init(el);

    };
    xhr.send();
  } catch (e) { /* file:// 下被拦，静默跳过 */ }
}

/* R100z13：8 只池里的硬风险标的汇总一行（无命中返回空串）。
   口径与 stock_risk_blacklist.py 一致：ST / 解禁 T+2~T+5 / 减持 30 日 / 业绩预减 30 日。 */
function riskLineHtml(p) {
  if (!RISK_BL || !p || !p.sectors) return '';
  var hits = [];
  p.sectors.forEach(function (s) {
    (s.stocks || []).forEach(function (st) {
      var hit = RISK_BL[String(st.code || '').replace(/\D/g, '')];
      if (hit) hits.push((st.name || st.code || '') + '（' + (hit.reasons || []).join('；') + '）');
    });
  });
  if (!hits.length) return '';
  return '<div class="risk-line">⚠️ 硬风险黑名单命中 ' + hits.length + ' 只，按规则须换股、不进 8 只池：'
    + esc(hits.join('；')) + '</div>';
}

  var box = document.getElementById('ai-prediction');
  if (!p) { box.style.display = 'none'; return; }
  p.sectors = p.sectors || [];
  // R100f：「谐波共振」横幅已按用户要求移除（2026-09-28），谐波交叉徽标保留在谐波模块内
  var html = '<div class="ai-card"><div class="ai-head"><h2>AI 预测分析' + (p.date ? '<span class="h2-date">' + esc(p.date) + '</span>' : '') + '</h2></div>' +
    '<div class="ai-summary">' + (p.indexLine ? esc(p.indexLine) + '。' : '') + '通过隔夜美股各板块涨跌推导今日 A 股强弱方向：' + esc(p.summary) + '</div>' +
    '<div id="cal-hist" class="cal-hist"></div>' +
    '<div id="pf-box" class="pf-box"></div>' +
    riskLineHtml(p) +
    '<div class="ai-grid">';
  p.sectors.forEach(function (s) {
    var isUp = String(s.direction || '').indexOf('承压') === -1;
    var conf = String(s.confidence || '');
    var confCls = conf.indexOf('高') >= 0 ? 'conf-high' : (conf.indexOf('中') >= 0 ? 'conf-mid' : 'conf-low');
    html += '<div class="ai-item"><div class="row1">' +
      '<span class="sec-nm">' + esc(s.sector) + '</span>' +
      '<span class="dir-badge ' + (isUp ? 'dir-up' : 'dir-down') + '">预计' + esc(s.direction) + '</span>' +
      '<span class="conf-badge ' + confCls + '">置信度 ' + esc(s.confidence) + '</span>' +
      expBadge(s.exp) +
      '</div>' +
      '<div class="drv">隔夜驱动：' + esc(s.usDriver) + '</div>' +
      '<div class="lgc">映射逻辑：' + esc(s.logic) + '</div>' +
      (s.deduce ? renderDeduce(s.deduce, true) : (s.counter ? '<div class="dd-box"><div class="dd-counter">反证：' + esc(s.counter) + '</div></div>' : ''));
    if (s.stocks && s.stocks.length) {
      html += '<div class="stock-chips">';
      s.stocks.forEach(function (st) {
        // R100n：技术池边框描边（修复 R100m 漏给 AI 预测候选打标的问题）+ 所属板块胶囊
        var _t1 = st.name + ' ' + st.code + (st.note ? ' · ' + st.note : '') + '（点击查看K线）';
        html += '<span class="stock-chip' + stkGoldCls(st.code) + '" data-stk="' + escAttr((st.code || '') + '|' + (st.name || '') + '|' + (st.note || '')) + '" title="' + escAttr(_t1) + '"><b>' + esc(st.name) + '</b><span class="cd">' + esc(st.code) + '</span>' +
          (st.note ? '<span class="nt">' + esc(st.note) + '</span>' : '') + '</span>';
      });
      html += '</div>';
      // R100z20：板块下方不再重复罗列退出纪律——同板块的多只标的挤在一起既长又和胶囊标签重复，
      // 退出纪律（止损/目标/证伪）统一收敛到「点开个股 → 弹窗内」那一行显示（R100z18/z19）。
    }
    html += '</div>';
  });
  html += '</div><div class="ai-foot">标的筛选口径：每个板块 8 只 A 股，按「2 只板块龙头 + 2 只相关概念股 + 2 只游资/机构偏好小盘人气股（涨停基因好）+ 2 只断板反包图形股（1-5 日前涨停、次日放量倍量、随后缩量回调）」搭配，已排除科创板（688 开头）及北交所。<br>' + esc(p.riskNote) + '</div>';
  if (p.verification) {
    var vHtml = '';
    if (typeof p.verification === 'string') {
      // R99j 兼容：自动化偶发把 verification 写成整段字符串（而非 {summary,details} 对象）
      var vs = String(p.verification).trim();
      if (vs) vHtml = '<div class="ai-verify"><div class="v-title">📊 预测验证</div><div class="v-detail"><div class="hit">' + esc(vs) + '</div></div></div>';
    } else {
    var v = p.verification;
    if (v.summary || (v.details && v.details.length)) {
      vHtml = '<div class="ai-verify"><div class="v-title">📊 预测验证：' + esc(v.summary || '') + '</div>';
      if (v.details && v.details.length) {
        vHtml += '<div class="v-detail">';
        v.details.forEach(function(d) {
          var r = String(d.result || '');
          var vcls = (r.indexOf('未命中') !== -1 || r.indexOf('未兑现') !== -1) ? 'miss' : ((r.indexOf('命中') !== -1 || r.indexOf('兑现') !== -1) ? 'hit' : 'miss');
          vHtml += '<div class="' + vcls + '">· ' + esc(d.sector) + '：预测「' + esc(d.predicted) + '」→ 实际 ' + (d.actualPct === null || d.actualPct === undefined ? '—' : (d.actualPct >= 0 ? '+' : '') + d.actualPct + '%') + ' → ' + esc(d.result) + excessDot(d) + (d.note ? '<span class="v-note">' + esc(d.note) + '</span>' : '') + '</div>';
        });
        vHtml += '</div>';
      }
      vHtml += '</div>';
    }
    // R100z11：标的层面验证（颗粒度下移）——板块方向说对但 8 只全选错，账户照样亏，必须单列一层
    if (v.stockCheck && v.stockCheck.length) {
      vHtml += '<div class="v-detail">';
      v.stockCheck.forEach(function (sc) {
        var avg = (sc.avgPct === null || sc.avgPct === undefined) ? null : Number(sc.avgPct);
        var ag = (sc.alignRate === null || sc.alignRate === undefined) ? null : Number(sc.alignRate);
        var scCls = (ag === null) ? '' : (ag >= 0.75 ? 'hit' : (ag <= 0.375 ? 'miss' : ''));
        var fundTxt = '';
        if (sc.fund) {
          var fm = (sc.fund.avgMainYi === null || sc.fund.avgMainYi === undefined) ? null : Number(sc.fund.avgMainYi);
          var fu = (sc.fund.netInN === null || sc.fund.netInN === undefined) ? null : Number(sc.fund.netInN);
          fundTxt = '，主力净额均值 ' + (fm === null ? '—' : ((fm >= 0 ? '+' : '') + fm.toFixed(2) + ' 亿')) +
            ' / 净流入 ' + (fu === null ? '—' : fu + ' 只') +
            (sc.fund.src ? '（' + esc(sc.fund.src) + '）' : '');
        }
        vHtml += '<div class="' + scCls + '">· ' + esc(sc.sector || '') + '：8 只标的平均 ' +
          (avg === null ? '—' : ((avg >= 0 ? '+' : '') + avg.toFixed(2) + '%')) +
          '，方向一致率 ' + (ag === null ? '—' : (Math.round(ag * 100) + '%')) +
          '（同上涨方向 ' + (sc.hitN === null || sc.hitN === undefined ? '—' : (sc.hitN + '/8')) + '）' +
          fundTxt +
          (sc.note ? '<span class="v-note">' + esc(sc.note) + '</span>' : '') + '</div>';
      });
      vHtml += '</div>';
    }
    }
    html += vHtml;
  }
  html += '</div>';
  box.innerHTML = html;
  renderCalHistory();
  loadPortfolioCurve();
  renderRiskLines();
}

function newsTag(item) {
  // 国内(🇨🇳)/国际(🌍)要闻识别，未命中给 🌐；title 优先（与微信推送一致）
  var DOM = ['国常会','证监会','央行','国务院','工信部','财政部','发改委','中方','我国','国内','A股','港股','政策','十五五','券商','印花税','北向','两融','逆回购','LPR','光博会','算力网','算力大会','人民币','出口','关税'];
  var INTL = ['美联储','美股','纳指','道指','标普','美债','美元','加息','降息','特朗普','白宫','中东','沙特','伊朗','以色列','俄乌','俄罗斯','乌克兰','地缘','油价','原油','黄金','能源','油运','日本','日经','日元','韩国','KOSPI','亚太','欧洲','英国','英伟达','苹果','特斯拉','半导体','芯片'];
  var title = (item.title||'').trim();
  var summary = (item.summary||'').trim();
  var i;
  for (i=0;i<DOM.length;i++) if (title.indexOf(DOM[i])>=0) return '🇨🇳';
  for (i=0;i<INTL.length;i++) if (title.indexOf(INTL[i])>=0) return '🌍';
  var text = title + ' ' + summary;
  for (i=0;i<DOM.length;i++) if (text.indexOf(DOM[i])>=0) return '🇨🇳';
  for (i=0;i<INTL.length;i++) if (text.indexOf(INTL[i])>=0) return '🌍';
  return '🌐';
}

function shortDate(t) {
  // 2026-09-23 → 9/23（新闻发布时间展示用）
  var m = String(t || '').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  return m ? (parseInt(m[2], 10)) + '/' + (parseInt(m[3], 10)) : String(t || '');
}

function newsEntryInner(it, showSrc, tag, tradeDate) {
  // 单条要闻内部内容：板块标签 + 发布时间 + 方向徽标 + 标题简述 + 各板块成分股（8 只四类标的）；全球要闻卡与周末卡共用
  var dirBadge = '';
  if (it.direction) {
    // R97：红底看涨 / 绿底看跌 / 灰底中性（填充色胶囊，与 AI 预测方向徽标同款）
    var dcl = it.direction === '看涨' ? 'dir-up' : (it.direction === '看跌' ? 'dir-down' : 'dir-flat');
    dirBadge = '<span class="dir-badge ' + dcl + '">' + esc(it.direction) + '</span>';
  }
  // R99i：日期徽章（nc-time）按用户要求整体移除——全球要闻/周末卡不再显示「今日 9/23」/「9/23」徽章
  var perspTag = tag ? '<span class="persp-tag">' + esc(tag) + '</span>' : '';
  // R100c：利好/利空卡（短线·盘面）把确信度徽章从主推行挪到标题行；宏观/国际/投行条目徽章整体移除
  var confHead = (tag === '短线·盘面') ? deduceConfBadge(it.deduce) : '';
  var s = '<div class="nc-theme"><span class="nc-tt">' + esc(it.sector || '') + '</span>' + dirBadge + perspTag + confHead + '</div>'; // R100x：标题包 nc-tt 保留省略号，整行 flex 垂直居中
  var dtlFull = (it.title || '') + ' — ' + (it.summary || '');
  s += '<div class="nc-dtl" title="' + escAttr(dtlFull) + '"><b>' + esc(it.title || '') + '</b> — ' + esc(it.summary || '') + '</div>';
  (it.impacts || []).forEach(function (im) {
    if (!im.stocks || !im.stocks.length) return;
    var impTheme = im.theme || im.sector || '';
    s += '<div class="nc-imp">' + (impTheme ? '<span class="nc-imp-theme">' + esc(impTheme) + '</span>' : '') + (im.horizon ? '<span class="nc-imp-hz">' + esc(im.horizon) + '</span>' : '');
    s += '<div class="nc-stocks">';
    im.stocks.forEach(function (st) {
      // R100n：技术池边框描边 + 所属板块胶囊
      var _t0 = (st.name || '') + ' ' + (st.code || '') + (st.note ? ' · ' + st.note : '') + '（点击查看K线）';
      s += '<span class="stock-chip' + stkGoldCls(st.code) + '" data-stk="' + escAttr((st.code || '') + '|' + (st.name || '') + '|' + (st.note || '')) + '" title="' + escAttr(_t0) + '"><b>' + esc(st.name || '') + '</b><span class="cd">' + esc(st.code || '') + '</span>' + (st.note ? '<span class="nt">' + esc(st.note) + '</span>' : '') + '</span>';
    });
    s += '</div></div>';
  });
  if (it.deduce) s += renderDeduce(it.deduce, true); // R100c：徽章已挪至标题行（利好/利空）或移除（宏观/国际/投行）
  if (showSrc && it.source) s += '<div class="nc-src">来源：' + esc(it.source) + '</div>';
  return s;
}

function renderNewsCard(d, market) {
  // A股/美股共用：大标题「全球要闻」，桌面两栏按行配对（同行等高、左右对齐），手机单列组内重排
  if (!d) return '';
  var bn = d.bullNews||[], be = d.bearNews||[];
  // R99d：宏观/财经/投行三栏按方向排序——看涨靠前、中性居中、看跌靠后（稳定排序，同向保持原序）
  function dirRank(d){ return d === '看涨' ? 0 : (d === '看跌' ? 2 : 1); }
  function dirSort(a, b){ return dirRank(a.direction) - dirRank(b.direction); }
  var intl = (d.intlNews||[]).slice().sort(dirSort);
  var bank = (d.bankViews||[]).slice().sort(dirSort);
  var macro = (d.macroNews||[]).slice().sort(dirSort);
  if (!bn.length && !be.length && !intl.length && !bank.length && !macro.length) return '';
  var itemHtml = function (it, dir) {
    return '<div class="news-cell ' + dir + '">' + newsEntryInner(it, false, '短线·盘面', d.tradeDate) + '</div>';
  };
  // 桌面：第 i 行 = 利好第 i 条 + 利空第 i 条（网格同行等高，左右始终对齐）

    html += '</div>';

  if (bank.length) {

  }
  if (d.source) html += '<div class="wk-src">来源：' + esc(d.source) + '</div>';
  html += '</div>';
  return html;

/* 题材掘金 · 个股事件驱动（方案C：在板块级复盘之外补充个股级事件归因）

function renderThemePicks(list, tradeDate) {

    s += '<div class="tp-item' + (it.direction === '看跌' ? ' tp-down' : '') + '">';

    var ev = it.event || it.theme || '';

    if (it.logic) s += '<div class="tp-logic">逻辑传导：' + esc(it.logic) + '</div>';
    if (it.deduce) s += renderDeduce(it.deduce);
    var sts = it.stocks || [];
    if (sts.length) {
      s += '<div class="stock-chips">';
      sts.forEach(function (st) {
        // R97c：chg 规范为带符号百分比；R98j：兼容 AI 写回的 "+2.37%" 字符串（strip % 后解析，防双 %% bug）
        // R100z4f：note 剥离 AI 写入的行情字样尾巴（·今日涨停 / ·涨X% / ·跌X%）——涨跌一律由 chg 字段承载，防「国有大行·涨1.39% · +1.39%」重复与虚构涨停文案
        var ntRaw = String(st.note || '').replace(/·(今日)?(涨停|[涨跌][0-9.]+%)/g, '').replace(/^·|·$/g, '').trim();
        var parts = [];
        if (ntRaw) parts.push(ntRaw);
        var chgN = (typeof st.chg === 'number') ? st.chg : parseFloat(String(st.chg == null ? '' : st.chg).replace('%', ''));
        if (!isNaN(chgN)) parts.push((chgN > 0 ? '+' : '') + chgN.toFixed(2) + '%');
        var note = parts.join(' · ');
        var title = (st.name || '') + ' ' + (st.code || '') + (note ? ' · ' + note : '') + '（点击查看K线）';
        // R99p：命中谐波形态 PRZ 的标的在题材掘金打「谐波✓」徽标（与独立谐波模块交叉）
        var hzTag = (st.code && window.DASHBOARD_DATA.harmonic && window.DASHBOARD_DATA.harmonic.tags) ? window.DASHBOARD_DATA.harmonic.tags[st.code] : null;
        var hzBadge = hzTag ? '<span class="hz-badge">谐波·' + esc(hzTag) + '</span>' : '';
        // R100n：emoji 角标改技术池边框描边 + 所属板块胶囊
        s += '<span class="stock-chip' + stkGoldCls(st.code) + '" data-stk="' + escAttr((st.code || '') + '|' + (st.name || '') + '|' + (note || '')) + '" title="' + escAttr(title) + '"><b>' + esc(st.name || '') + '</b><span class="cd">' + esc(st.code || '') + '</span>' + hzBadge + (note ? '<span class="nt">' + esc(note) + '</span>' : '') + '</span>';
      });
      s += '</div>';
    }
    if (it.why) s += '<div class="tp-why">' + esc(it.why) + '</div>';
    s += '</div>';
  });
  return s;
}

/* ===== 选股扩展模块渲染（2026-09-26 · 谐波 / 吸筹 / 量化 / 必带数据） ===== */
function findHarmonic(code) {
  var h = window.DASHBOARD_DATA.harmonic;
  if (!h) return null;
  var pools = (h.confirmPool || []).concat(h.watchPool || []);
  for (var i = 0; i < pools.length; i++) { if (pools[i].code === code) return pools[i]; }
  return null;
}
/* R100z4x：失效池标的的「失效前」谐波几何（harmonic_detect.py 归档时快照 points/prz/止损/目标位；
   历史失效条目由 backfill_failhz.py 一次性回补）。stage 改写为「失效前」，研判一句话对失效形态不再给出。 */
function hzFailOf(code) {
  var fp = ((window.DASHBOARD_DATA || {}).harmonic || {}).failPool || [];
  for (var i = 0; i < fp.length; i++) {
    var e = fp[i];
    if (e && e.code === code && e.failHz && e.failHz.prz) {
      return Object.assign({}, e.failHz, { stage: '失效前', pattern: e.failHz.pattern || e.pattern, reason: e.reason }); // R100z4y：带上失效原因
    }
  }
  return null;
}
/* R100z4y：失效前形态快照——K 线截断到失效日（failDay，其次 asOf），
   让用户直接看到破位那根 K 线与「失效」竖线，而不是截至今日仍像「运行中」 */
function _hzFailClip(kl, hz) {
  if (!kl || !hz || hz.stage !== '失效前') return kl;
  var cut = hz.failDay || hz.asOf;
  if (!cut) return kl;
  var out = kl.filter(function (b) { return b[0] <= cut; });
  return (out.length > 1) ? out : kl;
}
// R100z4x：失效池弹窗同组导航——STK_GRP=失效归档池全列表，左右箭头/键盘 ←→ 在池内循环
function openFailIdx(kind, idx) {
  var D = window.DASHBOARD_DATA || {};

  STK_IDX = idx;
  var it = fp[idx];
  openStkModal(it.code, (it.name && it.name !== it.code) ? it.name : it.code, '');
}
// R100l：弹窗所属板块——谐波池 sector 优先（harmonic_detect.py 写入），断板反包双池兜底
// R100n：再兜底全站 code→板块 映射（连板梯队 hybk / 领涨领跌 TOP 成分股 / 开盘精选）
function stkSectorOf(code) {
  if (!code) return '';
  var hz = findHarmonic(code);
  if (hz && hz.sector) return hz.sector;
  var db = (window.DASHBOARD_DATA || {}).duanban || {};
  var pools = (db.confirmed || []).concat(db.watching || []);
  for (var i = 0; i < pools.length; i++) {
    if (String(pools[i].code) === String(code) && pools[i].sector) return pools[i].sector;
  }
  return stkSecOf(code);
}

/* R100n：通用标的弹窗消息面——谐波/九门/吸筹卡片点开同样能看到个股利好/利空/中性消息（参考断板反包弹窗）。
   数据优先级叠加：① 断板双池条目（sentiment/story/bullRefs/bearRefs，与断板弹窗同款）；
   ② 全站要闻匹配（bullNews/bearNews/macroNews/intlNews/bankViews 的 impacts 成分股命中该代码，
      方向加权打标：看涨=利好、看跌=利空，同 retag_duanban 思路）；
   ③ 技术池自带说明（谐波 story / 吸筹 note / 九门 reasons）。
   三者可同时出现；完全无信息则不渲染（宁缺勿滥）。 */
// R100z4g：小作文段落统一渲染器——「个股消息/板块消息 + 旗标：」蓝色加粗（.db-refs b），全站弹窗共用。
// 旗标规则（R100z4h 修订）：
// ① 占位段落（「暂无明确利好/利空消息…」）→ 灰色朴素文案（db-ref-sum），无旗标无加粗；
// ② 段落显式带 🇨🇳/🌍/隔夜美股（脚本 _fmt_ref 拼装）→ 原样保留（隔夜美股→🌍）；
// ③ 【】括号式段落：正文以「日期 来源《标题》」引用真实新闻 → 按来源判 🇨🇳/🌍（AI 复核改写会剥旗标但保留引用）；
//    纯叙述（无新闻引用）→ 🤖（AI 写回小作文）。
function dbStoryIsIntlSrc(src) {
  return /彭博|路透|华尔街日报|WSJ|CNBC|纽约时报|金融时报|美联储|隔夜|美股|全球|海外|外盘/.test(String(src || ''));
}
function dbStoryParaHtml(p) {

  var newsFlag = function (body) {
    var nm = String(body || '').match(/^\s*(?:\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}月\d{1,2}日)\s+([^《》：:]{2,25})\s*《/);
    return nm ? (dbStoryIsIntlSrc(nm[1]) ? '🌍' : '🇨🇳') : '';
  };

  if (!m2) return '<div class="db-ref-p">' + esc(s) + '</div>';

function stkNewsHtml(code) {

/* R100g：弹窗右上角谐波迷你示意图——X-A-B-C-D 五点结构折线 + PRZ 绿带
   + 止损红虚线 + T1/T2 蓝虚线。数据直接取 harmonic.points/prz/stop/targets。 */
function hzMiniSvg(hz) {
  try {
    var p = hz && hz.points;
    if (!p || !hz.prz) return '';
    var pts = [['X', p.X], ['A', p.A], ['B', p.B], ['C', p.C], ['D', p.D]];
    var vals = pts.map(function (q) { return q[1]; })
      .concat([hz.prz[0], hz.prz[1], hz.stop, hz.target1, hz.target2]);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var rng = (hi - lo) || 1;
    var W = 250, H = 110, padL = 14, padR = 28, padT = 16, padB = 15; // R100z4y：字母加大 padT 12→16 防顶部裁切
    var span = W - padL - padR;
    var xs = [padL, padL + span * 0.25, padL + span * 0.5, padL + span * 0.75, W - padR];
    function y(v) { return padT + (hi - v) / rng * (H - padT - padB); }
    function f(n) { return n.toFixed(1); }
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    // PRZ 带（绿）
    var py0 = y(hz.prz[0]), py1 = y(hz.prz[1]);
    s += '<rect x="' + padL + '" y="' + f(Math.min(py0, py1)) + '" width="' + span + '" height="' + f(Math.max(2.5, Math.abs(py0 - py1))) + '" fill="rgba(15,157,120,.15)" stroke="#0f9d78" stroke-width="1" stroke-dasharray="3 2"/>';
    // 止损（红）/ T1 T2（蓝）虚线
    [[hz.stop, '#c0392b'], [hz.target1, '#2f6fdb'], [hz.target2, '#2f6fdb']].forEach(function (L) {
      s += '<line x1="' + padL + '" y1="' + f(y(L[0])) + '" x2="' + (W - padR) + '" y2="' + f(y(L[0])) + '" stroke="' + L[1] + '" stroke-width="1" stroke-dasharray="4 3" opacity=".55"/>';
    });
    // 五点结构折线
    var poly = pts.map(function (q, i2) { return f(xs[i2]) + ',' + f(y(q[1])); }).join(' ');
    s += '<polyline points="' + poly + '" fill="none" stroke="#f0435c" stroke-width="2" stroke-linejoin="round"/>';
    pts.forEach(function (q, i3) {

      var lx = i3 === 4 ? xs[i3] + 8 : xs[i3];
      s += '<circle cx="' + f(xs[i3]) + '" cy="' + f(y(q[1])) + '" r="3.5" fill="#fff" stroke="#f0435c" stroke-width="2"/>' +

    });
    s += '</svg>';
    return s;
  } catch (e) { return ''; }
}

/* R100r：标的利好/利空/中性判定（与 stkNewsHtml 同口径）——优先断板双池 sentiment，否则按当日要闻
   impacts 个股方向加权（看涨=利好/看跌=利空，同 retag_duanban 思路）。供谐波/断板卡片内联标注共用。 */
function stkSentiment(code) {
  code = String(code || '').trim();
  if (!/^\d{6}$/.test(code)) return 'neutral';
  var D = window.DASHBOARD_DATA || {};
  var db = D.duanban || {};
  var e = null;
  (db.confirmed || []).concat(db.watching || []).forEach(function (x) { if (!e && String(x.code) === code) e = x; });
  if (e && e.sentiment) return e.sentiment;
  var nB = 0, nBe = 0;
  ['bullNews', 'bearNews', 'macroNews', 'intlNews', 'bankViews'].forEach(function (k) {
    ((D.ashare || {})[k] || []).forEach(function (it) {
      var dir = it.direction === '看涨' ? 'bull' : (it.direction === '看跌' ? 'bear' : 'neutral');
      (it.impacts || []).forEach(function (im) {
        (im.stocks || []).forEach(function (st) { if (String(st.code) === code) { if (dir === 'bull') nB++; else if (dir === 'bear') nBe++; } });
      });
    });
  });
  return nB > nBe ? 'bull' : (nBe > nB ? 'bear' : 'neutral');
}

function dbPoolHtml(title, cls, sub, list, done, poolKey) {

  // 板块分组（R91h 排序口径）：同板块内按上涨概率降序、概率同则利好优先于中性/利空；
  // 板块之间按组内最高上涨概率降序、概率同则组内利好标的更多的板块排前。
  // R89b 紧凑排版：≥3 只的板块独立成组；1~2 只的小板块合并进末尾「其他板块」，
  // 「其他板块」内部同样按 上涨概率→利好 排序（不再按板块名排序），连续排满网格不留空位。
  var sentRank = function (e) { return e.sentiment === 'bull' ? 0 : (e.sentiment === 'bear' ? 2 : 1); };
  var stockCmp = function (x, y) {
    var p = (y.probability || 0) - (x.probability || 0);
    return p !== 0 ? p : sentRank(x) - sentRank(y);
  };
  var groups = {};
  list.forEach(function (e) { var s = e.sector || '其他'; (groups[s] = groups[s] || []).push(e); });
  var maxP = function (a) { return Math.max.apply(null, a.map(function (x) { return x.probability || 0; })); };
  var bullN = function (a) { return a.filter(function (x) { return x.sentiment === 'bull'; }).length; };
  var secKeys = Object.keys(groups).sort(function (a, b) {
    var p = maxP(groups[b]) - maxP(groups[a]);
    return p !== 0 ? p : bullN(groups[b]) - bullN(groups[a]);
  });
  var renderChips = function (arr, secName) {
    arr.forEach(function (e) {
      var key = poolKey + '|' + e.code;

      DB_ORDER.push(key);
      h += dbChipHtml(e, key, done, secName);

  secKeys.forEach(function (s) {
    var arr = groups[s].slice().sort(stockCmp);

    h += '</div>';
  }
  return h + '</div>';
}

/* R99g：🐼/💰 悬浮组合并为一个整体，整组可拖拽（>6px 位移判定为拖动，否则视为点击）+ 位置记忆（floatGroupPos）；
   断板反包页内返回 💰(#db-entry-in) 与组内 💰 位置实时同步（组顶 + 组高 - 46） */
(function () {
  var de = document.getElementById('db-entry');
  var dei = document.getElementById('db-entry-in');
  if (de) de.addEventListener('click', function () { openDuanban(); });
  if (dei) dei.addEventListener('click', function () { closeDuanban(); });
  try { localStorage.removeItem('dbFloatPos'); } catch (e) {} // 清理更早版本的位置键
  var g = document.getElementById('float-group');
  if (!g) return;
  var POS_KEY = 'floatGroupPos', sx = null, sy = 0, ox = 0, oy = 0, moved = false;
  var lastH = 0, lastPos = null; // R100c：断板页组隐藏（rect 全 0），用最后已知组高/位置兜底
  function rect() { return g.getBoundingClientRect(); }
  function trackH() { var r = rect(); if (r.height) lastH = r.height; }
  function grpH() { return lastH || rect().height || (window.innerWidth <= 700 ? 96 : 106); }
  function place(l, t, save) {
    var r = rect(), w = r.width || 46, h = grpH();
    l = Math.max(6, Math.min(l, window.innerWidth - w - 6));
    t = Math.max(6, Math.min(t, window.innerHeight - h - 6));
    g.style.left = l + 'px'; g.style.top = t + 'px';
    g.style.right = 'auto'; g.style.bottom = 'auto'; g.style.transform = 'none';
    lastPos = { l: l, t: t };
    if (dei) {
      dei.style.left = l + 'px'; dei.style.top = (t + h - 46) + 'px';
      dei.style.right = 'auto'; dei.style.bottom = 'auto';
    }
    if (save) {
      try { localStorage.setItem(POS_KEY, JSON.stringify({ lf: l / window.innerWidth, tf: t / window.innerHeight })); } catch (e) {}
    }
  }
  function applySaved() {
    trackH();
    try {
      var p = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
      if (p && isFinite(p.lf) && isFinite(p.tf)) place(p.lf * window.innerWidth, p.tf * window.innerHeight, false);
    } catch (e) {}
  }
  function onMove(e) {
    if (sx === null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    moved = true;
    place(ox + dx, oy + dy, false);
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if (sx === null) return;
    sx = null;
    if (moved && lastPos) place(lastPos.l, lastPos.t, true); // 组隐藏时 rect() 为 0，用内存位置保存
  }
  // R100c：g（🐼+💰 整组）与 dei（断板页返回💰）共用同一套拖拽；拖 dei 时换算为组左上角坐标，两页共享 floatGroupPos
  function bindDrag(el) {
    if (!el) return;
    el.addEventListener('pointerdown', function (e) {
      if (e.button) return;
      sx = e.clientX; sy = e.clientY;
      var r = el.getBoundingClientRect();
      ox = r.left; oy = r.top - (el === dei ? grpH() - 46 : 0);
      moved = false; trackH();
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
    // 拖拽结束后拦截随后派发的 click，避免误触 🐼/💰
    el.addEventListener('click', function (e) {
      if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
    }, true);
  }
  bindDrag(g);
  bindDrag(dei);
  window.addEventListener('resize', applySaved);
  applySaved();
})();
