<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日市场看板 · A股 / 美股</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="data.js?v=202609181040"></script>
<style>
  /* ===== 雾霾蓝主题（ins 风） ===== */
  :root {
    --bg: #f2f7fc;
    --paper: #ffffff;
    --ink: #2b333c;
    --ink2: #5a6e82;
    --line: #e3ecf4;
    --up: #f0435c;          /* 涨：珊瑚红（加深 2026-09-18） */
    --down: #0f9d78;        /* 跌：绿色（加深 2026-09-18） */
    --up-soft: #ffe7ea;
    --down-soft: #def5ee;
    --accent: #4aa8e0;      /* 雾霾蓝 */
    --accent-deep: #2b6cb0; /* 深蓝 */
    --accent-soft: #e6f2fb;
    --radius: 20px;
    --shadow: 0 10px 30px rgba(17,17,26,.07);
    --hero-grad: linear-gradient(135deg, var(--accent-soft), var(--bg));
    --font: "Microsoft YaHei", "微软雅黑", "PingFang SC", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    line-height: 1.75; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 22px 80px; }

  /* ===== Hero ===== */
  .hero {
    background: var(--hero-grad);
    border-radius: 28px;
    padding: 30px 34px 26px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .hero h1 { font-size: 32px; font-weight: 900; letter-spacing: 3px; color: var(--ink); }
  .hero .sub { margin-top: 6px; color: var(--ink2); font-size: 13.5px; letter-spacing: 3px; }
  .hero .updated { margin-top: 10px; display: inline-block; font-size: 12px; color: var(--ink2); background: rgba(255,255,255,.6); border: 1px solid var(--line); border-radius: 999px; padding: 4px 16px; }

  .schedule-note { font-size: 12px; color: var(--ink2); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; display: block; margin: 0 auto 24px; text-align: center; max-width: 920px; box-shadow: var(--shadow); }

  /* ===== Tabs（胶囊） ===== */
  .tabbar { display: flex; justify-content: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px; margin-bottom: 26px; width: fit-content; margin-left: auto; margin-right: auto; box-shadow: var(--shadow); }
  .tab { padding: 9px 34px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--ink2); border-radius: 999px; letter-spacing: 2px; transition: all .25s ease; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: #fff; background: var(--accent); box-shadow: 0 6px 16px rgba(0,0,0,.10); }

  /* ===== 卡片 ===== */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .card h2, .ai-card h2, .wk-card h2 { font-size: 17px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 9px; margin: 0 0 16px; }
  .card h2::before, .ai-card h2::before, .wk-card h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex-shrink: 0; }
  .status-line { font-size: 13px; color: var(--accent-deep); font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
  .summary { font-size: 15px; }
  .idx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .idx { background: linear-gradient(160deg, var(--accent-soft), var(--paper)); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .idx .nm { font-size: 13px; color: var(--ink2); }
  .idx .pt { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .idx .pc { font-size: 14px; font-weight: 700; }
  .idx .nt { font-size: 11px; color: var(--ink2); }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink2); }
  .breadth { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13.5px; align-items: center; color: var(--ink2); margin-top: 14px; }
  .breadth b { font-size: 16px; }
  .chart { width: 100%; height: 340px; }
  .chart-tall { width: 100%; height: 380px; }
  .reason-block { background: var(--accent-soft); border-left: 4px solid var(--accent-deep); border-radius: 12px; padding: 13px 16px; margin-bottom: 12px; }
  .reason-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
  .reason-head .date-tag { background: var(--accent-deep); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
  .reason-head .kw { font-size: 16px; font-weight: 800; color: var(--ink); }
  .reason-head .sec { font-size: 12px; color: var(--ink); font-weight: 700; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
  .reason-head .pct { font-size: 12px; font-weight: 800; color: #fff; border-radius: 999px; padding: 3px 12px; }
  .reason-head .pct.u { background: var(--up); }
  .reason-head .pct.d { background: var(--down); }
  /* 板块成分股 TOP 列表：标题 + 每只为红涨绿跌小胶囊（白字） */
  .reason-tops { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 10px; font-size: 12.5px; }
  .reason-tops .tops-h { font-size: 12.5px; color: var(--accent-deep); font-weight: 700; margin-right: 2px; }
  .reason-tops .tchip { font-size: 12.5px; font-weight: 700; color: var(--ink2); }
  .reason-tops .tchip.u { color: var(--up); }
  .reason-tops .tchip.d { color: var(--down); }
  .reason-body { font-size: 13.5px; color: var(--ink); }
  .reason-body b.label { display: block; margin-bottom: 2px; color: var(--ink2); }
  .src-line { font-size: 12px; color: var(--ink2); margin-top: 10px; }
  .note-line { font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }
  .outlook { font-size: 14.5px; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }

  /* ===== AI 预测 ===== */
  .ai-card { background: linear-gradient(180deg, var(--accent-soft), var(--paper)); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .ai-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .ai-head h2 { margin: 0; }
  .ai-summary { font-size: 14.5px; margin-bottom: 16px; }
  .ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .ai-grid { grid-template-columns: 1fr; } }
  .ai-item { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .ai-item .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .ai-item .sec-nm { font-size: 14px; font-weight: 700; }
  .dir-badge { font-size: 11.5px; font-weight: 700; color: #fff; border-radius: 999px; padding: 2px 9px; }
  .dir-up { background: var(--up); }
  .dir-down { background: var(--down); }
  /* 置信度：低→浅蓝，中→中蓝，高→深蓝 */
  .conf-badge { font-size: 11px; border-radius: 999px; padding: 2px 9px; font-weight: 700; }
  .conf-low { background: #dcebfa; color: #4a90d9; }
  .conf-mid { background: #85b9ea; color: #fff; }
  .conf-high { background: #2b6cb0; color: #fff; }
  .ai-item .drv { font-size: 12px; color: var(--ink2); margin-bottom: 3px; }
  .ai-item .lgc { font-size: 12.5px; color: var(--ink); }
  .stock-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .stock-chip { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px 9px; font-size: 12px; }
  .stock-chip b { font-weight: 700; }
  .stock-chip .cd { color: var(--ink2); font-size: 11px; margin-left: 3px; }
  .stock-chip .nt { display: block; font-size: 10.5px; color: var(--ink2); }
  .ai-foot { margin-top: 14px; font-size: 12px; color: var(--ink2); border-top: 1px solid var(--line); padding-top: 10px; }
  .ai-verify { margin-top: 10px; font-size: 12.5px; background: var(--down-soft); border: 1px solid var(--down-soft); border-radius: 12px; padding: 10px 14px; color: var(--ink); }
  .ai-verify .v-title { font-weight: 700; margin-bottom: 4px; }
  .ai-verify .v-detail { font-size: 12px; line-height: 1.7; }
  .ai-verify .v-detail .hit { color: var(--up); font-weight: 700; }
  .ai-verify .v-detail .miss { color: var(--down); font-weight: 700; }

  /* ===== 全球要闻 / 周末 ===== */
  .wk-card { background: linear-gradient(180deg, var(--accent-soft), var(--paper)); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .wk-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .wk-head h2 { margin: 0; }
  .wk-head .date { font-size: 12.5px; color: var(--ink2); }
  .wk-summary { font-size: 14.5px; margin-bottom: 16px; line-height: 1.7; }
  .wk-section { margin-bottom: 14px; }
  .wk-section h4 { font-size: 14px; font-weight: 700; margin: 0 0 6px 0; color: var(--accent-deep); letter-spacing: 1px; }
  .wk-section h4.bull { color: var(--up); }
  .wk-section h4.bear { color: var(--down); }
  .wk-item { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
  .wk-item .thm { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
  .wk-item .dtl { font-size: 12.5px; color: var(--ink2); line-height: 1.6; }
  .wk-stock-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .news-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; align-items: stretch; }
  @media (max-width: 700px) { .news-cols { grid-template-columns: 1fr; } }
  .nc-head { font-size: 14.5px; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
  .nc-head.bull { color: var(--up); }
  .nc-head.bear { color: var(--down); }
  .news-cell { background: var(--accent-soft); border-radius: 14px; border-left: 4px solid var(--up); padding: 12px 14px; }
  .news-cell.ghost { visibility: hidden; padding: 0; border: none; background: none; }
  .news-cell.bear { border-left-color: var(--down); }
  .nc-theme { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  .nc-dtl { font-size: 13px; color: var(--ink); line-height: 1.65; }
  .nc-dtl b { font-weight: 700; }
  .nc-imp { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .nc-imp-theme { font-size: 12.5px; font-weight: 700; color: var(--accent-deep); }
  .nc-stocks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .nc-chip { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .news-cell.bull .nc-chip { border-color: #f2c4ca; }
  .news-cell.bear .nc-chip { border-color: #b9e2d8; }
  .nc-chip b { font-weight: 700; }
  .nc-chip .cd { color: var(--ink2); font-size: 11px; margin-left: 4px; }
  .nc-empty { font-size: 12.5px; color: var(--ink2); }
  .wk-outlook { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-top: 10px; }
  .wk-src { font-size: 11.5px; color: var(--ink2); margin-top: 8px; }

  /* ===== 行业全景（沿用原版样式：市场 tab + 板块网格） ===== */
  /* pano-indices 卡片已删除：指数内嵌至市场 tab */
  .pano-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .pano-tab { padding: 6px 22px; border-radius: 999px; background: var(--accent-soft); color: var(--ink2); font-size: 13.5px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); transition: all .25s ease; }
  .pano-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pano-tab { padding: 6px 16px; white-space: nowrap; }
  .pano-tab .tn { font-size: 11.5px; font-weight: 600; margin-left: 7px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .pano-tab .n-up { color: var(--up); }
  .pano-tab .n-down { color: var(--down); }
  .pano-tab.active .n-up { color: #ffe3e7; }
  .pano-tab.active .n-down { color: #c9f7ea; }
  .pano-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  @media (max-width: 720px) { .pano-grid { grid-template-columns: 1fr; } }
  .pano-cell { display: flex; justify-content: space-between; align-items: center; background: var(--accent-soft); border-radius: 12px; padding: 9px 14px; }
  .pano-cell .nm { font-size: 13.5px; font-weight: 600; }
  .pano-cell .nm .ref { display: block; font-size: 11px; color: var(--ink2); font-weight: 400; }
  .pano-cell .pc { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pano-date { font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }

  footer.disclaimer { margin-top: 36px; font-size: 12px; color: var(--ink2); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; line-height: 1.7; box-shadow: var(--shadow); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>每日市场看板</h1>
    <div class="sub">A 股 · 美股 · 全球产业全景</div>
    <span class="updated" id="updatedAt"></span>
  </div>
  <div class="schedule-note">自动更新：A股 周一至周五 16:00（收盘后） · 美股 周一至周五 08:30（隔夜收盘，含 AI 预测与 A 股开盘映射参考） · 周日 23:00（周末消息面汇总，含周一开盘预判与利好标的）</div>

  <div id="ai-prediction"></div>
  <div id="weekend-news"></div>

  <div class="tabbar">
    <div class="tab active" id="tab-a" onclick="switchTab('ashare')">A 股</div>
    <div class="tab" id="tab-u" onclick="switchTab('us')">美 股</div>
  </div>
  <div id="content"></div>

  <div class="card" id="pano-card">
    <h2>行业全景 · 美股 / 韩股 / 日经</h2>
    <div class="pano-tabs" id="pano-tabs"></div>
    <div class="pano-date" id="pano-date"></div>
    <div class="pano-grid" id="pano-grid"></div>
  </div>

  <footer class="disclaimer">
    <b>免责声明</b>：以上内容基于公开数据和量化分析，仅供参考，不构成投资建议。市场有风险，投资需谨慎。任何投资决策应结合个人风险承受能力、资金状况和投资目标独立判断，必要时咨询持牌专业机构。过往表现不预示未来收益。
  </footer>
</div>

<script>
var charts = [];
var currentMarket = 'ashare';
function cls(v) { return v > 0 ? "up" : (v < 0 ? "down" : "flat"); }
function fmtPct(v) { if (v === null || v === undefined) return "—"; return (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
function esc(s) { if (s === null || s === undefined) return ""; return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function dateTag(tradeDate) { var m = String(tradeDate).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[2] + "月" + m[3] + "日" : ""; }
function formatOutlook(text) {
  if (!text) return '—';
  // 按「【」标题分段，每段渲染成 <p> 实现网页内换行；微信推送端保持原始连续文本
  var segs = String(text).split(/(?=【)/).filter(function(s){ return s.trim(); });
  if (segs.length <= 1) return '<p style="margin:0 0 10px 0; line-height:1.7;">' + esc(text) + '</p>';
  return segs.map(function(seg){ return '<p style="margin:0 0 10px 0; line-height:1.7;">' + esc(seg.trim()) + '</p>'; }).join('');
}

function renderIndexCards(indices) {
  indices = indices || [];
  var html = '<div class="idx-grid">';
  indices.forEach(function (d) {
    var c = cls(d.changePct);
    html += '<div class="idx"><div class="nm">' + esc(d.name) + '</div>' +
      '<div class="pt ' + c + '">' + (d.point === null || d.point === undefined ? "—" : d.point.toLocaleString("zh-CN", { minimumFractionDigits: 2 })) + '</div>' +
      '<div class="pc ' + c + '">' + fmtPct(d.changePct) + '</div>' +
      (d.note ? '<div class="nt">' + esc(d.note) + '</div>' : '') + '</div>';
  });
  return html + '</div>';
}

function renderBreadth(b) {
  b = b || {};
  var items = [];
  if (b.up !== null && b.up !== undefined) {
    items.push('上涨 <b class="up">' + b.up + '</b> 家');
    items.push('下跌 <b class="down">' + b.down + '</b> 家');
    if (b.flat) items.push('平盘 <b>' + b.flat + '</b> 家');
    if (b.limitUp !== null && b.limitUp !== undefined) items.push('涨停 <b class="up">' + b.limitUp + '</b> 家');
    if (b.limitDown !== null && b.limitDown !== undefined) items.push('跌停 <b class="down">' + b.limitDown + '</b> 家');
  }
  return '<div class="breadth">' + items.map(function (s) { return '<span>' + s + '</span>'; }).join('') +
    '<span style="color:var(--ink2)">' + esc(b.volumeText || '') + '</span></div>';
}

// 板块成分股 TOP 列表：A股 tops 含成分股 TOP5（涨前5/跌前5），美股 tops 含代表标的（1-2只）。
// 兼容旧数据：仅有 leader 字段时按旧规则归一化。
function renderTops(s, isUp) {
  var arr = s.tops || null;
  if (!arr || !arr.length) {
    var l = s.leader;
    if (typeof l === 'object' && l) {
      if (!isUp && l.laggard && l.laggard.name) {
        var g = l.laggard;
        arr = [g.name + ' ' + (g.changePct >= 0 ? '+' : '') + g.changePct + '%'];
      } else if (l.name) {
        arr = [l.name + (l.changePct !== null && l.changePct !== undefined ? ' ' + (l.changePct >= 0 ? '+' : '') + l.changePct + '%' : '')];
      }
    } else if (typeof l === 'string' && l.trim()) {
      arr = l.split(/[；;]/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (!arr.length) arr = [l.trim()];
    }
  }
  if (!arr || !arr.length) return '';
  var n = Math.min(arr.length, 5);
  var label = isUp ? '板块领涨 TOP' + n : '板块领跌 TOP' + n;
  var chips = arr.slice(0, 5).map(function (it) {
    var name, pct;
    if (typeof it === 'object') { name = it.name || ''; pct = it.changePct; }
    else if (typeof it === 'string') {
      var mm = it.match(/^(.*?)[\s]*([+-]?\d+(?:\.\d+)?%?)\s*([^【]*?)(【[^】]*】)?\s*$/);
      if (mm) { name = mm[1].replace(/[：:]\s*$/, ''); pct = parseFloat(mm[2]); var tail = (mm[3] || '').trim(); if (mm[4]) tail += ' ' + mm[4]; if (tail) name = (name ? name + ' ' : '') + tail; }
      else { name = it; pct = null; }
    }
    var cls = (pct === null || pct === undefined) ? '' : (pct >= 0 ? ' u' : ' d');
    var pctStr = (pct === null || pct === undefined) ? '' : ' ' + (pct >= 0 ? '+' : '') + pct + '%';
    return '<span class="tchip' + cls + '">' + esc(name) + pctStr + '</span>';
  }).join('');
  return '<div class="reason-tops"><span class="tops-h">' + label + '</span>' + chips + '</div>';
}

function renderReasons(list, tradeDate, isUp) {
  list = list || [];
  var html = '';
  var tag = dateTag(tradeDate);
  list.forEach(function (s) {
    if (!s.reason) return;
    // 板块名与涨跌幅合并为一枚胶囊：涨=红底白字，跌=绿底白字；无涨跌幅时退回白底胶囊
    var pctHtml = (s.pct !== null && s.pct !== undefined)
      ? '<span class="pct ' + (s.pct >= 0 ? 'u' : 'd') + '">' + esc(s.name) + ' ' + fmtPct(s.pct) + '</span>'
      : '<span class="sec">' + esc(s.name) + '</span>';
    html += '<div class="reason-block"><div class="reason-head">' +
      '<span class="date-tag">' + esc(tag) + '异动原因</span>' +
      pctHtml +
      '<span class="kw">' + esc(s.reason.title) + '</span></div>' +
      renderTops(s, isUp) +
      '<div class="reason-body"><b class="label">行业原因：</b>' + esc(s.reason.detail) + '</div></div>';
  });
  return html;
}

function barOption(names, values, unit) {
  var up = cssVar('--up'), down = cssVar('--down'), ink = cssVar('--ink'), ink2 = cssVar('--ink2'), line = cssVar('--line');
  var FONT = 'Microsoft YaHei, 微软雅黑, PingFang SC, sans-serif';
  return {
    textStyle: { fontFamily: FONT },
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      formatter: function (ps) { var p = ps[0]; return '<b>' + p.name + '</b><br/>' + (p.value > 0 ? '+' : '') + p.value + unit; },
      backgroundColor: 'rgba(255,255,255,0.96)', borderColor: line, textStyle: { color: ink, fontSize: 12 }, extraCssText: 'box-shadow:0 2px 8px rgba(0,0,0,0.08);border-radius:10px;'
    },
    grid: { left: 10, right: 60, top: 18, bottom: 18, containLabel: true },
    xAxis: {
      type: 'value',
      axisLabel: { fontSize: 11, color: ink2, formatter: function (v) { return (v > 0 ? '+' : '') + v + unit; } },
      splitLine: { lineStyle: { type: 'dashed', color: line } },
      axisLine: { show: false }, axisTick: { show: false }
    },
    yAxis: {
      type: 'category', inverse: true, data: names,
      axisLabel: { fontSize: 12.5, color: ink, fontWeight: 600 },
      axisLine: { show: false }, axisTick: { show: false }
    },
    series: [{
      type: 'bar', barWidth: 16,
      data: values.map(function (v) {
        return { value: v, itemStyle: { color: v >= 0 ? up : down, borderRadius: v >= 0 ? [0, 8, 8, 0] : [8, 0, 0, 8] } };
      }),
      label: {
        show: true, position: 'right', fontSize: 11.5, color: ink, fontWeight: 600,
        formatter: function (p) { return (p.value > 0 ? '+' : '') + p.value + unit; }
      }
    }]
  };
}

function switchTab(market) {
  document.getElementById('tab-a').classList.toggle('active', market === 'ashare');
  document.getElementById('tab-u').classList.toggle('active', market === 'us');
  currentMarket = market;
  render(market);
}

function render(market) {
  charts.forEach(function (c) { c.dispose(); });
  charts = [];
  var d = window.DASHBOARD_DATA[market] || {};
  var isA = market === 'ashare';

  var html = '';
  html += '<div class="card"><div class="status-line">' + esc(d.tradeDate) + ' · ' + esc(d.status) + '</div><div class="summary">' + esc(d.summary) + '</div></div>';

  html += '<div class="card"><h2>大盘指数</h2>' + renderIndexCards(d.indices) + '<div style="height:10px"></div>' + renderBreadth(d.breadth) + '</div>';

  html += renderNewsCard(d);

  html += '<div class="card"><h2>大盘趋势研判</h2><div class="outlook">' + formatOutlook(d.outlook) + '</div></div>';

  html += '<div class="card"><h2>领涨板块</h2>' + renderReasons(d.sectorsUp, d.tradeDate, true) + '</div>';

  html += '<div class="card"><h2>调整 / 领跌板块</h2>' +
    (d.sectorNote ? '<div class="src-line">' + esc(d.sectorNote) + '</div>' : '') +
    renderReasons(d.sectorsDown, d.tradeDate, false) + '</div>';

  if (isA) {
    html += '<div class="card"><h2>主力资金流向</h2>';
    if (d.fundNote) html += '<div class="note-line">' + esc(d.fundNote) + '</div>';
    html += '<div id="chart-fund" class="chart-tall"></div></div>';
  }

  document.getElementById('content').innerHTML = html;

  if (isA) {
    var fIn = d.fundIn || [], fOut = d.fundOut || [];
    var fNames = fIn.map(function (f) { return f.name; }).concat(fOut.map(function (f) { return f.name; }));
    var fVals = fIn.map(function (f) { return f.value; }).concat(fOut.map(function (f) { return f.value; }));
    if (fNames.length) {
      var c2 = echarts.init(document.getElementById('chart-fund'));
      c2.setOption(barOption(fNames, fVals, ' 亿'));
      charts.push(c2);
    }
  }
}

/* 行业全景（沿用原版：市场 tab + 板块网格） */
var panoCurrent = 'us';
function renderPano() {
  var pano = window.DASHBOARD_DATA.panorama;
  if (!pano || !pano.markets) { document.getElementById('pano-card').style.display = 'none'; return; }
  var PANO_IDX_SHORT = { '道琼斯': '道指', '标普500': '标指', '纳斯达克': '纳指' };
  function panoTabIdx(m) {
    var out = [];
    if (m.key === 'us') {
      var ui = ((window.DASHBOARD_DATA.us || {}).indices) || [];
      ['道琼斯', '标普500', '纳斯达克'].forEach(function (n) {
        ui.forEach(function (i) { if (i.name === n && i.changePct != null) out.push({ name: PANO_IDX_SHORT[n], pct: i.changePct }); });
      });
    } else if (m.key === 'kr' && m.indices && m.indices.length) {
      out.push({ name: 'KOSPI', pct: m.indices[0].changePct });
    } else if (m.key === 'jp' && m.indices && m.indices.length) {
      out.push({ name: '日经225', pct: m.indices[0].changePct });
    }
    return out;
  }
  var tabsHtml = '';
  pano.markets.forEach(function (m) {
    var nums = panoTabIdx(m).map(function (i) {
      return '<span class="tn n-' + (i.pct >= 0 ? 'up' : 'down') + '">' + esc(i.name) + fmtPct(i.pct) + '</span>';
    }).join('');
    tabsHtml += '<div class="pano-tab' + (m.key === panoCurrent ? ' active' : '') + '" onclick="switchPano(\'' + m.key + '\')">' + esc(m.name) + nums + '</div>';
  });
  document.getElementById('pano-tabs').innerHTML = tabsHtml;
  var cur = pano.markets.filter(function (m) { return m.key === panoCurrent; })[0] || pano.markets[0];
  document.getElementById('pano-date').textContent = '数据时点：' + cur.date;
  var html = '';
  (cur.items || []).forEach(function (it) {
    var c = cls(it.pct);
    html += '<div class="pano-cell"><div class="nm">' + esc(it.name) +
      (it.ref ? '<span class="ref">' + esc(it.ref) + '</span>' : '') + '</div>' +
      '<div class="pc ' + c + '">' + fmtPct(it.pct) + '</div></div>';
  });
  document.getElementById('pano-grid').innerHTML = html;
}
function switchPano(key) { panoCurrent = key; renderPano(); }

/* AI 预测分析 */
function renderAiPrediction() {
  var p = window.DASHBOARD_DATA.aiPrediction;
  var box = document.getElementById('ai-prediction');
  if (!p) { box.style.display = 'none'; return; }
  p.sectors = p.sectors || [];
  var html = '<div class="ai-card"><div class="ai-head"><h2>AI 预测分析</h2></div>' +
    '<div class="ai-summary">' + (p.indexLine ? esc(p.indexLine) + '。' : '') + '通过隔夜美股各板块涨跌推导今日 A 股强弱方向：' + esc(p.summary) + '</div>' +
    '<div class="ai-grid">';
  p.sectors.forEach(function (s) {
    var isUp = String(s.direction || '').indexOf('承压') === -1;
    var conf = String(s.confidence || '');
    var confCls = conf.indexOf('高') >= 0 ? 'conf-high' : (conf.indexOf('中') >= 0 ? 'conf-mid' : 'conf-low');
    html += '<div class="ai-item"><div class="row1">' +
      '<span class="sec-nm">' + esc(s.sector) + '</span>' +
      '<span class="dir-badge ' + (isUp ? 'dir-up' : 'dir-down') + '">预计' + esc(s.direction) + '</span>' +
      '<span class="conf-badge ' + confCls + '">置信度 ' + esc(s.confidence) + '</span></div>' +
      '<div class="drv">隔夜驱动：' + esc(s.usDriver) + '</div>' +
      '<div class="lgc">映射逻辑：' + esc(s.logic) + '</div>';
    if (s.stocks && s.stocks.length) {
      html += '<div class="stock-chips">';
      s.stocks.forEach(function (st) {
        html += '<span class="stock-chip"><b>' + esc(st.name) + '</b><span class="cd">' + esc(st.code) + '</span>' +
          (st.note ? '<span class="nt">' + esc(st.note) + '</span>' : '') + '</span>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div><div class="ai-foot">标的筛选口径：每个板块 5 只 A 股，要求业绩支撑或题材贴合，已排除科创板（688 开头）及北交所。<br>' + esc(p.riskNote) + '</div>';
  if (p.verification && (p.verification.summary || (p.verification.details && p.verification.details.length))) {
    var v = p.verification;
    var vHtml = '<div class="ai-verify"><div class="v-title">📊 预测验证：' + esc(v.summary || '') + '</div>';
    if (v.details && v.details.length) {
      vHtml += '<div class="v-detail">';
      v.details.forEach(function(d) {
        var r = String(d.result);
        var vcls = r.indexOf('未命中') !== -1 ? 'miss' : (r.indexOf('命中') !== -1 ? 'hit' : 'miss');
        vHtml += '<div class="' + vcls + '">· ' + esc(d.sector) + '：预测「' + esc(d.predicted) + '」→ 实际 ' + (d.actualPct === null || d.actualPct === undefined ? '—' : (d.actualPct >= 0 ? '+' : '') + d.actualPct + '%') + ' → ' + esc(d.result) + '</div>';
      });
      vHtml += '</div>';
    }
    vHtml += '</div>';
    html += vHtml;
  }
  html += '</div>';
  box.innerHTML = html;
}

window.addEventListener('resize', function () { charts.forEach(function (c) { c.resize(); }); });

function newsTag(item) {
  // 国内(🇨🇳)/国际(🌍)要闻识别，未命中给 🌐；title 优先（与微信推送一致）
  var DOM = ['国常会','证监会','央行','国务院','工信部','财政部','发改委','中方','我国','国内','A股','港股','政策','十五五','券商','印花税','北向','两融','逆回购','LPR','光博会','算力网','算力大会','人民币','出口','关税'];
  var INTL = ['美联储','美股','纳指','道指','标普','美债','美元','加息','降息','特朗普','白宫','中东','沙特','伊朗','以色列','俄乌','俄罗斯','乌克兰','地缘','油价','原油','黄金','能源','油运','日本','日经','日元','韩国','KOSPI','亚太','欧洲','英国','英伟达','苹果','特斯拉','半导体','芯片'];
  var title = (item.title||'').trim();
  var summary = (item.summary||'').trim();
  var i;
  for (i=0;i<DOM.length;i++) if (title.indexOf(DOM[i])>=0) return '🇨🇳';
  for (i=0;i<INTL.length;i++) if (title.indexOf(INTL[i])>=0) return '🌍';
  var text = title + ' ' + summary;
  for (i=0;i<DOM.length;i++) if (text.indexOf(DOM[i])>=0) return '🇨🇳';
  for (i=0;i<INTL.length;i++) if (text.indexOf(INTL[i])>=0) return '🌍';
  return '🌐';
}

function renderNewsCard(d) {
  // A股/美股共用：大标题「全球要闻」，两栏布局——左列利好、右列利空，标的胶囊一行两个
  // 2026-09-18 改：bull/bear 按行配对放入同一网格，左右每行顶对齐且等高；窄屏媒体查询回退单列
  if (!d) return '';
  var bn = d.bullNews||[], be = d.bearNews||[];
  if (!bn.length && !be.length) return '';
  var n = Math.max(bn.length, be.length);
  var itemHtml = function (it, dir) {
    var s = '<div class="news-cell ' + dir + '">';
    s += '<div class="nc-theme">' + esc(it.sector||'') + '</div>';
    s += '<div class="nc-dtl"><b>' + esc(it.title||'') + '</b> — ' + esc(it.summary||'') + '</div>';
    (it.impacts||[]).forEach(function (im) {
      if (!im.stocks || !im.stocks.length) return;
      s += '<div class="nc-imp"><span class="nc-imp-theme">' + esc(im.theme || im.sector || '') + '</span>';
      s += '<div class="nc-stocks">';
      im.stocks.forEach(function (st) {
        s += '<span class="nc-chip"><b>' + esc(st.name||'') + '</b><span class="cd">' + esc(st.code||'') + '</span></span>';
      });
      s += '</div></div>';
    });
    s += '</div>';
    return s;
  };
  var cellFor = function (arr, i, dir) {
    if (i < arr.length) return itemHtml(arr[i], dir);
    if (i === 0) return '<div class="news-cell ' + dir + '"><div class="nc-empty">今日暂无</div></div>';
    return '<div class="news-cell ghost"></div>';
  };
  var html = '<div class="wk-card"><div class="wk-head"><h2>全球要闻</h2>'
    + '<span class="date">' + esc(d.tradeDate||'') + '</span></div>';
  html += '<div class="news-cols">';
  html += '<div class="nc-head bull">利好方向</div><div class="nc-head bear">利空方向</div>';
  for (var i = 0; i < n; i++) {
    html += cellFor(bn, i, 'bull') + cellFor(be, i, 'bear');
  }
  html += '</div>';
  if (d.source) html += '<div class="wk-src">来源：' + esc(d.source) + '</div>';
  html += '</div>';
  return html;
}

function renderWeekendNews() {
  var w = window.DASHBOARD_DATA.weekendNews;
  var box = document.getElementById('weekend-news');
  if (!w || !box) return;
  // 周末消息前瞻只在「周日 23:00 后」到「周一 16:00 A 股收盘更新前」显示
  var now = new Date();
  var day = now.getDay();
  var hour = now.getHours();
  var show = false;
  if (day === 0 && hour >= 23) show = true;
  if (day === 1 && hour < 16) show = true;
  if (!show) { box.innerHTML = ''; box.style.display = 'none'; return; }
  var html = '<div class="wk-card"><div class="wk-head"><h2>周末消息面前瞻</h2><span class="date">' + esc(w.date) + '</span></div>' +
    '<div class="wk-summary">' + esc(w.summary) + '</div>';
  if (w.usFriday) {
    var u = w.usFriday;
    html += '<div class="wk-section"><h4>美股周五收盘</h4>';
    if (u.indices && u.indices.length) {
      html += '<div class="wk-item"><div class="thm">大盘指数</div><div class="dtl">' +
        u.indices.map(function(i){ return i.name + ' ' + (i.changePct>=0?'+':'') + i.changePct + '%'; }).join(' · ') + '</div></div>';
    }
    if (u.sectorsUp && u.sectorsUp.length) {
      html += '<div class="wk-item"><div class="thm">领涨主题</div><div class="dtl">' +
        u.sectorsUp.map(function(s){ return s.name + ' ' + (s.pct>=0?'+':'') + s.pct + '%' + (s.ref?'（'+s.ref+'）':''); }).join(' · ') + '</div></div>';
    }
    if (u.sectorsDown && u.sectorsDown.length) {
      html += '<div class="wk-item"><div class="thm">调整主题</div><div class="dtl">' +
        u.sectorsDown.map(function(s){ return s.name + ' ' + (s.pct>=0?'+':'') + s.pct + '%' + (s.ref?'（'+s.ref+'）':''); }).join(' · ') + '</div></div>';
    }
    html += '</div>';
  }
  if (w.bullish && w.bullish.length) {
    html += '<div class="wk-section"><h4 class="bull">利好方向</h4>';
    w.bullish.forEach(function (b) {
      html += '<div class="wk-item"><div class="thm">' + esc(b.theme) + '</div><div class="dtl">' + esc(b.detail) + '</div>';
      if (b.stocks && b.stocks.length) {
        html += '<div class="wk-stock-chips">';
        b.stocks.forEach(function (st) {
          html += '<span class="stock-chip"><b>' + esc(st.name) + '</b><span class="cd">' + esc(st.code) + '</span>' +
            (st.note ? '<span class="nt">' + esc(st.note) + '</span>' : '') + '</span>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }
  if (w.bearish && w.bearish.length) {
    html += '<div class="wk-section"><h4 class="bear">利空方向</h4>';
    w.bearish.forEach(function (b) {
      html += '<div class="wk-item"><div class="thm">' + esc(b.theme) + '</div><div class="dtl">' + esc(b.detail) + '</div></div>';
    });
    html += '</div>';
  }
  if (w.geopolitical) html += '<div class="wk-section"><h4>地缘政治</h4><div class="wk-item"><div class="dtl">' + esc(w.geopolitical) + '</div></div></div>';
  if (w.commodities) html += '<div class="wk-section"><h4>大宗 / 汇率 / 美债</h4><div class="wk-item"><div class="dtl">' + esc(w.commodities) + '</div></div></div>';
  if (w.mondayOutlook) html += '<div class="wk-outlook"><b>周一开盘预判：</b>' + formatOutlook(w.mondayOutlook) + '</div>';
  html += '<div class="wk-src">来源：' + esc(w.source) + '</div></div>';
  box.innerHTML = html;
  box.style.display = '';
}
