<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>每日市场看板 · A股 / 美股</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="data.js?v=202609241303"></script>
<style>
  /* ===== 雾霾蓝主题（ins 风） ===== */
  :root {
    --bg: #f2f7fc;
    --paper: #ffffff;
    --ink: #2b333c;
    --ink2: #5a6e82;
    --line: #e3ecf4;
    --up: #f0435c;          /* 涨：珊瑚红（加深 2026-09-18） */
    --down: #0f9d78;        /* 跌：绿色（加深 2026-09-18） */
    --up-soft: #ffe7ea;
    --down-soft: #def5ee;
    --accent: #4aa8e0;      /* 雾霾蓝 */
    --accent-deep: #2b6cb0; /* 深蓝 */
    --accent-soft: #e6f2fb;
    --radius: 20px;
    --shadow: 0 10px 30px rgba(17,17,26,.07);
    --hero-grad: linear-gradient(135deg, var(--accent-soft), var(--bg));
    --font: "Microsoft YaHei", "微软雅黑", "PingFang SC", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    line-height: 1.75; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 22px 80px; }

  /* ===== Hero ===== */
  .hero {
    background: var(--hero-grad);
    border-radius: 28px;
    padding: 30px 34px 26px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .hero h1 { font-size: 32px; font-weight: 900; letter-spacing: 3px; color: var(--ink); }
  .hero .sub { margin-top: 6px; color: var(--ink2); font-size: 13.5px; letter-spacing: 3px; }
  .hero .updated { margin-top: 10px; display: block; width: 100%; text-align: center; font-size: 11px; color: var(--ink2); background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9); border-radius: 999px; padding: 7px 16px; white-space: nowrap; }

  .schedule-note { font-size: 11px; color: var(--ink2); background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9); border-radius: 999px; padding: 7px 16px; display: block; margin: 8px 0 0; text-align: center; white-space: nowrap; width: 100%; }
  @media (max-width: 900px) { .schedule-note, .hero .updated { white-space: normal; } }

  /* ===== Tabs（胶囊） ===== */
  .tabbar { display: flex; justify-content: center; gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 6px; margin-bottom: 26px; width: fit-content; margin-left: auto; margin-right: auto; box-shadow: var(--shadow); }
  .tab { padding: 9px 34px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--ink2); border-radius: 999px; letter-spacing: 2px; transition: all .25s ease; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: #fff; background: var(--accent); box-shadow: 0 6px 16px rgba(0,0,0,.10); }

  /* ===== 卡片 ===== */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .card h2, .ai-card h2, .wk-card h2 { font-size: 17px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 9px; margin: 0 0 16px; }
  .card h2::before, .ai-card h2::before, .wk-card h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex-shrink: 0; }
  .status-line { font-size: 13px; color: var(--accent-deep); font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
  .summary { font-size: 15px; }
  .idx-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .idx { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(17,17,26,.05); text-align: center; }
  .idx .nm { font-size: 13px; color: var(--ink2); }
  .idx .pt { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .idx .pc { font-size: 14px; font-weight: 700; }
  .idx .nt { font-size: 11px; color: var(--ink2); }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink2); }
  .breadth { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13.5px; align-items: center; color: var(--ink2); margin-top: 14px; }
  .breadth b { font-size: 16px; }
  .chart { width: 100%; height: 340px; }
  .chart-tall { width: 100%; height: 380px; }
  .reason-block { background: var(--accent-soft); border-left: 4px solid var(--accent-deep); border-radius: 12px; padding: 13px 16px; margin-bottom: 12px; }
  .reason-block.rz-up { border-left-color: var(--up); }
  .reason-block.rz-down { border-left-color: var(--down); }
  .reason-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 8px; }
  .reason-head .date-tag { background: var(--accent-deep); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
  .reason-head .kw { font-size: 16px; font-weight: 800; color: var(--ink); }
  .reason-head .sec { font-size: 12px; color: var(--ink); font-weight: 700; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; }
  .reason-head .pct { font-size: 12px; font-weight: 800; color: #fff; border-radius: 999px; padding: 3px 12px; }
  .reason-head .pct.u { background: var(--up); }
  .reason-head .pct.d { background: var(--down); }
  /* 板块成分股 TOP 列表：标题 + 每只为红涨绿跌小胶囊（白字） */
  .reason-tops { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 2px 0 10px; font-size: 12.5px; }
  .reason-tops .tops-h { font-size: 12.5px; color: var(--accent-deep); font-weight: 700; margin-right: 2px; }
  /* R97f：板块口径来源标签 + 异动副行 */
  .pano-src { font-size: 12px; color: var(--ink2); margin: 2px 0 8px; }
  .src-tag { font-size: 12px; font-weight: 500; color: var(--ink2); background: var(--accent-soft); border-radius: 8px; padding: 2px 8px; margin-left: 8px; }
  .reason-sub { font-size: 12.5px; color: var(--ink2); margin: 4px 0 2px; }
  .reason-sub b.up { color: var(--up); }
  .reason-sub b.down { color: var(--down); }
  .reason-tops .tchip { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px 9px; font-size: 12px; box-shadow: 0 1px 3px rgba(30,60,110,.06); display: inline-flex; align-items: baseline; gap: 5px; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .reason-tops .tchip .nt { display: none; }
  .reason-tops .tchip.expanded { background: var(--accent-soft); overflow: visible; z-index: 40; }
  .reason-tops .tchip b { font-weight: 700; color: var(--ink); white-space: nowrap; }
  .reason-tops .tchip .tp { font-weight: 700; font-size: 11.5px; white-space: nowrap; }
  .reason-tops .tchip .tp.u { color: var(--up); }
  .reason-tops .tchip .tp.d { color: var(--down); }
  .reason-body { font-size: 13.5px; color: var(--ink); }
  .reason-body b.label { display: block; margin-bottom: 2px; color: var(--ink2); }
  .src-line { font-size: 12px; color: var(--ink2); margin-top: 10px; }
  .note-line { font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }
  .outlook { font-size: 14.5px; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }

  /* ===== AI 预测 ===== */
  .ai-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .ai-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .ai-head h2 { margin: 0; }
  .ai-summary { font-size: 14.5px; margin-bottom: 16px; }
  .ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 860px) { .ai-grid { grid-template-columns: 1fr; } }
  .ai-item { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; }
  .ai-item .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .ai-item .sec-nm { font-size: 14px; font-weight: 700; }
  .dir-badge { font-size: 11.5px; font-weight: 700; color: #fff; border-radius: 999px; padding: 2px 9px; }
  .persp-tag { font-size: 10.5px; font-weight: 600; color: var(--ink2); border: 1px solid var(--line, #d8dee6); border-radius: 999px; padding: 1.5px 8px; margin-left: 6px; white-space: nowrap; }
  .dir-up { background: var(--up); }
  .dir-down { background: var(--down); }
  /* 置信度：低→浅蓝，中→中蓝，高→深蓝 */
  .conf-badge { font-size: 11px; border-radius: 999px; padding: 2px 9px; font-weight: 700; }
  .conf-low { background: #dcebfa; color: #4a90d9; }
  .conf-mid { background: #85b9ea; color: #fff; }
  .conf-high { background: #2b6cb0; color: #fff; }
  .ai-item .drv { font-size: 12px; color: var(--ink2); margin-bottom: 3px; }
  .ai-item .lgc { font-size: 12.5px; color: var(--ink); margin-bottom: 8px; }
  .stock-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
  .stock-chip { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px 7px; font-size: 12px; min-width: 0; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative; }
  .stock-chip b { font-weight: 700; white-space: nowrap; }
  .stock-chip .cd { color: var(--ink2); font-size: 10.5px; margin-left: 3px; white-space: nowrap; }
  .stock-chip .nt { display: block; font-size: 10.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stock-chip.expanded { background: var(--accent-soft); overflow: visible; z-index: 40; }
  .chip-pop { position: absolute; left: -6px; right: -6px; top: calc(100% + 5px); z-index: 50; background: var(--paper); border: 1px solid var(--accent); border-radius: 10px; box-shadow: 0 8px 20px rgba(43,51,60,.15); padding: 7px 9px; font-size: 11px; line-height: 1.55; color: var(--ink); white-space: normal; text-align: left; cursor: default; }
  .ai-foot { margin-top: 14px; font-size: 12px; color: var(--ink2); border-top: 1px solid var(--line); padding-top: 10px; }
  .ai-verify { margin-top: 10px; font-size: 12.5px; background: var(--accent-soft); border: 1px solid #cfe3f5; border-radius: 12px; padding: 10px 14px; color: var(--ink); }
  .ai-verify .v-title { font-weight: 700; margin-bottom: 4px; }
  .ai-verify .v-detail { font-size: 12px; line-height: 1.7; }
  .ai-verify .v-detail .hit { color: var(--up); font-weight: 700; }
  .ai-verify .v-detail .miss { color: var(--down); font-weight: 700; }

  /* ===== 全球要闻 / 周末 ===== */
  .wk-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 26px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .wk-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .wk-head h2 { margin: 0; }
  .wk-head .date { font-size: 12.5px; color: var(--ink2); }
  /* 卡片 h2 内日期角标（主力资金流向等，R98f；R99e 扩展到 AI 预测卡） */
  .card h2 .h2-date, .ai-card h2 .h2-date, .wk-card h2 .h2-date { font-size: 12.5px; color: var(--ink2); font-weight: 400; margin-left: 8px; }
  .wk-summary { font-size: 14.5px; margin-bottom: 16px; line-height: 1.7; }
  .wk-section { margin: 22px 0 14px; padding-top: 16px; border-top: 1px solid var(--line); }
  .wk-section h4 { font-size: 14px; font-weight: 700; margin: 0 0 6px 0; color: var(--accent-deep); letter-spacing: 1px; }
  .wk-section h4.bull { color: var(--up); }
  .wk-section h4.bear { color: var(--down); }
  .wk-item { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
  /* R97b：宏观/财经/投行每条要闻左侧竖向色条——红=看涨、绿=看跌、灰=中性 */
  .wk-item.wk-dir-up { border-left: 4px solid var(--up); }
  .wk-item.wk-dir-down { border-left: 4px solid var(--down); }
  .wk-item.wk-dir-flat { border-left: 4px solid #9aa4af; }
  .wk-item .thm { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
  .wk-item .dtl { font-size: 12.5px; color: var(--ink2); line-height: 1.6; }
  .wk-stock-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .wk-section.intl h4 { color: var(--accent-deep); }
  .wk-section.bank h4 { color: #6b4ea2; }
  .wk-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .wk-tags .tag { font-size: 11.5px; background: var(--accent-soft); border-radius: 8px; padding: 2px 9px; color: var(--accent-deep); }
  .nc-src { font-size: 11.5px; color: var(--ink2); margin-top: 7px; }
  .wk-item .nc-theme { font-size: 13.5px; font-weight: 800; margin-bottom: 3px; }
  .wk-item .nc-dtl { font-size: 12.5px; color: var(--ink); line-height: 1.6; margin-bottom: 8px; min-height: 0; }
  .wk-item .nc-imp { margin-top: 6px; padding-top: 7px; border-top: 1px dashed var(--line); }
  .wk-item .nc-imp-theme { font-size: 12px; font-weight: 700; color: var(--accent-deep); }
  .wk-item .nc-stocks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; margin-top: 6px; }
  .news-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .news-cols .news-cell { min-width: 0; }
  .news-cell.ghost-slot { visibility: hidden; padding: 0; border: none; background: none; }
  @media (max-width: 700px) {
    .news-cols { grid-template-columns: 1fr; }
    .news-cols .nc-head.bull { order: 1; }
    .news-cols .p-bull { order: 2; }
    .news-cols .nc-head.bear { order: 3; }
    .news-cols .p-bear { order: 4; }
  }
  .nc-head { font-size: 14.5px; font-weight: 800; margin-bottom: 8px; letter-spacing: 1px; }
  .nc-head.bull { color: var(--up); }
  .nc-head.bear { color: var(--down); }
  .news-cell { background: var(--accent-soft); border-radius: 14px; border-left: 4px solid var(--up); padding: 12px 14px; display: flex; flex-direction: column; }
  .news-cell.bear { border-left-color: var(--down); }
  .nc-theme { font-size: 14px; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nc-dtl { font-size: 13px; color: var(--ink); line-height: 1.65; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: calc(13px * 1.65 * 3); cursor: pointer; }
  .nc-dtl.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; min-height: 0; }
  .nc-dtl b { font-weight: 700; }
  .nc-imp-hz { font-size: 11px; font-weight: 600; color: var(--ink2); background: var(--line); border-radius: 8px; padding: 1px 7px; flex: none; line-height: 1.5; margin-left: 6px; }
  /* 分组间距：顶对齐——分组紧跟摘要排（固定 8px），剩余空间留白在卡片底部，上方不留大空隙 */
  .news-cell .nc-imp { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .nc-imp-theme { font-size: 12.5px; font-weight: 700; color: var(--accent-deep); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .nc-imp-theme::before { content: ''; width: 3px; height: 11px; border-radius: 2px; background: var(--accent); flex: none; }
  .dir-badge { font-size: 11px; font-weight: 700; margin-left: 6px; }
  .persp-tag { font-size: 10px; margin-left: 5px; padding: 1px 6px; }
  .dir-badge.up { color: var(--up); }
  .dir-badge.down { color: var(--down); }
  .dir-badge.flat { color: var(--ink2); }
  /* R97：方向徽标填充色（红底看涨/绿底看跌/灰底中性）+ 发布时间徽标 */
  .dir-flat { background: #9aa4af; }
  .nc-theme .dir-badge.dir-up { background: var(--up); color: #fff; }
  .nc-theme .dir-badge.dir-down { background: var(--down); color: #fff; }
  .nc-theme .dir-badge.dir-flat { background: #9aa4af; color: #fff; }
  .nc-time { font-size: 10.5px; font-weight: 600; color: var(--ink2); background: rgba(0,0,0,.05); border-radius: 999px; padding: 1.5px 8px; margin-left: 6px; white-space: nowrap; }
  .nc-time.today { color: #fff; background: var(--accent-deep); }
  .nc-stocks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 8px; margin-top: 6px; }
  .news-cell.bull .stock-chip { border-color: #f2c4ca; }
  .news-cell.bear .stock-chip { border-color: #b9e2d8; }
  /* 手机端：4 列网格芯片过窄会导致股票名+代码被 overflow:hidden 截断，改 2 列保证完整显示 */
  @media (max-width: 560px) {
    .stock-chips, .nc-stocks, .lb-stocks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .nc-empty { font-size: 12.5px; color: var(--ink2); }
  /* 题材掘金 · 个股事件驱动 */
  .tp-item { background: var(--accent-soft); border-radius: 12px; padding: 11px 13px; margin-bottom: 10px; border-left: 4px solid var(--up); }
  .tp-item.tp-down { border-left-color: var(--down); }
  .tp-item:last-child { margin-bottom: 0; }
  .tp-event { font-size: 13.5px; font-weight: 800; color: var(--accent-deep); margin-bottom: 5px; line-height: 1.5; }
  .tp-logic { font-size: 12.5px; color: var(--ink); line-height: 1.65; margin-bottom: 9px; }
  .tp-why { font-size: 12px; color: var(--ink2); line-height: 1.65; margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line); }
  /* 连板梯队 */
  .lb-note { font-size: 11.5px; color: var(--ink2); margin-bottom: 10px; line-height: 1.6; }
  .lb-row { display: flex; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .lb-row:last-child { border-bottom: none; padding-bottom: 0; }
  .lb-tag { flex: 0 0 64px; font-size: 13px; font-weight: 800; color: var(--accent-deep); padding-top: 3px; line-height: 1.3; }
  .lb-stocks { flex: 1 1 auto; }
  .stock-chip .rt { font-size: 11px; font-weight: 700; color: var(--up); margin-left: 3px; }
  .lb-foot { font-size: 12px; color: var(--ink2); margin-top: 9px; }
  /* 连板梯队：可点击芯片 + 深度解读弹窗（R92） */
  .stock-chip.lb-click { cursor: pointer; border: 1px solid transparent; transition: all .15s ease; -webkit-tap-highlight-color: transparent; }
  .stock-chip.lb-click:hover { border-color: var(--accent); background: var(--accent-soft); }
  #lb-modal { display: none; position: fixed; inset: 0; z-index: 210; background: rgba(30,45,60,.45); align-items: center; justify-content: center; padding: 20px; }
  #lb-modal.open { display: flex; }
  .lb-modal-box { background: var(--paper); border-radius: var(--radius); padding: 20px 22px; max-width: 680px; width: 100%; max-height: 88vh; overflow: auto; box-shadow: 0 20px 60px rgba(17,17,26,.25); }
  .lb-modal-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 8px; }
  .lb-modal-head .nm { font-size: 18px; font-weight: 900; }
  .lb-modal-head .cd2 { font-size: 12px; color: var(--ink2); }
  .lb-modal-head .lb-lbc { font-size: 12px; font-weight: 800; color: #fff; background: var(--up); border-radius: 999px; padding: 2px 10px; }
  .lb-modal-head .rt { font-weight: 800; color: var(--up); margin-left: auto; }
  .lb-modal-head .db-modal-close { margin-left: 0; }
  .lb-modal-meta { font-size: 12.5px; color: var(--ink); line-height: 1.8; margin-bottom: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 9px; }
  .lb-modal-meta .lab { color: var(--ink2); }
  .lb-story p { margin: 0 0 10px; line-height: 1.78; font-size: 13.5px; }
  .lb-story p:last-child { margin-bottom: 0; }
  .lb-story b.h { color: var(--accent-deep); }
  .wk-outlook { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-top: 10px; }
  .wk-src { font-size: 11.5px; color: var(--ink2); margin-top: 8px; }

  /* ===== 行业全景（沿用原版样式：市场 tab + 板块网格） ===== */
  /* pano-indices 卡片已删除：指数内嵌至市场 tab */
  .pano-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .pano-tab { padding: 6px 16px; border-radius: 999px; background: var(--accent-soft); color: var(--ink2); font-size: 13.5px; font-weight: 700; cursor: pointer; border: 1px solid var(--line); transition: all .25s ease; white-space: nowrap; }
  .pano-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pano-tab .tn { font-size: 11.5px; font-weight: 600; margin-left: 7px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .pano-tab .n-up { color: var(--up); }
  .pano-tab .n-down { color: var(--down); }
  .pano-tab.active .n-up { color: #ffe3e7; }
  .pano-tab.active .n-down { color: #c9f7ea; }
  .pano-idx { display: none; }
  .pano-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  @media (max-width: 720px) {
    .pano-grid { grid-template-columns: 1fr; }
    .pano-tabs { margin-bottom: 8px; }
    .pano-tab { padding: 6px 14px; }
    .pano-tab .tn { display: none; }
    .pano-idx { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: -2px 0 10px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .pano-idx .n-up { color: var(--up); }
    .pano-idx .n-down { color: var(--down); }
  }
  .pano-cell { display: flex; justify-content: space-between; align-items: center; background: var(--accent-soft); border-radius: 12px; padding: 9px 14px; }
  .pano-cell .nm { font-size: 13.5px; font-weight: 600; }
  .pano-cell .nm .ref { display: block; font-size: 11px; color: var(--ink2); font-weight: 400; }
  .pano-cell .nm .subtag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--accent-deep); background: var(--paper); border: 1px solid var(--accent); border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 1px; cursor: pointer; line-height: 16px; transition: all .15s ease; }
  .pano-cell .nm .subtag:hover { background: var(--accent); color: #fff; }
  #ps-modal { display: none; position: fixed; inset: 0; z-index: 210; background: rgba(30,45,60,.45); align-items: center; justify-content: center; padding: 20px; }
  #ps-modal.open { display: flex; }
  .ps-modal-box { background: var(--paper); border-radius: var(--radius); padding: 16px 20px; max-width: 420px; width: 100%; max-height: 80vh; overflow: auto; box-shadow: 0 20px 60px rgba(17,17,26,.25); }
  .ps-modal-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 10px; padding-bottom: 9px; border-bottom: 1px dashed var(--line); }
  .ps-modal-head .nm { font-size: 16px; font-weight: 900; }
  .ps-modal-head .cnt { font-size: 12px; color: var(--ink2); }
  .ps-modal-head .db-modal-close { margin-left: auto; }
  /* 通用标的K线弹窗（叠于 db/lb 弹窗之上） */
  #stk-modal { display: none; position: fixed; inset: 0; z-index: 230; background: rgba(30,45,60,.45); align-items: center; justify-content: center; padding: 20px; }
  #stk-modal.open { display: flex; }
  .stk-modal-box { background: var(--paper); border-radius: var(--radius); padding: 20px 22px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; box-shadow: 0 20px 60px rgba(17,17,26,.25); }
  .ps-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: 9px; font-size: 13px; }
  .ps-row:nth-child(odd) { background: var(--accent-soft); }
  .ps-row .nm { font-weight: 600; }
  .ps-row .pc { font-weight: 800; font-variant-numeric: tabular-nums; }
  .pano-cell .pc { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  /* R98h：A股板块指标行 */
  .pano-cell.pano-rich { flex-wrap: wrap; }
  .pano-cell .meta { width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; font-size: 11px; color: var(--ink2); font-variant-numeric: tabular-nums; line-height: 16px; margin-top: 3px; }
  .pano-cell .meta span { margin-right: 2px; }
  .pano-cell .meta b { font-weight: 700; color: var(--ink); margin-right: 5px; }
  .pano-cell .meta b:last-child { margin-right: 0; }
  .pano-cell .meta b i, .pano-cell .meta i { font-style: normal; font-weight: 700; }
  .pano-cell .meta b .up, .pano-cell .meta i.up { color: var(--up); }
  .pano-cell .meta b .down, .pano-cell .meta i.down { color: var(--down); }
  .pano-cell .meta em { font-style: normal; margin: 0 4px; color: var(--ink2); opacity: .45; }
  .pano-date { font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }
  .pano-more { grid-column: 1 / -1; text-align: center; padding-top: 6px; }
  .pano-more button { background: var(--paper); color: var(--accent-deep); border: 1px solid var(--accent); border-radius: 999px; font-size: 12.5px; font-weight: 700; padding: 7px 20px; cursor: pointer; font-family: var(--font); transition: all .2s ease; }
  .pano-more button:hover { background: var(--accent); color: #fff; }

  /* ===== 悬浮图标组（R99g：🐼/💰 合并为一个整体 #float-group，整组可拖拽+位置记忆，右侧贴近页面内容右缘、垂直居中） ===== */
  .hero { position: relative; }
  :root { --float-x: max(12px, calc((100vw - 1080px) / 2 - 60px)); }
  .float-group {
    position: fixed; right: var(--float-x); top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    z-index: 1190; cursor: grab; touch-action: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .float-group:active { cursor: grabbing; }
  .mkt-toggle, .db-entry {
    width: 46px; height: 46px; border-radius: 50%;
    background: transparent; border: none; padding: 0; box-shadow: none;
    cursor: pointer; touch-action: none; user-select: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; line-height: 1;
    transition: transform .15s ease;
  }
  .mkt-toggle:hover, .db-entry:hover { transform: scale(1.1); }
  .mkt-toggle:active, .db-entry:active { transform: scale(.92); }
  .db-entry .db-badge { display: none; }
  /* 断板反包页内的返回 💰：默认位置与组内 💰 一致，拖拽组时由 JS 实时同步坐标 */
  .db-entry-in {
    position: fixed; right: var(--float-x); top: calc(50% + 7px);
    width: 46px; height: 46px; border-radius: 50%;
    background: transparent; border: none; padding: 0; box-shadow: none;
    cursor: pointer; z-index: 1200; touch-action: manipulation; user-select: none;
    display: none; align-items: center; justify-content: center;
    font-size: 42px; line-height: 1;
    transition: transform .15s ease;
  }
  .db-entry-in:hover { transform: scale(1.1); }
  .db-entry-in:active { transform: scale(.92); }
  body.db-open .db-entry-in { display: flex; }
  @media (max-width: 700px) {
    :root { --float-x: 10px; }
    .float-group { gap: 12px; }
    .mkt-toggle, .db-entry, .db-entry-in { width: 42px; height: 42px; font-size: 36px; }
  }
  /* R99e：断板反包手机端不显示股票代码（窄屏下被挤没，无信息量） */
  @media (max-width: 700px) { #duanban-view .db-chip .cd { display: none; } }

  /* 独立页面：打开时隐藏看板主体，只显示本模块 */
  #duanban-view { display: none; }
  body.db-open .wrap > *:not(#duanban-view) { display: none !important; }
  body.db-open #duanban-view { display: block; }
  .db-topbar { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; position: relative; }
  .db-title { font-size: 22px; font-weight: 900; letter-spacing: 2px; }
  .db-date { font-size: 12px; color: var(--ink2); position: absolute; right: 0; }
  @media (max-width: 700px) { .db-date { position: static; width: 100%; text-align: center; } }
  .db-note { font-size: 12px; color: var(--ink2); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; margin-bottom: 18px; line-height: 1.7; box-shadow: var(--shadow); }
  .db-pool { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .db-pool h2 { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 9px; margin: 0 0 4px; }
  .db-pool h2::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .db-pool.p-conf h2::before { background: var(--up); box-shadow: 0 0 0 4px var(--up-soft); }
  .db-pool.p-watch h2::before { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  /* R99：🌟 开盘精选——复用确认池卡片样式，金色系区分 */
  .db-pool.p-star h2::before { background: #e8a013; box-shadow: 0 0 0 4px rgba(232,160,19,.16); }
  .db-pool.p-star .db-chip { border-color: rgba(232,160,19,.4); }
  .db-pool.p-star .db-chip:hover { border-color: #e8a013; background: rgba(255,248,228,.9); }
  .db-pool.p-star .db-stage.hold { background: rgba(232,160,19,.14); color: #a86f0e; }
  .db-pool .db-sub { font-size: 12px; color: var(--ink2); margin-bottom: 14px; }
  /* R91j: 近3日涨幅居前板块 TOP10 */
  .db-tb { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 900px) { .db-tb { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .db-tb-cell { background: #f7fafd; border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; display: flex; flex-direction: column; gap: 3px; }
  .db-tb-rank { display: flex; align-items: center; gap: 7px; }
  .db-tb-rank b { width: 18px; height: 18px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-deep); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .db-tb-cell:nth-child(n+4) .db-tb-rank b { background: transparent; color: var(--ink2); }
  .db-tb-nm { font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .db-tb-p3 { font-size: 14px; font-weight: 800; }
  .db-tb-today { font-size: 11px; color: var(--ink2); }
  .db-sec { margin: 16px 0 8px; font-size: 13.5px; font-weight: 800; color: var(--accent-deep); display: flex; align-items: center; gap: 6px; }
  .db-sec::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); }
  .db-sec .db-sec-n { font-size: 11px; color: var(--ink2); font-weight: 600; }
  .db-chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 700px) { .db-chips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .db-chip {
    background: #f7fafd; border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 10px; font-size: 12.5px; cursor: pointer; position: relative;
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
    transition: all .15s ease; -webkit-tap-highlight-color: transparent;
  }
  .db-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  .db-chip .r1 { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .db-chip b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .db-chip .cd { color: var(--ink2); font-size: 10.5px; white-space: nowrap; }
  .db-chip .db-sec-pill { font-size: 9px; font-weight: 700; color: var(--accent-deep); background: var(--accent-soft); border-radius: 4px; padding: 0.5px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 72px; flex-shrink: 0; }
  .db-chip .db-prob { margin-left: auto; font-size: 11.5px; font-weight: 800; color: var(--up); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .db-chip .r2 { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .db-chip .db-stage { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 7px; flex-shrink: 0; }
  .db-chip .db-stage.done { background: var(--up-soft); color: var(--up); }
  .db-chip .db-stage.hold { background: var(--accent-soft); color: var(--accent-deep); }
  .db-chip .nt { font-size: 10.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .db-chip .db-prob2 { margin-left: auto; font-size: 11px; font-weight: 800; color: var(--ink2); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .db-chip .db-prob2.up { color: var(--up); }
  .db-chip .db-prob2.down { color: var(--down); }
  /* 口径三色标签（R88）：利好=红 / 利空=绿 / 中性=灰 */
  .db-sent { font-size: 10px; font-weight: 800; border-radius: 999px; padding: 1px 7px; flex-shrink: 0; letter-spacing: .5px; line-height: 1.5; }
  .db-sent.bull { background: var(--up-soft); color: var(--up); border: 1px solid var(--up); }
  .db-sent.bear { background: var(--down-soft); color: var(--down); border: 1px solid var(--down); }
  .db-sent.neu  { background: #eef1f5; color: var(--ink2); border: 1px solid #d6dee7; }
  .db-chip .db-sent { position: absolute; top: 6px; right: 7px; }
  .db-empty { font-size: 13px; color: var(--ink2); padding: 14px 4px; }

  /* 弹窗左右箭头切换（R88） */
  .db-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--accent-deep); font-size: 20px; line-height: 1; cursor: pointer; box-shadow: 0 4px 14px rgba(17,17,26,.18); display: flex; align-items: center; justify-content: center; z-index: 5; transition: all .15s ease; -webkit-tap-highlight-color: transparent; }
  .db-nav:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-50%) scale(1.06); }
  .db-nav.db-prev { left: max(12px, calc(50% - 444px)); }
  .db-nav.db-next { right: max(12px, calc(50% - 444px)); }
  @media (max-width: 700px) { .db-nav { width: 34px; height: 34px; font-size: 17px; } .db-nav.db-prev { left: 10px; } .db-nav.db-next { right: 10px; } }

  /* K线弹窗 */
  #db-modal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(30,45,60,.45); align-items: center; justify-content: center; padding: 20px; }
  #db-modal.open { display: flex; }
  .db-modal-box { background: var(--paper); border-radius: var(--radius); padding: 20px 22px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; box-shadow: 0 20px 60px rgba(17,17,26,.25); }
  .db-modal-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 8px; }
  .db-modal-head .nm { font-size: 18px; font-weight: 900; }
  .db-modal-head .cd2 { font-size: 12px; color: var(--ink2); }
  .db-modal-close { margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 999px; width: 30px; height: 30px; font-size: 15px; cursor: pointer; color: var(--ink2); line-height: 1; }
  .db-modal-close:hover { border-color: var(--accent); color: var(--accent-deep); }
  .db-modal-meta { font-size: 12.5px; color: var(--ink); line-height: 1.8; margin-bottom: 10px; }
  .db-modal-meta .lab { color: var(--ink2); }
  .db-kline svg { width: 100%; height: auto; display: block; }
  .db-refs { margin-top: 10px; font-size: 12px; color: var(--ink2); line-height: 1.7; border-top: 1px dashed var(--line); padding-top: 8px; }
  .db-refs b { color: var(--accent-deep); }
  .db-ref-p { margin: 5px 0 2px; color: var(--ink); }
  .db-ref-sum { color: var(--ink2); font-size: 11.5px; line-height: 1.65; margin: 2px 0 0 2px; }
  .db-src-tag { display: inline-block; font-size: 9.5px; font-weight: 700; color: var(--accent-deep); background: var(--accent-soft); border-radius: 4px; padding: 0 4px; margin-left: 2px; vertical-align: middle; }
  .db-kline { position: relative; }
  .db-tip { position: absolute; display: none; transform: translateX(-50%); background: var(--paper); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 10px; font-size: 11px; line-height: 1.6; color: var(--ink); box-shadow: 0 6px 18px rgba(17,17,26,.18); pointer-events: none; z-index: 10; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .db-tip b.up { color: var(--up); }
  .db-tip b.down { color: var(--down); }

  footer.disclaimer { margin-top: 36px; font-size: 12px; color: var(--ink2); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; line-height: 1.7; box-shadow: var(--shadow); }
</style>
</head>
<body>
<div class="wrap">
  <div class="float-group" id="float-group" title="整组可拖动到任意位置">
    <button class="mkt-toggle" id="mkt-toggle" title="切换到美股看板" aria-label="切换A股/美股看板" onclick="switchTab(currentMarket==='ashare'?'us':'ashare')">🐼</button>
    <button class="db-entry" id="db-entry" title="断板反包（点击进入）" aria-label="断板反包"><span class="db-emoji">💰</span><span class="db-badge" id="db-badge"></span></button>
  </div>
  <div class="hero">
    <h1>每日市场看板</h1>

    <span class="updated" id="updatedAt"></span>
    <div class="schedule-note">自动更新：A股 周一至五 16:00 收盘后 · 美股 周一至五 08:30 隔夜收盘（含AI预测与A股映射） · 周日 23:00 全球要闻 + 周一开盘预判</div>
  </div>

  <div id="weekend-news"></div>
  <div id="ai-prediction"></div>

  <div class="tabbar">

    <div class="tab" id="tab-u" onclick="switchTab('us')">美 股</div>
  </div>
  <div id="content"></div>

  <div id="news-slot"></div>

  <div class="card" id="pano-card">
    <h2>行业全景 · 美股 / 韩股 / 日经</h2>
    <div class="pano-tabs" id="pano-tabs"></div>
    <div class="pano-idx" id="pano-idx"></div>
    <div class="pano-date" id="pano-date"></div>
    <div class="pano-src" id="pano-src"></div>
    <div class="pano-grid" id="pano-grid"></div>
  </div>

  <footer class="disclaimer">
    <b>免责声明</b>：以上内容基于公开数据和量化分析，仅供参考，不构成投资建议。市场有风险，投资需谨慎。任何投资决策应结合个人风险承受能力、资金状况和投资目标独立判断，必要时咨询持牌专业机构。过往表现不预示未来收益。

      <div class="db-title">断板反包</div>
      <div class="db-date" id="db-date"></div>
    </div>
    <button class="db-entry-in" id="db-entry-in" title="返回刚刚浏览的页面">💰</button>
    <div class="db-note" id="db-note"></div>
    <div id="db-pools"></div>
  </div>
</div>

<div id="db-modal" onclick="if(event.target===this)closeDbModal()">
  <button class="db-nav db-prev" onclick="dbStep(-1)" title="上一个标的（←）">←</button>
  <button class="db-nav db-next" onclick="dbStep(1)" title="下一个标的（→）">→</button>
  <div class="db-modal-box">
    <div class="db-modal-head" id="db-modal-head"></div>
    <div class="db-modal-meta" id="db-modal-meta"></div>
    <div class="db-kline" id="db-kline"></div>
    <div class="db-refs" id="db-refs"></div>
  </div>
</div>

<div id="lb-modal" onclick="if(event.target===this)lbClose()">
  <button class="db-nav db-prev" onclick="lbStep(-1)" title="上一个连板标的（←）">←</button>
  <button class="db-nav db-next" onclick="lbStep(1)" title="下一个连板标的（→）">→</button>
  <div class="lb-modal-box">
    <div class="lb-modal-head" id="lb-modal-head"></div>
    <div class="lb-modal-meta" id="lb-modal-meta"></div>
    <div class="db-kline" id="lb-kline"></div>
    <div class="lb-story" id="lb-modal-body"></div>
  </div>
</div>

<div id="ps-modal" onclick="if(event.target===this)psClose()">
  <div class="ps-modal-box">
    <div class="ps-modal-head" id="ps-modal-head"></div>
    <div id="ps-modal-body"></div>
  </div>
</div>

<!-- 通用标的K线弹窗：页面所有成分股/标的点击均可查看日K，点击K线柱看当日涨幅；左右箭头仅在同一内容分组内切换（R94b） -->
<div id="stk-modal" onclick="if(event.target===this)stkClose()">
  <button class="db-nav db-prev" id="stk-prev" onclick="stkStep(-1)" title="同组上一个标的（←）" style="display:none">←</button>
  <button class="db-nav db-next" id="stk-next" onclick="stkStep(1)" title="同组下一个标的（→）" style="display:none">→</button>
  <button class="db-nav db-prev" id="tb-prev" onclick="tbStep(-1)" title="上一个板块（←）" style="display:none">←</button>
  <button class="db-nav db-next" id="tb-next" onclick="tbStep(1)" title="下一个板块（→）" style="display:none">→</button>
  <div class="stk-modal-box">
    <div class="db-modal-head" id="stk-modal-head"></div>
    <div class="db-modal-meta" id="stk-modal-meta"></div>
    <div class="db-kline" id="stk-kline"></div>
  </div>
</div>

<script>
var charts = [];
var currentMarket = 'ashare';
function cls(v) { return v > 0 ? "up" : (v < 0 ? "down" : "flat"); }
function fmtPct(v) { if (v === null || v === undefined) return "—"; return (v > 0 ? "+" : "") + v.toFixed(2) + "%"; }
function esc(s) { if (s === null || s === undefined) return ""; return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escAttr(s){ return esc(s).replace(/"/g, '&quot;'); }
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function dateTag(tradeDate) { var m = String(tradeDate).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[2] + "月" + m[3] + "日" : ""; }
function formatOutlook(text) {
  if (!text) return '—';
  // 兼容 object {date, content} 与 string 两种格式
  if (typeof text === 'object' && text !== null) text = text.content || text.text || '';
  text = String(text || '');
  // 按「【」标题分段，每段渲染成 <p> 实现网页内换行；微信推送端保持原始连续文本
  var segs = text.split(/(?=【)/).filter(function(s){ return s.trim(); });
  if (segs.length <= 1) return '<p style="margin:0 0 10px 0; line-height:1.7;">' + esc(text) + '</p>';
  return segs.map(function(seg){ return '<p style="margin:0 0 10px 0; line-height:1.7;">' + esc(seg.trim()) + '</p>'; }).join('');
}

// R98j：指数点击看K线——sym 优先取脚本生成的 code 字段，历史数据按名称映射兜底
var IDX_SYM = { '上证指数': 'sh000001', '深证成指': 'sz399001', '创业板指': 'sz399006', '科创50': 'sh000688', '上证50': 'sh000016' };
function renderIndexCards(indices) {
  indices = indices || [];
  var html = '<div class="idx-grid">';
  indices.forEach(function (d) {
    var c = cls(d.changePct);
    var sym = String(d.code || IDX_SYM[d.name] || '').trim();
    var t0 = sym ? ' data-stk="' + escAttr(sym + '|' + (d.name || '') + '|指数日K') + '" style="cursor:pointer" title="点击查看K线"' : '';
    html += '<div class="idx"' + t0 + '><div class="nm">' + esc(d.name) + '</div>' +
      '<div class="pt ' + c + '">' + (d.point === null || d.point === undefined ? "—" : d.point.toLocaleString("zh-CN", { minimumFractionDigits: 2 })) + '</div>' +
      '<div class="pc ' + c + '">' + fmtPct(d.changePct) + '</div>' +
      (d.note ? '<div class="nt">' + esc(d.note) + '</div>' : '') + '</div>';
  });
  return html + '</div>';
}

function renderBreadth(b) {
  b = b || {};
  var items = [];
  if (b.up !== null && b.up !== undefined) {
    items.push('上涨 <b class="up">' + b.up + '</b> 家');
    items.push('下跌 <b class="down">' + b.down + '</b> 家');
    if (b.flat) items.push('平盘 <b>' + b.flat + '</b> 家');
    if (b.limitUp !== null && b.limitUp !== undefined) items.push('涨停 <b class="up">' + b.limitUp + '</b> 家');
    if (b.limitDown !== null && b.limitDown !== undefined) items.push('跌停 <b class="down">' + b.limitDown + '</b> 家');
  }
  return '<div class="breadth">' + items.map(function (s) { return '<span>' + s + '</span>'; }).join('') +
    '<span style="color:var(--ink2)">' + esc(b.volumeText || '') + '</span></div>';
}

// 板块成分股 TOP 列表：A股 tops 含成分股 TOP5（涨前5/跌前5），美股 tops 含代表标的（1-2只）。
// 兼容旧数据：仅有 leader 字段时按旧规则归一化。
function renderTops(s, isUp) {
  var arr = s.tops || null;
  if (!arr || !arr.length) {
    var l = s.leader;
    if (typeof l === 'object' && l) {
      if (!isUp && l.laggard && l.laggard.name) {
        var g = l.laggard;
        arr = [g.name + ' ' + (g.changePct >= 0 ? '+' : '') + g.changePct + '%'];
      } else if (l.name) {
        arr = [l.name + (l.changePct !== null && l.changePct !== undefined ? ' ' + (l.changePct >= 0 ? '+' : '') + l.changePct + '%' : '')];
      }
    } else if (typeof l === 'string' && l.trim()) {
      arr = l.split(/[；;]/).map(function (x) { return x.trim(); }).filter(Boolean);
      if (!arr.length) arr = [l.trim()];
    }
  }
  if (!arr || !arr.length) return '';
  var n = Math.min(arr.length, 5);
  var label = isUp ? '板块领涨 TOP' + n : '板块领跌 TOP' + n;
  var bname = s.name || '';
  var chips = arr.slice(0, 5).map(function (it, idx) {
    var name, pct, code0 = '';
    if (typeof it === 'object') { name = it.name || ''; pct = it.changePct; code0 = it.code || ''; }
    else if (typeof it === 'string') {
      var mm = it.match(/^(.*?)[\s]*([+-]?\d+(?:\.\d+)?%?)\s*([^【]*?)(【[^】]*】)?\s*$/);
      if (mm) { name = mm[1].replace(/[：:]\s*$/, ''); pct = parseFloat(mm[2]); var tail = (mm[3] || '').trim(); if (mm[4]) tail += ' ' + mm[4]; if (tail) name = (name ? name + ' ' : '') + tail; }
      else { name = it; pct = null; }
    }
    var cls = (pct === null || pct === undefined) ? '' : (pct >= 0 ? 'u' : 'd');
    var pctStr = (pct === null || pct === undefined) ? '' : (pct >= 0 ? '+' : '') + pct + '%';
    // 悬停/点击信息：所属板块 + 领涨/领跌位次 + 今开涨跌幅（盘中形态）
    var op = (typeof it === 'object' && it) ? it.openPct : null;
    var info = name + (pctStr ? ' ' + pctStr : '');
    if (bname) info += ' · ' + bname + (isUp ? ' 领涨第' : ' 领跌第') + (idx + 1) + '位';
    if (op !== null && op !== undefined) info += ' · 今开 ' + (op >= 0 ? '+' : '') + op + '%' + (op > 1 ? '（高开）' : op < -1 ? '（低开）' : '（平开）');
    return '<span class="tchip" data-stk="' + escAttr(code0) + '|' + escAttr(name) + '|' + escAttr(info) + '" title="' + escAttr(info + '（点击查看K线）') + '"><b>' + esc(name) + '</b>' + (pctStr ? '<span class="tp ' + cls + '">' + pctStr + '</span>' : '') + '<span class="nt">' + esc(info) + '</span></span>';
  }).join('');
  return '<div class="reason-tops"><span class="tops-h">' + label + '</span>' + chips + '</div>';
}

function renderReasons(list, tradeDate, isUp) {
  list = list || [];
  var html = '';
  var tag = dateTag(tradeDate);
  list.forEach(function (s) {
    // R98b：兼容无 reason 的板块条目（同花顺/东财行业页直接生成，无 AI 异动原因）
    var hasReason = !!(s.reason && s.reason.title);
    // 板块名与涨跌幅合并为一枚胶囊：涨=红底白字，跌=绿底白字；无涨跌幅时退回白底胶囊
    // R99h：板块胶囊点击看板块日K（同花顺行业口径，与断板页 TOP10 板块K线同款弹窗）；
    // 有 thsCode 才可点；脚本内嵌的 s.kline（16:00 update_ashare_sectors 附带）注册进 _SEC_KL 供弹窗直读
    var klAttr = s.thsCode ? ' onclick="openSectorKline(\'' + esc(s.name) + '\',\'' + esc(s.thsCode) + '\')" title="点击查看板块日K线" style="cursor:pointer"' : '';
    if (s.kline && s.thsCode) { window._SEC_KL = window._SEC_KL || {}; window._SEC_KL[s.thsCode] = s.kline; }
    var pctHtml = (s.pct !== null && s.pct !== undefined)
      ? '<span class="pct ' + (s.pct >= 0 ? 'u' : 'd') + '"' + klAttr + '>' + esc(s.name) + ' ' + fmtPct(s.pct) + '</span>'
      : '<span class="sec"' + klAttr + '>' + esc(s.name) + '</span>';
    html += '<div class="reason-block ' + (isUp === false ? 'rz-down' : 'rz-up') + '"><div class="reason-head">' +
      (hasReason ? '<span class="date-tag">' + esc(tag) + '异动原因</span>' : '') +
      pctHtml +
      (hasReason ? '<span class="kw">' + esc(s.reason.title) + '</span>' : '') +
      '</div>' +
      renderTops(s, isUp) +
      ((s.upCount !== null && s.upCount !== undefined) ? '<div class="reason-sub">板块内 涨 <b class="up">' + s.upCount + '</b> 家 / 跌 <b class="down">' + (s.downCount || 0) + '</b> 家' + (s.netInflow !== null && s.netInflow !== undefined ? ' · 主力净流入 <b class="' + (s.netInflow >= 0 ? 'up' : 'down') + '">' + (s.netInflow >= 0 ? '+' : '') + s.netInflow + ' 亿</b>' : '') + '</div>' : '') +
      (hasReason ? '<div class="reason-body"><b class="label">行业原因（' + esc(tag) + '发布）：</b>' + esc(s.reason.detail) + '</div>' : '') +
      '</div>';
  });
  return html;
}

function barOption(names, values, unit) {
  var up = cssVar('--up'), down = cssVar('--down'), ink = cssVar('--ink'), ink2 = cssVar('--ink2'), line = cssVar('--line');
  var FONT = 'Microsoft YaHei, 微软雅黑, PingFang SC, sans-serif';
  return {
    textStyle: { fontFamily: FONT },
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      formatter: function (ps) { var p = ps[0]; return '<b>' + p.name + '</b><br/>' + (p.value > 0 ? '+' : '') + p.value + unit; },
      backgroundColor: 'rgba(255,255,255,0.96)', borderColor: line, textStyle: { color: ink, fontSize: 12 }, extraCssText: 'box-shadow:0 2px 8px rgba(0,0,0,0.08);border-radius:10px;'
    },
    grid: { left: 10, right: 60, top: 18, bottom: 18, containLabel: true },
    xAxis: {
      type: 'value',
      axisLabel: { fontSize: 11, color: ink2, formatter: function (v) { return (v > 0 ? '+' : '') + v + unit; } },
      splitLine: { lineStyle: { type: 'dashed', color: line } },
      axisLine: { show: false }, axisTick: { show: false }
    },
    yAxis: {
      type: 'category', inverse: true, data: names,
      axisLabel: { fontSize: 12.5, color: ink, fontWeight: 600 },
      axisLine: { show: false }, axisTick: { show: false }
    },
    series: [{
      type: 'bar', barWidth: 16,
      data: values.map(function (v) {
        return { value: v, itemStyle: { color: v >= 0 ? up : down, borderRadius: v >= 0 ? [0, 8, 8, 0] : [8, 0, 0, 8] } };
      }),
      label: {
        show: true, position: 'right', fontSize: 11.5, color: ink, fontWeight: 600,
        formatter: function (p) { return (p.value > 0 ? '+' : '') + p.value + unit; }
      }
    }]
  };
}

/* R99e→R99g：A股/美股各自记忆浏览位置（sessionStorage 持久化，重进页面不丢）；
   切换后定位下限=tab 区顶部（用户要求：从 tab/内容区开始，而不是页首 hero），有更深的记忆位置则恢复 */
var mktScroll = { ashare: 0, us: 0 };
try {
  var _ms = JSON.parse(sessionStorage.getItem('mktScroll') || 'null');
  if (_ms && typeof _ms.ashare === 'number' && typeof _ms.us === 'number') mktScroll = _ms;
} catch (e) {}
function saveMktScroll() { try { sessionStorage.setItem('mktScroll', JSON.stringify(mktScroll)); } catch (e) {} }
function syncMktToggle() {
  var t = document.getElementById('mkt-toggle');
  if (!t) return;
  // 图标显示「当前所在市场」：A股页显示 🐼，美股页显示 🦅（R99f）
  t.textContent = currentMarket === 'ashare' ? '🐼' : '🦅';
  t.title = currentMarket === 'ashare' ? '切换到美股看板' : '切换到A股看板';
}
function switchTab(market) {
  if (currentMarket !== market) {
    mktScroll[currentMarket] = window.scrollY || document.documentElement.scrollTop || 0;
    saveMktScroll();
  }
  document.getElementById('tab-a').classList.toggle('active', market === 'ashare');
  document.getElementById('tab-u').classList.toggle('active', market === 'us');
  currentMarket = market;
  render(market);
  syncMktToggle();
  var tabEl = document.querySelector('.tabbar');
  var tabTop = tabEl ? tabEl.getBoundingClientRect().top + (window.scrollY || document.documentElement.scrollTop || 0) - 12 : 0;
  var target = Math.max(mktScroll[market] || 0, tabTop);
  mktScroll[market] = target;
  saveMktScroll();
  window.scrollTo(0, target);
}

/* R99e：板块卡 h2 灰色更新时间角标（A股=数据交易日；美股=tradeDate，自带「（美东）」后缀） */
function h2Date(d) {
  return (d && d.tradeDate) ? ' <span class="h2-date">' + esc(d.tradeDate) + '</span>' : '';
}

function render(market) {
  charts.forEach(function (c) { c.dispose(); });
  charts = [];
  var d = window.DASHBOARD_DATA[market] || {};
  var isA = market === 'ashare';

  var html = '';
  html += '<div class="card"><div class="status-line">' + esc(d.tradeDate) + ' · ' + esc(d.status) + '</div><div class="summary">' + esc(d.summary) + '</div></div>';

  html += '<div class="card"><h2>大盘指数' + h2Date(d) + '</h2>' + renderIndexCards(d.indices) + '<div style="height:10px"></div>' + renderBreadth(d.breadth) + '</div>';

  html += '<div class="card"><h2>大盘趋势研判' + h2Date(d) + '</h2><div class="outlook">' + formatOutlook(d.outlook) + '</div></div>';

  var _ssMap = {'ths': '同花顺行业口径', 'em': '东财行业口径', 'prev': '上一轮数据'};
  var _ssTag = _ssMap[d.sectorSource] ? ' <span class="src-tag">' + _ssMap[d.sectorSource] + '</span>' : '';
  html += '<div class="card"><h2>领涨板块' + _ssTag + h2Date(d) + '</h2>' + renderReasons(d.sectorsUp, d.tradeDate, true) + '</div>';

  html += '<div class="card"><h2>调整 / 领跌板块' + _ssTag + h2Date(d) + '</h2>' +
    (d.sectorNote ? '<div class="src-line">' + esc(d.sectorNote) + '</div>' : '') +
    renderReasons(d.sectorsDown, d.tradeDate, false) + '</div>';

  // R98j：题材掘金仅 A股页展示（美股页模块已按用户要求下线）
  if (isA && d.themePicks && d.themePicks.length) {
    html += '<div class="card"><h2>题材掘金 · 个股事件驱动' + h2Date(d) + '</h2>' + renderThemePicks(d.themePicks, d.tradeDate) + '</div>';
  }

  if (isA && d.lianban && d.lianban.length) {
    var lbHtml = renderLianban(d.lianban);
    if (lbHtml) {
      html += '<div class="card"><h2>🔥 连板梯队' + h2Date(d) + '</h2>' + lbHtml + '</div>';
    }
  }

  // 主力资金流向紧贴行业全景上方（2026-09-20 用户要求：挪到行业全景上面）
  if (isA) {
    html += '<div class="card"><h2>主力资金流向' + (d.tradeDate ? '<span class="h2-date">' + esc(d.tradeDate) + '</span>' : '') + '</h2>';
    if (d.fundNote) html += '<div class="note-line">' + esc(d.fundNote) + '</div>';
    html += '<div id="chart-fund" class="chart-tall"></div></div>';
  }

  document.getElementById('content').innerHTML = html;

  // R97：全球要闻（含宏观/财经/投行）独立渲染到 #news-slot——紧贴行业全景上方（2026-09-23 用户要求）
  var newsBox = document.getElementById('news-slot');
  if (newsBox) newsBox.innerHTML = renderNewsCard(d, market);

  if (isA) {
    var fIn = d.fundIn || [], fOut = d.fundOut || [];
    var fNames = fIn.map(function (f) { return f.name; }).concat(fOut.map(function (f) { return f.name; }));
    var fVals = fIn.map(function (f) { return f.value; }).concat(fOut.map(function (f) { return f.value; }));
    if (fNames.length) {
      var c2 = echarts.init(document.getElementById('chart-fund'));
      c2.setOption(barOption(fNames, fVals, ' 亿'));
      charts.push(c2);
    }
  }
}

/* 行业全景（沿用原版：市场 tab + 板块网格） */
var panoCurrent = 'ashare';
var panoExpanded = false;
var PANO_SHOW_MAX = 40;
// R92 粒度降噪：东财细分板块（约120个，含「其他家电Ⅱ/Ⅲ」等多级细分）合并为父级口径——
// 去掉尾部层级罗马数字（Ⅰ/Ⅱ/Ⅲ…）与「其他」前缀后同名合并，取组内最高涨幅代表，并标注细分数。
function normPanoName(n) {
  var s = String(n || '').trim();
  s = s.replace(/[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]$/, '');
  s = s.replace(/([\u4e00-\u9fa5])(III|II|IV|V|I)$/, '$1');
  if (s.indexOf('其他') === 0 && s.length >= 3) s = s.slice(2);
  return s;
}
function mergePanoItems(items) {
  var merged = {}, order = [];
  (items || []).forEach(function (it) {
    var key = normPanoName(it && it.name);
    if (!key) return;
    if (!merged[key]) { merged[key] = { name: key, pct: null, subs: 0, subsList: [] }; order.push(key); }
    merged[key].subs++;
    if (it && it.name) merged[key].subsList.push({ name: String(it.name), pct: (typeof it.pct === 'number') ? it.pct : null });
    if (merged[key].pct === null && typeof it.pct === 'number') merged[key].pct = it.pct;
  });
  return order.map(function (k) { return merged[k]; });
}
function renderPano() {
  var pano = window.DASHBOARD_DATA.panorama;
  if (!pano || !pano.markets) { document.getElementById('pano-card').style.display = 'none'; return; }
  var PANO_IDX_SHORT = { '道琼斯': '道指', '标普500': '标指', '纳斯达克': '纳指' };
  function panoTabIdx(m) {
    var out = [];
    if (m.key === 'us') {
      var ui = ((window.DASHBOARD_DATA.us || {}).indices) || [];
      ['道琼斯', '标普500', '纳斯达克'].forEach(function (n) {
        ui.forEach(function (i) { if (i.name === n && i.changePct != null) out.push({ name: PANO_IDX_SHORT[n], pct: i.changePct }); });
      });
    } else if (m.key === 'kr' && m.indices && m.indices.length) {
      out.push({ name: 'KOSPI', pct: m.indices[0].changePct });
    } else if (m.key === 'jp' && m.indices && m.indices.length) {
      out.push({ name: '日经225', pct: m.indices[0].changePct });
    } else if (m.key === 'ashare' && m.indices && m.indices.length) {
      var ASHORT = { '上证指数': '上证', '深证成指': '深成', '创业板指': '创业板', '科创50': '科创50', '上证50': '上证50' };
      m.indices.slice(0, 3).forEach(function (i) { out.push({ name: ASHORT[i.name] || i.name, pct: i.changePct }); });
    }
    return out;
  }
  var tabsHtml = '';
  pano.markets.forEach(function (m) {
    var nums = panoTabIdx(m).map(function (i) {
      return '<span class="tn n-' + (i.pct >= 0 ? 'up' : 'down') + '">' + esc(i.name) + fmtPct(i.pct) + '</span>';
    }).join('');
    tabsHtml += '<div class="pano-tab' + (m.key === panoCurrent ? ' active' : '') + '" onclick="switchPano(\'' + m.key + '\')">' + esc(m.name) + nums + '</div>';
  });
  document.getElementById('pano-tabs').innerHTML = tabsHtml;
  var cur = pano.markets.filter(function (m) { return m.key === panoCurrent; })[0] || pano.markets[0];
  // 手机端 tab 内不嵌指数，改为 tabs 下方独立指数行（桌面端隐藏，指数仍在 tab 内）
  var idxEl = document.getElementById('pano-idx');
  if (idxEl) {
    idxEl.innerHTML = panoTabIdx(cur).map(function (i) {
      return '<span class="tn n-' + (i.pct >= 0 ? 'up' : 'down') + '">' + esc(i.name) + fmtPct(i.pct) + '</span>';
    }).join('');
  }
  document.getElementById('pano-date').textContent = '数据时点：' + cur.date;
  var srcEl = document.getElementById('pano-src');
  if (srcEl) {
    var _src = (window.DASHBOARD_DATA.ashare || {}).sectorSource;
    var _srcMap = { 'ths': '同花顺行业口径', 'em': '东财行业口径', 'prev': '上一轮数据（源暂不可用）' };
    srcEl.textContent = '板块来源：' + (_srcMap[_src] || '—');
  }
  var html = '';
  // 行业全景板块按当日涨幅降序排列（无涨幅的置底）
  var panoItems = (cur.items || []).slice().sort(function (a, b) {
    var pa = (a && typeof a.pct === 'number') ? a.pct : null;
    var pb = (b && typeof b.pct === 'number') ? b.pct : null;
    if (pa === null && pb === null) return 0;
    if (pa === null) return 1;
    if (pb === null) return -1;
    return pb - pa;
  });
  // R92/R97f：A股板块口径处理。同花顺已较细粒度（含非金属材料/厨卫电器/元件等独立行业），
  // 无需合并罗马数字/其他前缀；东财/新浪细分板块才需聚合成父级口径。
  if (cur.key === 'ashare') {
    var _src2 = (window.DASHBOARD_DATA.ashare || {}).sectorSource;
    if (_src2 === 'ths') {
      window._panoMerged = panoItems;
    } else {
      panoItems = mergePanoItems(panoItems); window._panoMerged = panoItems;
    }
  }
  var shown = panoExpanded ? panoItems : panoItems.slice(0, PANO_SHOW_MAX);
  var isAshareTab = cur.key === 'ashare';
  shown.forEach(function (it) {
    var c = cls(it.pct);
    // 含N个细分：内联小标签紧跟板块名，点击弹出细分板块涨幅明细
    var subTag = (it.subs > 1)
      ? '<span class="subtag" onclick="showPanoSubs(\'' + escAttr(it.name) + '\')" title="点击查看细分板块涨幅">含' + it.subs + '个细分 ▾</span>'
      : '';
    // R98h：A股板块指标行（主力净流入/涨停数/领涨股/涨跌家数/近5日涨幅，缺字段条件渲染）
    var meta = '';
    if (isAshareTab) {
      var segs = [];
      if (typeof it.netInflow === 'number')
        segs.push('<span>净流</span><b class="' + (it.netInflow >= 0 ? 'up' : 'down') + '">' + (it.netInflow >= 0 ? '+' : '') + it.netInflow.toFixed(2) + '亿</b>');
      if (it.ztCount != null)
        segs.push('<span>涨停</span><b class="' + (it.ztCount > 0 ? 'up' : '') + '">' + it.ztCount + '</b>');
      if (it.lead)
        segs.push('<span>领涨</span><b>' + esc(it.lead) + (typeof it.leadPct === 'number' ? '<i class="' + (it.leadPct >= 0 ? 'up' : 'down') + '">' + fmtPct(it.leadPct) + '</i>' : '') + '</b>');
      if (it.upCount != null && it.downCount != null)
        segs.push('<span>涨/跌</span><b><i class="up">' + it.upCount + '</i>/<i class="down">' + it.downCount + '</i></b>');
      if (typeof it.pct5 === 'number')
        segs.push('<span>5日</span><b class="' + (it.pct5 >= 0 ? 'up' : 'down') + '">' + fmtPct(it.pct5) + '</b>');
      if (segs.length) meta = '<div class="meta">' + segs.join('<em>·</em>') + '</div>';
    }
    html += '<div class="pano-cell' + (meta ? ' pano-rich' : '') + '"><div class="nm">' + esc(it.name) + subTag +
      (it.ref ? '<span class="ref">' + esc(it.ref) + '</span>' : '') + '</div>' +
      '<div class="pc ' + c + '">' + fmtPct(it.pct) + '</div>' + meta + '</div>';
  });
  if (panoItems.length > PANO_SHOW_MAX) {
    if (panoExpanded) {
      html += '<div class="pano-more"><button onclick="panoExpanded=false;renderPano()">收起，只看前 ' + PANO_SHOW_MAX + ' 个板块</button></div>';
    } else {
      html += '<div class="pano-more"><button onclick="panoExpanded=true;renderPano()">展开全部 ' + panoItems.length + ' 个板块</button></div>';
    }
  }
  document.getElementById('pano-grid').innerHTML = html;
}

function newsTag(item) {
  // 国内(🇨🇳)/国际(🌍)要闻识别，未命中给 🌐；title 优先（与微信推送一致）
  var DOM = ['国常会','证监会','央行','国务院','工信部','财政部','发改委','中方','我国','国内','A股','港股','政策','十五五','券商','印花税','北向','两融','逆回购','LPR','光博会','算力网','算力大会','人民币','出口','关税'];
  var INTL = ['美联储','美股','纳指','道指','标普','美债','美元','加息','降息','特朗普','白宫','中东','沙特','伊朗','以色列','俄乌','俄罗斯','乌克兰','地缘','油价','原油','黄金','能源','油运','日本','日经','日元','韩国','KOSPI','亚太','欧洲','英国','英伟达','苹果','特斯拉','半导体','芯片'];
  var title = (item.title||'').trim();
  var summary = (item.summary||'').trim();
  var i;
  for (i=0;i<DOM.length;i++) if (title.indexOf(DOM[i])>=0) return '🇨🇳';
  for (i=0;i<INTL.length;i++) if (title.indexOf(INTL[i])>=0) return '🌍';
  var text = title + ' ' + summary;
  for (i=0;i<DOM.length;i++) if (text.indexOf(DOM[i])>=0) return '🇨🇳';
  for (i=0;i<INTL.length;i++) if (text.indexOf(INTL[i])>=0) return '🌍';
  return '🌐';
}

function shortDate(t) {
  // 2026-09-23 → 9/23（新闻发布时间展示用）
  var m = String(t || '').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  return m ? (parseInt(m[2], 10)) + '/' + (parseInt(m[3], 10)) : String(t || '');
}

function newsEntryInner(it, showSrc, tag, tradeDate) {
  // 单条要闻内部内容：板块标签 + 发布时间 + 方向徽标 + 标题简述 + 各板块成分股（8 只四类标的）；全球要闻卡与周末卡共用
  var dirBadge = '';
  if (it.direction) {
    // R97：红底看涨 / 绿底看跌 / 灰底中性（填充色胶囊，与 AI 预测方向徽标同款）
    var dcl = it.direction === '看涨' ? 'dir-up' : (it.direction === '看跌' ? 'dir-down' : 'dir-flat');
    dirBadge = '<span class="dir-badge ' + dcl + '">' + esc(it.direction) + '</span>';
  }
  // R97：发布时间——板块名与方向徽标之间，当日新闻标「今日」，让用户一眼区分当天/前几天的新闻
  var timeHtml = '';
  if (it.time) {
    var isToday = tradeDate && String(it.time).slice(0, 10) === String(tradeDate).slice(0, 10);
    timeHtml = '<span class="nc-time' + (isToday ? ' today' : '') + '">' + (isToday ? '今日 ' : '') + shortDate(it.time) + '</span>';
  }
  var perspTag = tag ? '<span class="persp-tag">' + esc(tag) + '</span>' : '';
  var s = '<div class="nc-theme">' + esc(it.sector || '') + timeHtml + dirBadge + perspTag + '</div>';
  var dtlFull = (it.title || '') + ' — ' + (it.summary || '');
  s += '<div class="nc-dtl" title="' + escAttr(dtlFull) + '"><b>' + esc(it.title || '') + '</b> — ' + esc(it.summary || '') + '</div>';
  (it.impacts || []).forEach(function (im) {
    if (!im.stocks || !im.stocks.length) return;
    var impTheme = im.theme || im.sector || '';
    s += '<div class="nc-imp">' + (impTheme ? '<span class="nc-imp-theme">' + esc(impTheme) + '</span>' : '') + (im.horizon ? '<span class="nc-imp-hz">' + esc(im.horizon) + '</span>' : '');
    s += '<div class="nc-stocks">';
    im.stocks.forEach(function (st) {
      s += '<span class="stock-chip" data-stk="' + escAttr((st.code || '') + '|' + (st.name || '') + '|' + (st.note || '')) + '" title="' + escAttr((st.name || '') + ' ' + (st.code || '') + (st.note ? ' · ' + st.note : '')) + '（点击查看K线）"><b>' + esc(st.name || '') + '</b><span class="cd">' + esc(st.code || '') + '</span>' + (st.note ? '<span class="nt">' + esc(st.note) + '</span>' : '') + '</span>';
    });
    s += '</div></div>';
  });
  if (showSrc && it.source) s += '<div class="nc-src">来源：' + esc(it.source) + '</div>';
  return s;
}

function renderNewsCard(d, market) {
  // A股/美股共用：大标题「全球要闻」，桌面两栏按行配对（同行等高、左右对齐），手机单列组内重排
  if (!d) return '';
  var bn = d.bullNews||[], be = d.bearNews||[];
  // R99d：宏观/财经/投行三栏按方向排序——看涨靠前、中性居中、看跌靠后（稳定排序，同向保持原序）
  function dirRank(d){ return d === '看涨' ? 0 : (d === '看跌' ? 2 : 1); }
  function dirSort(a, b){ return dirRank(a.direction) - dirRank(b.direction); }
  var intl = (d.intlNews||[]).slice().sort(dirSort);
  var bank = (d.bankViews||[]).slice().sort(dirSort);
  var macro = (d.macroNews||[]).slice().sort(dirSort);
  if (!bn.length && !be.length && !intl.length && !bank.length && !macro.length) return '';
  var itemHtml = function (it, dir) {
    return '<div class="news-cell ' + dir + '">' + newsEntryInner(it, false, '短线·盘面', d.tradeDate) + '</div>';
  };
  // 桌面：第 i 行 = 利好第 i 条 + 利空第 i 条（网格同行等高，左右始终对齐）
  // 手机(≤700px)：单列 + order 重排为 利好标题→利好条目→利空标题→利空条目
  var html = '<div class="wk-card"><div class="wk-head"><h2>全球要闻</h2>'
    + '<span class="date">' + esc(d.tradeDate||'') + '</span></div>';
  if (bn.length || be.length) {
    html += '<div class="news-cols">';
    html += '<div class="nc-head bull">利好方向</div><div class="nc-head bear">利空方向</div>';
    var nRows = Math.max(bn.length, be.length);
    for (var i = 0; i < nRows; i++) {
      html += i < bn.length ? itemHtml(bn[i], 'bull').replace('news-cell bull"', 'news-cell bull p-bull"') : '<div class="news-cell ghost-slot"></div>';
      html += i < be.length ? itemHtml(be[i], 'bear').replace('news-cell bear"', 'news-cell bear p-bear"') : '<div class="news-cell ghost-slot"></div>';
    }
    if (!nRows) html += '<div class="news-cell bull p-bull"><div class="nc-empty">今日暂无</div></div><div class="news-cell bear p-bear"><div class="nc-empty">今日暂无</div></div>';
    html += '</div>';
  }
  // 宏观（央行 / 通胀 / 大宗 / 美债 / 汇率）——顺序（R68 定稿）：宏观 → 彭博/路透/WSJ → 投行观点
  if (macro.length) {
    html += '<div class="wk-section macro"><h4>宏观 · 央行 / 通胀 / 大宗 / 美债</h4>';
    macro.forEach(function (it) { html += '<div class="wk-item wk-dir-' + (it.direction === '看涨' ? 'up' : (it.direction === '看跌' ? 'down' : 'flat')) + '">' + newsEntryInner(it, true, '宏观·事件', d.tradeDate) + '</div>'; });
    html += '</div>';
  }
  // 视角标题（R91h）：A股页用国内财经媒体视角（卡片来源已切财联社/华尔街见闻/证券时报），美股页保留国际通讯社视角
  if (intl.length) {
    html += '<div class="wk-section intl"><h4>' + (market === 'ashare' ? '国内财经媒体视角' : '彭博社 / 路透社 / 华尔街日报 视角') + '</h4>';
    intl.forEach(function (it) { html += '<div class="wk-item wk-dir-' + (it.direction === '看涨' ? 'up' : (it.direction === '看跌' ? 'down' : 'flat')) + '">' + newsEntryInner(it, true, '中期·海外产业', d.tradeDate) + '</div>'; });
    html += '</div>';
  }
  // 投行观点（高盛 / 大摩 / 中金 / 中信等研报级观点）
  if (bank.length) {
    html += '<div class="wk-section bank"><h4>投行观点</h4>';
    bank.forEach(function (it) { html += '<div class="wk-item wk-dir-' + (it.direction === '看涨' ? 'up' : (it.direction === '看跌' ? 'down' : 'flat')) + '">' + newsEntryInner(it, true, '机构·观点', d.tradeDate) + '</div>'; });
    html += '</div>';
  }
  if (d.source) html += '<div class="wk-src">来源：' + esc(d.source) + '</div>';
  html += '</div>';
  return html;
}

/* 题材掘金 · 个股事件驱动（方案C：在板块级复盘之外补充个股级事件归因）
   结构：themePicks = [{event, logic, stocks:[{code,name,note,chg}], why}]
   复用 .stock-chips / .stock-chip（悬停title + 点击chip-pop浮层） */
function renderThemePicks(list, tradeDate) {
  if (!list || !list.length) return '';
  var s = '';
  list.forEach(function (it) {
    s += '<div class="tp-item' + (it.direction === '看跌' ? ' tp-down' : '') + '">';
    // R97：事件行兼容 us 的 theme 字段；行尾标注发布日期，让用户知道是当天还是前几天的内容
    var ev = it.event || it.theme || '';
    if (ev) s += '<div class="tp-event">⚡ ' + esc(ev) + (tradeDate ? '<span class="nc-time">' + esc(shortDate(tradeDate)) + ' 发布</span>' : '') + '</div>';
    if (it.logic) s += '<div class="tp-logic">逻辑传导：' + esc(it.logic) + '</div>';
    var sts = it.stocks || [];
    if (sts.length) {
      s += '<div class="stock-chips">';
      sts.forEach(function (st) {
        // R97c：chg 规范为带符号百分比；R98j：兼容 AI 写回的 "+2.37%" 字符串（strip % 后解析，防双 %% bug）
        var parts = [];
        if (st.note) parts.push(st.note);
        var chgN = (typeof st.chg === 'number') ? st.chg : parseFloat(String(st.chg == null ? '' : st.chg).replace('%', ''));
        if (!isNaN(chgN)) parts.push((chgN > 0 ? '+' : '') + chgN.toFixed(2) + '%');
        var note = parts.join(' · ');
        var title = (st.name || '') + ' ' + (st.code || '') + (note ? ' · ' + note : '') + '（点击查看K线）';
        s += '<span class="stock-chip" data-stk="' + escAttr((st.code || '') + '|' + (st.name || '') + '|' + (note || '')) + '" title="' + escAttr(title) + '"><b>' + esc(st.name || '') + '</b><span class="cd">' + esc(st.code || '') + '</span>' + (note ? '<span class="nt">' + esc(note) + '</span>' : '') + '</span>';
      });
      s += '</div>';
    }
    if (it.why) s += '<div class="tp-why">' + esc(it.why) + '</div>';
    s += '</div>';
  });
  return s;
}

var LB_LIST = [];

}

function dbChipHtml(e, key, done, showSec) {

    '<span class="nt">' + esc((e.form || '').replace(/^.*?断板/, '断板')) + '</span></div></div>';
}

function dbPoolHtml(title, cls, sub, list, done, poolKey) {
  var h = '<div class="db-pool ' + cls + '"><h2>' + esc(title) + ' · ' + list.length + ' 只</h2>' +
    '<div class="db-sub">' + esc(sub) + '</div>';
  if (!list.length) return h + '<div class="db-empty">暂无标的（形态核验宁缺毋滥，无达标即如实留空）</div></div>';
  // 板块分组（R91h 排序口径）：同板块内按上涨概率降序、概率同则利好优先于中性/利空；
  // 板块之间按组内最高上涨概率降序、概率同则组内利好标的更多的板块排前。
  // R89b 紧凑排版：≥3 只的板块独立成组；1~2 只的小板块合并进末尾「其他板块」，
  // 「其他板块」内部同样按 上涨概率→利好 排序（不再按板块名排序），连续排满网格不留空位。
  var sentRank = function (e) { return e.sentiment === 'bull' ? 0 : (e.sentiment === 'bear' ? 2 : 1); };
  var stockCmp = function (x, y) {
    var p = (y.probability || 0) - (x.probability || 0);
    return p !== 0 ? p : sentRank(x) - sentRank(y);
  };
  var groups = {};
  list.forEach(function (e) { var s = e.sector || '其他'; (groups[s] = groups[s] || []).push(e); });
  var maxP = function (a) { return Math.max.apply(null, a.map(function (x) { return x.probability || 0; })); };
  var bullN = function (a) { return a.filter(function (x) { return x.sentiment === 'bull'; }).length; };
  var secKeys = Object.keys(groups).sort(function (a, b) {
    var p = maxP(groups[b]) - maxP(groups[a]);
    return p !== 0 ? p : bullN(groups[b]) - bullN(groups[a]);
  });
  var renderChips = function (arr, secName) {
    arr.forEach(function (e) {
      var key = poolKey + '|' + e.code;
      DB_INDEX[key] = e;
      DB_ORDER.push(key);
      h += dbChipHtml(e, key, done, secName);
    });
  };
  var smallMerged = [];
  secKeys.forEach(function (s) {
    var arr = groups[s].slice().sort(stockCmp);
    if (arr.length >= 3) {
      h += '<div class="db-sec">' + esc(s) + '<span class="db-sec-n">' + arr.length + ' 只</span></div><div class="db-chips">';
      renderChips(arr, null);
      h += '</div>';
    } else {
      smallMerged = smallMerged.concat(arr);
    }
  });
  if (smallMerged.length) {
    smallMerged.sort(stockCmp);
    var nSecs = secKeys.filter(function (s) { return groups[s].length < 3; }).length;
    h += '<div class="db-sec">其他板块<span class="db-sec-n">' + smallMerged.length + ' 只 · ' + nSecs + ' 个板块</span></div><div class="db-chips">';
    renderChips(smallMerged, true);
    h += '</div>';
  }
  return h + '</div>';
}

/* R99g：🐼/💰 悬浮组合并为一个整体，整组可拖拽（>6px 位移判定为拖动，否则视为点击）+ 位置记忆（floatGroupPos）；
   断板反包页内返回 💰(#db-entry-in) 与组内 💰 位置实时同步（组顶 + 组高 - 46） */
(function () {
  var de = document.getElementById('db-entry');
  var dei = document.getElementById('db-entry-in');
  if (de) de.addEventListener('click', function () { openDuanban(); });
  if (dei) dei.addEventListener('click', function () { closeDuanban(); });
  try { localStorage.removeItem('dbFloatPos'); } catch (e) {} // 清理更早版本的位置键
  var g = document.getElementById('float-group');
  if (!g) return;
  var POS_KEY = 'floatGroupPos', sx = null, sy = 0, ox = 0, oy = 0, moved = false;
  function rect() { return g.getBoundingClientRect(); }
  function place(l, t, save) {
    var r = rect(), w = r.width || 46, h = r.height || 106;
    l = Math.max(6, Math.min(l, window.innerWidth - w - 6));
    t = Math.max(6, Math.min(t, window.innerHeight - h - 6));
    g.style.left = l + 'px'; g.style.top = t + 'px';
    g.style.right = 'auto'; g.style.bottom = 'auto'; g.style.transform = 'none';
    if (dei) {
      dei.style.left = l + 'px'; dei.style.top = (t + h - 46) + 'px';
      dei.style.right = 'auto'; dei.style.bottom = 'auto';
    }
    if (save) {
      try { localStorage.setItem(POS_KEY, JSON.stringify({ lf: l / window.innerWidth, tf: t / window.innerHeight })); } catch (e) {}
    }
  }
  function applySaved() {
    try {
      var p = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
      if (p && isFinite(p.lf) && isFinite(p.tf)) place(p.lf * window.innerWidth, p.tf * window.innerHeight, false);
    } catch (e) {}
  }
  function onMove(e) {
    if (sx === null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    moved = true;
    place(ox + dx, oy + dy, false);
  }
  function onUp() {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    if (sx === null) return;
    sx = null;
    if (moved) place(rect().left, rect().top, true);
  }
  g.addEventListener('pointerdown', function (e) {
    if (e.button) return;
    sx = e.clientX; sy = e.clientY;
    var r = rect(); ox = r.left; oy = r.top; moved = false;
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
  // 拖拽结束后拦截随后派发的 click，避免误触 🐼/💰
  g.addEventListener('click', function (e) {
    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);
  window.addEventListener('resize', applySaved);
  applySaved();
})();

function dbKlineSvg(kline) {
  if (!kline || kline.length < 2) return '<div class="db-empty">暂无K线数据</div>';
  // R88：数据含近 60 根（供均线计算），只渲染近 30 根；均线基于全量序列计算
  var view = kline.slice(-30);

  var legend = '';
  MAS.forEach(function (m, mi) {
    legend += '<tspan fill="' + m[1] + '" font-weight="700">' + m[2] + '</tspan>' + (mi < 3 ? '<tspan fill="#8aa0b5">  </tspan>' : '');
    var path = '';
    for (var i = 0; i < n; i++) {
      var v = maAt(off + i, m[0]);
      if (v === null) continue;
      path += (path ? ' L ' : 'M ') + (padL + step * (i + 0.5)).toFixed(1) + ' ' + y(v).toFixed(1);
    }

  });
  svg += '<text x="' + (padL + 4) + '" y="12" font-size="10">' + legend + '</text>';
  view.forEach(function (b, i) {
    var cx = padL + step * (i + 0.5);
    var o = b[1], c = b[2], h = b[3], l = b[4], v = b[5];
    var up = c >= o, col = up ? '#f0435c' : '#0f9d78';
    svg += '<line x1="' + cx + '" y1="' + y(h) + '" x2="' + cx + '" y2="' + y(l) + '" stroke="' + col + '" stroke-width="1"/>';
    var ty = y(Math.max(o, c)), by = y(Math.min(o, c));
    svg += '<rect x="' + (cx - bw / 2) + '" y="' + ty + '" width="' + bw + '" height="' + Math.max(1, by - ty) + '" fill="' + (up ? '#fff' : col) + '" stroke="' + col + '" stroke-width="1.2"/>';
    var vy = volBot - (v / maxV) * (volBot - volTop);
    svg += '<rect x="' + (cx - bw / 2) + '" y="' + vy + '" width="' + bw + '" height="' + (volBot - vy) + '" fill="' + col + '" opacity="0.55"/>';
  });
  // R89：每根K线加透明命中区，点击显示收盘涨幅浮层
  view.forEach(function (b, i) {
    var cx = padL + step * (i + 0.5);
    var prevC = i > 0 ? view[i - 1][2] : (off > 0 ? kline[off - 1][2] : b[2]);
    var p = prevC > 0 ? (b[2] - prevC) / prevC * 100 : 0;
    svg += '<rect class="db-bar" data-day="' + esc(String(b[0] || '')) + '" data-c="' + b[2].toFixed(2) +
      '" data-pct="' + p.toFixed(2) + '" data-v="' + b[5] + '" data-cx="' + (padL + step * (i + 0.5)).toFixed(1) +
      '" x="' + (cx - step / 2).toFixed(1) + '" y="' + priceTop + '" width="' + step.toFixed(2) +
      '" height="' + (volBot - priceTop) + '" fill="transparent" style="cursor:pointer"/>';
  });
  [0, Math.floor(n / 2), n - 1].forEach(function (i) {
    var cx = padL + step * (i + 0.5), d = String(view[i][0] || '').slice(5);
    svg += '<text x="' + cx + '" y="' + (H - 6) + '" font-size="10" fill="#5a6e82" text-anchor="middle">' + esc(d) + '</text>';
  });
  svg += '<text x="' + (W - padR + 10) + '" y="' + (volTop - 4) + '" font-size="9.5" fill="#8aa0b5">成交量</text>';
  svg += '</svg>';
